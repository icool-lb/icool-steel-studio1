<style>
:root{--blue:#0d5aa7;--blue-d:#08406f;--blue-l:#e8f1fa;--orange:#f7941d;--orange-l:#fff4e3;
--bg:#eef2f7;--card:#fff;--line:#dce3ec;--line2:#eff3f8;--txt:#0f1b2d;--mut:#65758b;

width:100%;background:#fff;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--txt)}

td.num{text-align:end;font-variant-numeric:tabular-nums}

<body>
<div class="top">
  <div class="top-in">
    <div class="logo"><b>iC</b><div><span>iCOOL Reader</span><i id="sub">قراءة اليوميات وأرشفتها</i></div></div>
    <div class="sp"></div><span class="pill" id="pill">—</span>
  </div>
</div>
<div class="wrap" id="app"></div>
<div class="tabbar"><div id="tabs"></div></div>
<div id="modal"></div>
<script>
/* =========================================================
   iCOOL Reader v1.0
   تصوير الأوراق → استخراج → جدول تراكمي → قاموس يصحّح نفسه → Excel
   البيانات في IndexedDB (مساحة كبيرة تكفي آلاف الأوراق)
   ========================================================= */
const VER='v2.4';
const uid=()=>Math.random().toString(36).slice(2,9);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const n=v=>{const x=parseFloat(v);return isNaN(x)?0:x};
const fmt=v=>(Math.round(n(v)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآٱ]/g,'ا')
  .replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ؤئ]/g,'ء').replace(/[^\u0600-\u06FF0-9a-zA-Z]/g,'').toLowerCase();
const DW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const KINDS={worker:'عامل',client:'ورشة / زبون',item:'بند بضاعة',supplier:'مورّد',task:'وصف عمل',exp:'نوع مصروف'};

let D={sheets:[],rows:[],dict:[]};
let S={tab:'in',q:'',month:'',kind:'worker',rowType:'all',busy:'',prog:0,sel:null,err:'',
  cal:'',calDay:'',fFrom:'',fTo:'',fClient:'',fWorker:''};

/* ================= IndexedDB ================= */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('icool_reader',1);
  r.onupgradeneeded=()=>{const db=r.result;['sheets','rows','dict','cfg'].forEach(s=>{
    if(!db.objectStoreNames.contains(s))db.createObjectStore(s,{keyPath:'id'})})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function dbAll(store){const db=await idb();return new Promise((res,rej)=>{
  const t=db.transaction(store,'readonly'),q=t.objectStore(store).getAll();
  q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}
async function dbPut(store,objs){const db=await idb();return new Promise((res,rej)=>{
  const t=db.transaction(store,'readwrite'),o=t.objectStore(store);
  (Array.isArray(objs)?objs:[objs]).forEach(x=>o.put(x));
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbDel(store,id){const db=await idb();return new Promise((res,rej)=>{
  const t=db.transaction(store,'readwrite');t.objectStore(store).delete(id);
  t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbClear(store){const db=await idb();return new Promise((res)=>{
  const t=db.transaction(store,'readwrite');t.objectStore(store).clear();t.oncomplete=()=>res()})}
const cfgGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
const cfgSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ================= القاموس — قلب التصحيح الذاتي ================= */
/* سجل واحد لكل كلمة صحيحة، ويحمل كل الأشكال التي قُرئت بها */
function dictFind(kind,raw){
  const t=norm(raw);if(!t)return null;
  return D.dict.find(d=>d.kind===kind&&(norm(d.canon)===t||(d.variants||[]).some(v=>norm(v.v)===t)))||null;
}
function canonOf(kind,raw){const d=dictFind(kind,raw);return d?d.canon:(raw||'')}
function isKnown(kind,raw){return !!dictFind(kind,raw)}
async function learn(kind,raw,canon,confirmed){
  canon=String(canon||'').trim();if(!canon)return;
  let d=D.dict.find(x=>x.kind===kind&&norm(x.canon)===norm(canon));
  if(!d){d={id:uid(),kind,canon,variants:[],n:0,created:today(),updated:today()};D.dict.push(d)}
  d.canon=canon;
  const r=String(raw||'').trim();
  if(r&&norm(r)!==norm(canon)){
    const v=d.variants.find(x=>norm(x.v)===norm(r));
    if(v)v.n=(v.n||1)+1;else d.variants.push({v:r,n:1,first:today()});
  }
  d.n=(d.n||0)+1;d.updated=today();
  if(confirmed)d.prov=false;
  /* إن كان هذا الشكل مسجّلاً تحت كلمة أخرى، انقله */
  D.dict.forEach(o=>{if(o!==d&&o.kind===kind)o.variants=(o.variants||[]).filter(v=>norm(v.v)!==norm(r))});
  await dbPut('dict',D.dict.filter(x=>x.kind===kind));
}
async function mergeCanon(kind,fromCanon,toCanon){
  const a=D.dict.find(x=>x.kind===kind&&norm(x.canon)===norm(fromCanon));
  const b=D.dict.find(x=>x.kind===kind&&norm(x.canon)===norm(toCanon));
  if(!a||!b||a===b)return;
  b.variants=[...(b.variants||[]),{v:a.canon,n:a.n||1,first:a.created},...(a.variants||[])];
  b.n=(b.n||0)+(a.n||0);b.updated=today();
  D.dict=D.dict.filter(x=>x!==a);
  await dbClear('dict');await dbPut('dict',D.dict);
}
/* تشابه لاقتراح التصحيح */
function sim(a,b){
  a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 1;
  const m=a.length,k=b.length,dp=Array.from({length:m+1},(_,i)=>[i,...Array(k).fill(0)]);
  for(let j=0;j<=k;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=k;j++)
    dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return 1-dp[m][k]/Math.max(m,k);
}
function suggest(kind,raw){
  let best=null,bs=0;
  D.dict.filter(d=>d.kind===kind).forEach(d=>{
    const s=Math.max(sim(raw,d.canon),...(d.variants||[]).map(v=>sim(raw,v.v)));
    if(s>bs){bs=s;best=d}});
  return bs>=.62?{d:best,s:bs}:null;
}
/* كل القيم الخام غير المعروفة، مجمّعة */
function unknowns(){
  const map={};
  D.rows.forEach(r=>{
    fieldsOf(r.type).forEach(f=>{
      if(!f.kind)return;const raw=r[f.k];if(!raw)return;
      if(isKnown(f.kind,raw))return;
      const key=f.kind+'|'+norm(raw);
      map[key]=map[key]||{kind:f.kind,fk:f.k,raw,n:0,rows:[]};
      map[key].n++;map[key].rows.push(r.id);
    })});
  return Object.values(map).sort((a,b)=>b.n-a.n);
}
/* ================= أعمدة كل نوع صف ================= */
function fieldsOf(type){
  if(type==='labor')return [
    {k:'worker',t:'العامل',kind:'worker'},{k:'from',t:'من'},{k:'to',t:'إلى'},
    {k:'hours',t:'ساعات',num:1},{k:'ot',t:'إضافي',num:1},
    {k:'client',t:'الورشة / الزبون',kind:'client'},{k:'task',t:'العمل المنجز',kind:'task'}];
  if(type==='material')return [
    {k:'item',t:'البند',kind:'item'},{k:'qty',t:'الكمية',num:1},{k:'unit',t:'الوحدة'},
    {k:'price',t:'السعر',num:1},{k:'total',t:'القيمة',num:1,calc:1},
    {k:'source',t:'المصدر'},{k:'supplier',t:'المورّد',kind:'supplier'},{k:'client',t:'الموقع',kind:'client'}];
  if(type==='expense')return [
    {k:'item',t:'نوع المصروف',kind:'exp'},{k:'amount',t:'المبلغ',num:1},{k:'note',t:'ملاحظة'},{k:'client',t:'الموقع',kind:'client'}];
  return [{k:'client',t:'الزبون',kind:'client'},{k:'amount',t:'المبلغ',num:1},{k:'note',t:'البيان'}];
}
const TYPES={labor:'الدوام',material:'البضاعة',expense:'المصاريف',revenue:'الإيرادات'};
/* القيمة المعروضة = الخام مصحّحاً عبر القاموس (يسري على الماضي والمستقبل) */
function shown(r,f){
  const v=r[f.k];
  if(f.k==='total')return n(r.qty)*n(r.price);
  if(!f.kind)return v||'';
  return canonOf(f.kind,v);
}
const isRaw=(r,f)=>f.kind&&r[f.k]&&!isKnown(f.kind,r[f.k]);
const wasFixed=(r,f)=>f.kind&&r[f.k]&&isKnown(f.kind,r[f.k])&&norm(canonOf(f.kind,r[f.k]))!==norm(r[f.k]);
const months=()=>[...new Set(D.rows.map(r=>(r.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
function rowsView(){
  let rs=D.rows.filter(r=>r.type===S.rowType);
  if(S.month)rs=rs.filter(r=>(r.date||'').startsWith(S.month));
  const q=S.q.trim();
  if(q)rs=rs.filter(r=>fieldsOf(r.type).some(f=>norm(String(shown(r,f))).includes(norm(q))));
  return rs.sort((a,b)=>(String(a.date||'')+refOf(a)).localeCompare(String(b.date||'')+refOf(b)));
}
/* ================= القراءة الآلية ================= */
const AIKEY=()=>cfgGet('icool_ai_key');
function fileToB64(file,max,q){
  return new Promise((res,rej)=>{const fr=new FileReader();
    fr.onerror=()=>rej(new Error('تعذّرت قراءة الصورة'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('صورة غير صالحة'));
      im.onload=()=>{const sc=Math.min(1,max/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',q).split(',')[1])};im.src=fr.result};
    fr.readAsDataURL(file)})}
function hintBlock(){
  const g=k=>D.dict.filter(d=>d.kind===k&&(!d.prov||(d.seen||d.n||0)>=3))
    .sort((a,b)=>((a.prov?0:1)-(b.prov?0:1))||((b.n||0)-(a.n||0))).slice(0,120);
  const line=k=>g(k).map(d=>d.variants&&d.variants.length
      ?`${d.canon} (يُكتب أحياناً: ${d.variants.slice(0,4).map(v=>v.v).join('، ')})`:d.canon).join(' | ');
  const parts=[];
  Object.keys(KINDS).forEach(k=>{const l=line(k);if(l)parts.push(`${KINDS[k]}: ${l}`)});
  return parts.length?`قاموس معتمد من صاحب العمل — طابِق ما تقرأه على هذه الأسماء حرفياً ولا تخترع صيغاً أخرى:
${parts.join('\n')}`:'';
}
const PROMPT=()=>`أنت مساعد إدخال بيانات لشركة مقاولات لبنانية (تكييف، طاقة شمسية، سباكة، شوفاج، كهرباء، مسابح).
الصورة «جدول يومية» بخط اليد فيه جدولان:
الأول: اسم العامل، بدء العمل، انتهاء العمل، موقع العمل، العمل المنجز، اضافي.
الثاني: البضاعة المستخدمة، الكمية، المصدر، الموقع.
أعد JSON فقط بلا أي نص أو markdown:
{"date":"YYYY-MM-DD","dayName":"","dateSure":true,"dateBox":[0,0,0,0],"foreman":"","labor":[{"worker":"","from":"HH:MM","to":"HH:MM","ot":"","client":"","task":"","sure":true,"box":[0,0,1,0],"boxes":{"worker":[0,0,0,0],"client":[0,0,0,0],"task":[0,0,0,0]}}],
"materials":[{"item":"","qty":1,"unit":"","price":null,"source":"","supplier":"","client":"","sure":true,"box":[0,0,1,0],"boxes":{"item":[0,0,0,0],"supplier":[0,0,0,0],"client":[0,0,0,0]}}],
"expenses":[{"item":"","amount":0,"note":"","client":""}],
"revenues":[{"client":"","amount":0,"note":""}],"unclear":[""]}
قواعد:

/* إنقاذ استجابة مقطوعة: نقصّ عند آخر عنصر مكتمل ونغلق الأقواس */
function parseLoose(txt){
  const st0=txt.indexOf('{');if(st0<0)throw new Error('استجابة بلا JSON');
  const t=txt.slice(st0);
  try{return JSON.parse(t)}catch(e){}
  const ends=[];for(let i=0;i<t.length;i++)if(t[i]==='}'||t[i]===']')ends.push(i);
  for(let k=ends.length-1;k>=0;k--){
    const cand=t.slice(0,ends[k]+1);
    const stack=[];let inStr=false,esc=false,bad=false;
    for(const ch of cand){
      if(inStr){if(esc)esc=false;else if(ch==='\\')esc=true;else if(ch==='"')inStr=false;continue}
      if(ch==='"')inStr=true;
      else if(ch==='{'||ch==='[')stack.push(ch);
      else if(ch==='}'||ch===']'){if(!stack.length){bad=true;break}stack.pop()}
    }
    if(bad||inStr)continue;
    let close='';for(let i=stack.length-1;i>=0;i--)close+=(stack[i]==='{'?'}':']');
    try{const j=JSON.parse(cand+close);j._truncated=true;return j}catch(e){}
  }
  throw new Error('تعذّر إصلاح الاستجابة المقطوعة');
}

    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return c.toDataURL('image/jpeg',q).split(',')[1];
  }catch(e){return b64}
}

    const g=[];for(let i=0;i<W*H;i++)g.push(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11);

const cropCache={};
async function cropFor(row,field,pad){
  const ck=row.id+'|'+(field||'');
  if(cropCache[ck])return cropCache[ck];
  const sh=sheetOf(row.sheetId);const src=sh.full||sh.img;
  const bx=(field&&row.boxes&&row.boxes[field]&&row.boxes[field].length===4&&row.boxes[field][2]>0)?row.boxes[field]:row.box;
  if(!src||!bx||bx.length<4)return '';

    const im=await imgFromB64(src);
    let [x1,y1,x2,y2]=bx.map(Number);
    if([x1,y1,x2,y2].some(isNaN))return '';
    if(x2<=x1)x2=1;if(y2<=y1)y2=y1+0.04;
    const P=pad==null?0.012:pad;
    x1=Math.max(0,x1-P);y1=Math.max(0,y1-P);x2=Math.min(1,x2+P);y2=Math.min(1,y2+P);
    const w=Math.max(8,(x2-x1)*im.width),h=Math.max(8,(y2-y1)*im.height);
    const c=document.createElement('canvas');const sc=Math.min(2,900/w);

    c.getContext('2d').drawImage(im,x1*im.width,y1*im.height,w,h,0,0,c.width,c.height);
    const u=c.toDataURL('image/jpeg',.8);cropCache[ck]=u;return u;
  }catch(e){return ''}
}

  for(let i=0;i<files.length;i++){
    S.prog=Math.round(i/files.length*100);S.busy=`الورقة ${i+1} من ${files.length}`;render();
    const sh={id:uid(),name:files[i].name||('ورقة '+(i+1)),added:today(),status:'قيد القراءة',date:'',foreman:'',rows:0};
    try{
      const big=await fileToB64(files[i],1600,.82);
      sh.full=await fileToB64(files[i],1500,.72);   /* أرشيف الورقة */
      sh.img=await fileToB64(files[i],620,.45);      /* مصغّرة */
      sh.hash=await ahash(sh.img);
      const j=await callAI(big);
      sh.date=j.date||'';sh.foreman=j.foreman||'';sh.raw=j;sh.status='تمت';
      const mk=(type,o)=>({id:uid(),sheetId:sh.id,type,date:sh.date,foreman:sh.foreman,sure:o.sure!==false,...o});
      const rows=[];
      (j.labor||[]).forEach(x=>rows.push(mk('labor',{worker:x.worker||'',from:x.from||'',to:x.to||'',
        hours:hoursBetween(x.from,x.to),ot:x.ot||'',client:x.client||'',task:x.task||'',sure:x.sure,
        box:x.box||null,boxes:x.boxes||null})));
      (j.materials||[]).forEach(x=>rows.push(mk('material',{item:x.item||'',qty:x.qty==null?'':x.qty,unit:x.unit||'',
        price:x.price==null?'':x.price,source:x.source||'',supplier:x.supplier||'',client:x.client||'',sure:x.sure,
        box:x.box||null,boxes:x.boxes||null})));
      (j.expenses||[]).forEach(x=>rows.push(mk('expense',{item:x.item||x.type||'',amount:x.amount||'',note:x.note||'',client:x.client||''})));
      (j.revenues||[]).forEach(x=>rows.push(mk('revenue',{client:x.client||'',amount:x.amount||'',note:x.note||''})));
      rows.forEach(r=>{r.raw=JSON.parse(JSON.stringify(r))});
      sh.rows=rows.length;sh.unclear=(j.unclear||[]).filter(Boolean);
      /* كشف التكرار: نفس الصورة أو نفس تاريخ اليومية */
      const dupDate=sh.date?D.sheets.find(x=>x.status==='تمت'&&x.date===sh.date):null;
      if(dupDate){
        sh.status='تعارض';sh.conflictWith=dupDate.id;
        sh.dupKind='يوجد يومية بالتاريخ نفسه';
        sh.pending=rows;D.sheets.push(sh);await dbPut('sheets',sh);
      }else{
        sh.seq=seqFor(sh.date);sh.ref=refFor(sh.date,sh.seq);
        D.rows.push(...rows);D.sheets.push(sh);
        await dbPut('rows',rows);await dbPut('sheets',sh);ok++;
      }
    }catch(e){sh.status='خطأ';sh.err=e.message;D.sheets.push(sh);await dbPut('sheets',sh);S.err=e.message}
  }
  S.busy='';S.prog=0;S.tab=ok?'table':'in';render();
}

async function XL(){
  if(window.XLSX)return window.XLSX;
  await new Promise((res,rej)=>{const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload=res;s.onerror=()=>rej(new Error('تعذّر تحميل مكتبة Excel — تحقّق من الإنترنت'));
    document.head.appendChild(s)});
  return window.XLSX;
}
function aoa(type){
  const F=fieldsOf(type);
  const head=['المرجع','التاريخ','الفورمان',...F.map(f=>f.t),'ملف الورقة'];
  const rows=D.rows.filter(r=>r.type===type)
    .sort((a,b)=>(String(a.date)+refOf(a)).localeCompare(String(b.date)+refOf(b)))
    .map(r=>[refOf(r),r.date||'',canonOf('worker',r.foreman)||r.foreman||'',
      ...F.map(f=>{const v=shown(r,f);return f.num?n(v):v}),
      sheetOf(r.sheetId).name||'']);
  return [head,...rows];
}
function monthlySummary(){
  const map={};
  D.rows.forEach(r=>{const m=(r.date||'').slice(0,7);if(!m)return;
    map[m]=map[m]||{days:new Set(),hours:0,matVal:0,exp:0,rev:0,lines:0};
    const o=map[m];o.days.add(r.date);o.lines++;
    if(r.type==='labor')o.hours+=n(r.hours);
    if(r.type==='material')o.matVal+=n(r.qty)*n(r.price);
    if(r.type==='expense')o.exp+=n(r.amount);
    if(r.type==='revenue')o.rev+=n(r.amount)});
  return [['الشهر','أيام','أسطر','ساعات عمل','قيمة البضاعة','مصاريف','إيرادات'],
    ...Object.entries(map).sort().map(([m,o])=>[m,o.days.size,o.lines,o.hours,o.matVal,o.exp,o.rev])];
}
function dictAoa(){
  return [['النوع','الكلمة الصحيحة','عدد الأشكال','الأشكال التي قُرئت بها','مرات الاستعمال','آخر تحديث'],
    ...D.dict.map(d=>[KINDS[d.kind]||d.kind,d.canon,(d.variants||[]).length,
      (d.variants||[]).map(v=>`${v.v} (${v.n})`).join(' • '),d.n||0,d.updated||''])];

/* ================= بنك الداتا =================
   الباكاب الكامل ثقيل لأن كل ورقة تحمل صورتين base64 (sh.full وsh.img) داخل
   نفس الـJSON. النصوص وحدها — وهي الداتا الحقيقية — جزء صغير منه.
   مستويان للتصدير:
     buildBank() ⇐ اشتقاقات للمنصّة (أسماء · أسعار · ارتباطات). صغير يُستورد فوراً.
     buildData() ⇐ الأرشيف كاملاً بلا صور. للحفظ والتحليل.
   كلاهما يكتب القيم **المصحّحة** عبر canonOf لا الخام المقروء من الصورة. */
const BANKV=1;
const leanRow=r=>{const o={};
  for(const k in r){if(k==='raw'||k==='box'||k==='boxes')continue;o[k]=r[k]}
  return o};
const leanSheet=sh=>{const o={};
  for(const k in sh){if(k==='full'||k==='img')continue;o[k]=sh[k]}
  return o};

/* القيمة المصحّحة لحقل في سطر */
const cv=(r,k,kind)=>{const v=r[k];return kind?canonOf(kind,v):(v||'')};

function buildBank(){
  const mats=D.rows.filter(r=>r.type==='material');
  const labs=D.rows.filter(r=>r.type==='labor');
  const exps=D.rows.filter(r=>r.type==='expense');
  const revs=D.rows.filter(r=>r.type==='revenue');
  const dates=D.rows.map(r=>r.date).filter(Boolean).sort();

  /* الأسماء المعتمدة لكل نوع، مرتّبة بالتكرار الفعلي في الأسطر لا بعدّاد القاموس */
  const seen={};
  const bump=(kind,name)=>{if(!name)return;(seen[kind]=seen[kind]||{})[name]=(seen[kind][name]||0)+1};
  labs.forEach(r=>{bump('worker',cv(r,'worker','worker'));bump('client',cv(r,'client','client'));bump('task',cv(r,'task','task'))});
  mats.forEach(r=>{bump('item',cv(r,'item','item'));bump('client',cv(r,'client','client'));bump('supplier',cv(r,'supplier','supplier'))});
  exps.forEach(r=>{bump('exp',cv(r,'item','exp'));bump('client',cv(r,'client','client'))});
  revs.forEach(r=>{bump('client',cv(r,'client','client'))});

  const dict={};
  Object.keys(KINDS).forEach(kind=>{
    const cnt=seen[kind]||{};
    /* كل اسم في القاموس ولو لم يظهر بعد، وكل اسم ظهر ولو لم يدخل القاموس */
    const names=new Set(Object.keys(cnt));
    D.dict.filter(d=>d.kind===kind).forEach(d=>names.add(d.canon));
    dict[kind]=[...names].filter(Boolean).map(nm=>{
      const d=D.dict.find(x=>x.kind===kind&&norm(x.canon)===norm(nm));
      return {name:nm,n:cnt[nm]||0,
        variants:d?(d.variants||[]).map(v=>v.v).slice(0,8):[]};
    }).sort((a,b)=>b.n-a.n);
  });

  /* البضاعة: الوحدة الغالبة · إحصاء السعر · المورّدون · الورشات التي استهلكتها */
  const byItem={};
  mats.forEach(r=>{
    const nm=cv(r,'item','item');if(!nm)return;
    const o=byItem[nm]=byItem[nm]||{name:nm,n:0,units:{},prices:[],sups:{},clients:{}};
    o.n++;
    if(r.unit)o.units[r.unit]=(o.units[r.unit]||0)+1;
    const pr=n(r.price);if(pr>0)o.prices.push({d:r.date||'',p:pr});
    const sp=cv(r,'supplier','supplier');if(sp)o.sups[sp]=(o.sups[sp]||0)+1;
    const cl=cv(r,'client','client');if(cl)o.clients[cl]=(o.clients[cl]||0)+1;
  });
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  const items=Object.values(byItem).map(o=>{
    const ps=o.prices.slice().sort((a,b)=>a.p-b.p).map(x=>x.p);
    const byDate=o.prices.slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));
    const med=ps.length?(ps.length%2?ps[(ps.length-1)/2]:(ps[ps.length/2-1]+ps[ps.length/2])/2):0;
    return {name:o.name,n:o.n,unit:top(o.units)[0]||'قطعة',
      price:{last:byDate.length?byDate[byDate.length-1].p:0,med:Math.round(med*100)/100,
        min:ps[0]||0,max:ps[ps.length-1]||0,k:ps.length,
        hist:byDate.slice(-6)},
      sups:top(o.sups).slice(0,3),clients:top(o.clients).slice(0,6)};
  }).sort((a,b)=>b.n-a.n);

  /* ما تستهلكه كل ورشة عادةً — يغذّي الاقتراح داخل مجموعة البضاعة */
  const byClient={};
  mats.forEach(r=>{const cl=cv(r,'client','client'),nm=cv(r,'item','item');
    if(!cl||!nm)return;const o=byClient[cl]=byClient[cl]||{};o[nm]=(o[nm]||0)+1});
  const clients=Object.entries(byClient).map(([name,o])=>({name,items:top(o).slice(0,12)}));

  return {fmt:'icool-bank',v:BANKV,made:today(),src:'icool-reader '+VER,
    span:{from:dates[0]||'',to:dates[dates.length-1]||'',
      sheets:D.sheets.length,rows:D.rows.length,
      labor:labs.length,material:mats.length,expense:exps.length,revenue:revs.length},
    dict,items,clients};
}

/* نسخة مجزّأة: ملفات صغيرة تنجح على الهاتف حيث يفشل الملف الضخم */
async function backupChunks(per){
  per=per||20;
  const N=Math.ceil(D.sheets.length/per)||1;
  for(let i=0;i<N;i++){
    const sheets=D.sheets.slice(i*per,(i+1)*per);
    const ids=new Set(sheets.map(x=>x.id));
    const part={part:i+1,of:N,sheets,rows:D.rows.filter(r=>ids.has(r.sheetId)),dict:i===0?D.dict:[]};
    dl(`icool-part-${String(i+1).padStart(2,'0')}-of-${N}.json`,JSON.stringify(part),'application/json');
    await new Promise(r=>setTimeout(r,900));
  }
  alert(`نُزّلت ${N} ملفاً. احفظها كلها، واستوردها في الجهاز الآخر بزر «استعادة / دمج» دفعة واحدة.`);
}
/* الاستعادة بالدمج: لا تمسح ما عندك */
async function mergeBackup(objs,replace){
  if(replace){D={sheets:[],rows:[],dict:[]};await dbClear('rows');await dbClear('sheets');await dbClear('dict')}
  let ns=0,nr=0,nd=0;
  for(const j of objs){
    (j.sheets||[]).forEach(sh=>{if(!D.sheets.find(x=>x.id===sh.id)){D.sheets.push(sh);ns++}});
    (j.rows||[]).forEach(r=>{if(!D.rows.find(x=>x.id===r.id)){D.rows.push(r);nr++}});
    (j.dict||[]).forEach(d=>{const ex=D.dict.find(x=>x.kind===d.kind&&norm(x.canon)===norm(d.canon));
      if(ex){(d.variants||[]).forEach(v=>{if(!(ex.variants||[]).some(y=>norm(y.v)===norm(v.v)))(ex.variants=ex.variants||[]).push(v)})}
      else{D.dict.push(d);nd++}});
  }
  await dbPut('sheets',D.sheets);await dbPut('rows',D.rows);await dbPut('dict',D.dict);
  render();alert(`دُمج: ${ns} ورقة، ${nr} سطر، ${nd} كلمة قاموس.\nالإجمالي الآن: ${D.sheets.length} ورقة و${D.rows.length} سطر.`);
}

function cellSheet(rowId,k,kind){
  const r=D.rows.find(x=>x.id===rowId);if(!r)return;
  const raw=r[k],cur=canonOf(kind,raw);
  const same=D.rows.filter(x=>norm(x[k]||'')===norm(raw)&&x.type===r.type).length;
  const list=D.dict.filter(d=>d.kind===kind).sort((a,b)=>sim(raw,b.canon)-sim(raw,a.canon)).slice(0,12);
  document.getElementById('modal').innerHTML=`<div class="sheet" data-a="bg"><div class="box">
    <div class="hd"><b>تصحيح ${KINDS[kind]}</b><div style="flex:1"></div><button class="x" data-a="close">✕</button></div>
    <div class="bd">
      <div class="pad">
        <div class="mini">سطر الورقة الأصلية (${esc(refOf(r))})</div>
        <img class="crop" data-crop="${r.id}" data-cropk="${k}" style="display:none;margin:6px 0 10px">
        <div class="mini">ما قرأه النظام</div>
        <div style="font-size:20px;font-weight:900;margin:4px 0 10px">${esc(raw||'—')}</div>
        <label class="f">الكلمة الصحيحة</label>
        <input type="text" id="cv" value="${esc(cur)}">
        <div style="height:10px"></div>
        <button class="btn g w" data-a="cellSave" data-id="${rowId}" data-k="${k}" data-kind="${kind}">
          اعتماد وتصحيح ${same} سطر في كل الشهور</button>
        <div style="height:8px"></div>
        <button class="btn ghost w" data-a="cellOnly" data-id="${rowId}" data-k="${k}">تعديل هذا السطر فقط</button>
      </div>
      ${list.length?`<div class="pad" style="border-top:1px solid var(--line2)"><div class="mini">اختر من القاموس</div>
        <div style="margin-top:6px">${list.map(d=>`<span class="chip" data-a="pickCanon" data-v="${esc(d.canon)}">${esc(d.canon)}</span>`).join('')}</div></div>`:''}
    </div></div></div>`;
  fillCrops();
  setTimeout(()=>{const e=document.getElementById('cv');if(e){e.focus();e.select()}},150);
}

    <div class="hd"><b>${esc(s.date||s.name)}</b><div style="flex:1"></div><button class="x" data-a="close">✕</button></div>
    <div class="bd">

/* ================= الأحداث ================= */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  const close=()=>{document.getElementById('modal').innerHTML=''};
  if(a==='tab'){S.tab=t.dataset.k;render()}
  else if(a==='rtype'){S.rowType=t.dataset.k;render()}
  else if(a==='month'){S.month=t.dataset.k;render()}
  else if(a==='kind'){S.kind=t.dataset.k;render()}
  else if(a==='close'||a==='bg'){if(a==='close'||e.target.classList.contains('sheet')){close();render()}}
  else if(a==='shoot'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;
    f.onchange=()=>{if(f.files.length)ingest([...f.files].slice(0,40))};f.click()}
  else if(a==='openSheet')sheetView(t.dataset.id);
  else if(a==='delSheet'){if(!confirm('حذف الورقة وكل أسطرها؟'))return;
    const id=t.dataset.id;D.rows=D.rows.filter(r=>r.sheetId!==id);D.sheets=D.sheets.filter(s=>s.id!==id);
    await dbClear('rows');await dbPut('rows',D.rows);await dbDel('sheets',id);close();render()}
  else if(a==='dupKeep'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    delete sh.dupFlag;delete sh.dupOf;await dbPut('sheets',sh);render()}
  else if(a==='dupDel'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    if(!confirm('حذف هذه الورقة نهائياً من الأرشيف؟'))return;
    D.rows=D.rows.filter(r=>r.sheetId!==sh.id);D.sheets=D.sheets.filter(x=>x.id!==sh.id);
    await dbDel('sheets',sh.id);await dbClear('rows');await dbPut('rows',D.rows);render()}
  else if(a==='import'){const f=document.createElement('input');f.type='file';f.accept='image/*';f.multiple=true;
    f.onchange=()=>{if(f.files.length)importOnly([...f.files])};f.click()}
  else if(a==='qStart')runQueue();
  else if(a==='qStop'){QRUN=false;render()}
  else if(a==='qRetry'){await markReread(D.sheets.filter(x=>x.status==='خطأ').map(x=>{x.status='بانتظار';return x}));runQueue()}
  else if(a==='reWeak'){const list=D.sheets.filter(x=>x.status==='تمت').sort((p,q2)=>quality(p)-quality(q2)).slice(0,20);
    if(!list.length)return;if(!confirm('إعادة قراءة '+list.length+' ورقة؟ ما ثبّتَه بيدك يبقى.'))return;
    await markReread(list);runQueue()}
  else if(a==='reAll'){const list=D.sheets.filter(x=>x.status==='تمت');
    if(!confirm('إعادة قراءة '+list.length+' ورقة؟ قد تستغرق وقتاً وكلفة.'))return;
    await markReread(list);runQueue()}
  else if(a==='reSheet'){const sh=D.sheets.find(x=>x.id===t.dataset.id);await markReread([sh]);runQueue()}
  else if(a==='auto85')autoDict(.85);
  else if(a==='seedDict'){if(confirm('سيُبنى القاموس من '+D.rows.length+' سطر سابق. متابعة؟'))seedDictFromRows()}
  else if(a==='calDay'){S.calDay=S.calDay===t.dataset.k?'':t.dataset.k;render();
    setTimeout(()=>{try{const p2=document.getElementById('dayPanel');if(p2&&p2.scrollIntoView)p2.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){}},80)}
  else if(a==='mPrev'){shiftMonth(-1);render()}
  else if(a==='mNext'){shiftMonth(1);render()}
  else if(a==='editDate'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    const v=(document.getElementById('ed_'+sh.id)||{}).value;
    if(!v||v===sh.date)return;
    const clash=D.sheets.find(x=>x.id!==sh.id&&x.status==='تمت'&&x.date===v);
    if(clash&&!confirm('يوجد يومية أخرى بهذا التاريخ ('+(clash.ref||'')+'). سيُحفظ اليومان معاً بمرجعين متتاليين. متابعة؟'))return;
    sh.date=v;sh.seq=seqFor(v);sh.ref=refFor(v,sh.seq);sh.dateFlag='';sh.dateSure=true;
    const rs=D.rows.filter(r=>r.sheetId===sh.id);rs.forEach(r=>r.date=v);
    await dbPut('rows',rs);await dbPut('sheets',sh);S.calDay=v;S.cal=v.slice(0,7);render()}
  else if(a==='fFrom'){S.fFrom=t.value;render()}
  else if(a==='fTo'){S.fTo=t.value;render()}
  else if(a==='clearF'){S.fFrom='';S.fTo='';S.fClient='';S.fWorker='';S.q='';render()}
  else if(a==='xlsxFilt')exportFiltered();
  else if(a==='cfDrop'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    D.sheets=D.sheets.filter(x=>x.id!==sh.id);await dbDel('sheets',sh.id);render()}
  else if(a==='cfReplace'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    if(!confirm('سيُستبدل محتوى اليومية القديمة بالجديدة. متابعة؟'))return;
    const old=sheetOf(sh.conflictWith);
    D.rows=D.rows.filter(r=>r.sheetId!==old.id);
    D.sheets=D.sheets.filter(x=>x.id!==old.id);
    await dbDel('sheets',old.id);await dbClear('rows');
    sh.status='تمت';sh.seq=old.seq||seqFor(sh.date);sh.ref=old.ref||refFor(sh.date,sh.seq);
    sh.replaced=old.ref||'';const rows=sh.pending||[];delete sh.pending;
    D.rows.push(...rows);await dbPut('rows',D.rows);await dbPut('sheets',sh);render()}
  else if(a==='cfKeep'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    sh.status='تمت';sh.seq=seqFor(sh.date);sh.ref=refFor(sh.date,sh.seq);
    const rows=sh.pending||[];delete sh.pending;
    D.rows.push(...rows);await dbPut('rows',rows);await dbPut('sheets',sh);render()}
  else if(a==='setDate'){const sh=D.sheets.find(x=>x.id===t.dataset.id);
    const v=(document.getElementById('nd_'+sh.id)||{}).value;if(!v)return;
    sh.date=v;sh.seq=seqFor(v);sh.ref=refFor(v,sh.seq);sh.dateFlag='';sh.dateSure=true;
    D.rows.filter(r=>r.sheetId===sh.id).forEach(r=>r.date=v);
    await dbPut('rows',D.rows.filter(r=>r.sheetId===sh.id));await dbPut('sheets',sh);render()}
  else if(a==='dlImg'){const sh=sheetOf(t.dataset.id);
    const b=sh.full||sh.img;if(!b)return;
    const a2=document.createElement('a');a2.href='data:image/jpeg;base64,'+b;
    a2.download=(sh.ref||'sheet')+'.jpg';a2.click()}
  else if(a==='cell')cellSheet(t.dataset.id,t.dataset.k,t.dataset.kind);
  else if(a==='pickCanon'){const e2=document.getElementById('cv');if(e2)e2.value=t.dataset.v}
  else if(a==='cellSave'){const v=(document.getElementById('cv')||{}).value||'';
    const r=D.rows.find(x=>x.id===t.dataset.id);
    await learn(t.dataset.kind,r[t.dataset.k],v,true);
    r.locked=r.locked||{};r.locked[t.dataset.k]=true;await dbPut('rows',r);close();render()}
  else if(a==='cellOnly'){const v=(document.getElementById('cv')||{}).value||'';
    const r=D.rows.find(x=>x.id===t.dataset.id);r[t.dataset.k]=v;
    r.locked=r.locked||{};r.locked[t.dataset.k]=true;await dbPut('rows',r);close();render()}
  else if(a==='accept'){await learn(t.dataset.kind,t.dataset.raw,t.dataset.canon,true);render()}
  else if(a==='acceptIn'){const v=(document.getElementById('fx'+t.dataset.i)||{}).value||'';
    if(v.trim()){await learn(t.dataset.kind,t.dataset.raw,v);render()}}
  else if(a==='addCanon'){const v=(document.getElementById('newCanon')||{}).value||'';
    if(v.trim()){await learn(S.kind,'',v);render()}}
  else if(a==='okCanon'){const d=D.dict.find(x=>x.id===t.dataset.id);d.prov=false;await dbPut('dict',d);render()}
  else if(a==='renCanon'){const d=D.dict.find(x=>x.id===t.dataset.id);
    const v=prompt('الكلمة الصحيحة:',d.canon);if(v&&v.trim()){
      const ex=D.dict.find(x=>x!==d&&x.kind===d.kind&&norm(x.canon)===norm(v));
      if(ex){await mergeCanon(d.kind,d.canon,ex.canon)}
      else{d.variants=[...(d.variants||[]),{v:d.canon,n:1,first:today()}];d.canon=v.trim();d.updated=today();await dbPut('dict',d)}
      render()}}
  else if(a==='delCanon'){if(!confirm('حذف هذه الكلمة من القاموس؟'))return;
    D.dict=D.dict.filter(x=>x.id!==t.dataset.id);await dbDel('dict',t.dataset.id);render()}
  else if(a==='delVar'){const d=D.dict.find(x=>x.id===t.dataset.id);
    d.variants=(d.variants||[]).filter(v=>v.v!==t.dataset.v);await dbPut('dict',d);render()}
  else if(a==='xlsx')exportXlsx();
  else if(a==='opscsv')exportOpsCSV();
  else if(a==='bank')exportBank();
  else if(a==='data')exportData();
  else if(a==='backup')backupJSON();
  else if(a==='chunks')backupChunks(20);
  else if(a==='restore'){const f=document.createElement('input');f.type='file';f.accept='.json';f.multiple=true;
    f.onchange=async()=>{
      const rep=D.sheets.length?!confirm('دمج مع بياناتك الحالية؟\n\nموافق = دمج (الأأمن)\nإلغاء = استبدال كل شيء'):false;
      const objs=[];
      for(const file of [...f.files]){
        try{objs.push(JSON.parse(await file.text()))}catch(e){alert('ملف غير صالح: '+file.name)}
      }
      if(objs.length)mergeBackup(objs,rep);
    };f.click()}
  else if(a==='saveKey'){cfgSet('icool_ai_key',(document.getElementById('k')||{}).value.trim());render()}
  else if(a==='wipe'){if(!confirm('مسح كل الأوراق والأسطر؟ القاموس يبقى.'))return;
    D.rows=[];D.sheets=[];await dbClear('rows');await dbClear('sheets');render()}
  else if(a==='wipeAll'){if(!confirm('مسح كل شيء بما فيه القاموس؟'))return;
    D={sheets:[],rows:[],dict:[]};await dbClear('rows');await dbClear('sheets');await dbClear('dict');render()}
});
let qT=null;
document.addEventListener('change',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a;
  if(a==='par'){cfgSet('icool_par',t.value)}
  else if(a==='mPick'){S.cal=t.value;S.calDay='';render()}
  else if(a==='fClient'){S.fClient=t.value;render()}
  else if(a==='fWorker'){S.fWorker=t.value;render()}
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  if(t.dataset.a==='q'){S.q=t.value;clearTimeout(qT);qT=setTimeout(()=>{const c=t.selectionStart;render();
    const el=document.getElementById('q');if(el){el.focus();el.setSelectionRange(c,c)}},350)}
});
/* ================= الإقلاع ================= */
(async()=>{
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist()}catch(e){}
  try{D.sheets=await dbAll('sheets');D.rows=await dbAll('rows');D.dict=await dbAll('dict')}catch(e){}
  render();
})();
</script>
</body>
</html>
