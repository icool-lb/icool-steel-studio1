<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>iCOOL Steel Studio v2</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0066A7;--orange:#F1471E;--navy:#0B2239;--ink:#16222e;--line:#dbe2e9;--paper:#eef2f6;--ok:#1a7f4b;--warn:#b06a00;--bad:#c02617}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Tajawal,system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:#fff;border-bottom:3px solid var(--orange);padding:5px 9px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo{height:32px;width:auto;direction:ltr}
.brand h1{margin:0;font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.1}
.brand p{margin:1px 0 0;font-size:10px;color:#5b6b7a}
#tabs{display:flex;gap:4px;background:#fff;padding:5px 6px;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{white-space:nowrap;font-size:11.5px;padding:6px 9px}
button{font-family:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--navy);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:11.5px}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.o{border-color:var(--orange);color:var(--orange)}
button.o.on{background:var(--orange);color:#fff}
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:120px}
canvas#gl{display:block;width:100%;height:100%;touch-action:none}
#badge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(255,255,255,.93);border-radius:8px;padding:5px 8px;font-size:10.5px;line-height:1.55;box-shadow:0 2px 9px rgba(11,34,57,.12);max-width:58%}
#badge b{color:var(--blue)}
#util{position:absolute;top:6px;inset-inline-end:6px;background:rgba(255,255,255,.93);border-radius:8px;padding:5px 8px;font-size:10.5px;text-align:center;box-shadow:0 2px 9px rgba(11,34,57,.12)}
#vbar{position:absolute;bottom:5px;inset-inline-end:6px;display:flex;gap:4px}
#vbar button{padding:4px 7px;font-size:10.5px;background:rgba(255,255,255,.93)}
#dock{flex:0 0 auto;height:40vh;background:#fff;border-top:3px solid var(--blue);overflow:auto;padding:8px 10px 18px}
#dock.min{height:0;padding:0;overflow:hidden;border-top-width:0}
.grp{margin:7px 0 2px;font-size:10.5px;font-weight:800;color:var(--orange);border-bottom:1px dashed var(--line);padding-bottom:2px}
.f{display:flex;align-items:center;gap:7px;margin:5px 0}
.f label{font-size:11.5px;min-width:104px;color:var(--navy);font-weight:700}
.f input[type=range]{flex:1;accent-color:var(--orange)}
.f .v{font-size:11.5px;font-weight:800;color:var(--blue);min-width:56px;text-align:left;direction:ltr}
.f select,.f input[type=text],.f input[type=number],.f input[type=file]{flex:1;font-family:inherit;font-size:11.5px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.tip{font-size:10.5px;color:#5b6b7a;line-height:1.7;background:#f5f8fb;border-radius:7px;padding:6px 8px;margin:6px 0}
#cmd{display:flex;gap:5px;margin:6px 0}
#cmd textarea{flex:1;font-family:inherit;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:8px;height:58px;resize:none}
#log{font-size:11px;line-height:1.7;max-height:150px;overflow:auto}
#log div{padding:4px 6px;border-radius:6px;margin:3px 0;background:#f5f8fb}
#log .e{background:#fff1ee;color:#8c2013}
#trace{width:100%;border:1px solid var(--line);border-radius:8px;touch-action:none;background:#f7f9fb}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0}
.chips button{font-size:10.5px;padding:4px 8px}
#ov{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;display:none}
#ov.open{display:block}
.otop{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--orange);padding:7px 10px;display:flex;gap:5px;z-index:3}
.obody{padding:10px 12px 60px;max-width:940px;margin:0 auto}
.obody h2{font-size:13.5px;color:#fff;background:var(--navy);padding:5px 8px;border-radius:5px;margin:15px 0 7px}
.obody h3{font-size:12px;color:var(--blue);margin:11px 0 4px}
.obody p,.obody li{font-size:11.5px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:11px;margin:5px 0 9px}
th{background:#f2f5f8;color:var(--navy);padding:4px;text-align:right;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:4px}
td.n{text-align:left;direction:ltr;font-weight:700}
.tag{display:inline-block;padding:1px 6px;border-radius:20px;font-size:10px;font-weight:800;color:#fff}
.t-ok{background:var(--ok)}.t-w{background:var(--warn)}.t-b{background:var(--bad)}
.note{font-size:11px;line-height:1.75;background:#fff6f3;border-inline-start:4px solid var(--orange);padding:7px 9px;border-radius:7px;margin:7px 0}
.kpi{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 9px}
.kpi div{flex:1 1 30%;background:#f4f7fa;border:1px solid var(--line);border-radius:8px;padding:6px}
.kpi span{display:block;font-size:10px;color:#5b6b7a}
.kpi b{font-size:13px;color:var(--blue)}
.sign{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sign div{flex:1 1 44%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;line-height:1.7}
.sign img{max-height:70px}
.sheet{border:1.5px solid var(--navy);border-radius:4px;margin:14px 0;background:#fff;overflow:hidden}
.sheet .tb{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--navy);padding:4px 7px;background:#f4f7fa;font-size:10.5px;font-weight:800;color:var(--navy)}
.sheet svg{width:100%;height:auto;display:block;direction:ltr}
.foot{border-top:1px solid var(--line);margin-top:16px;padding-top:7px;font-size:10px;color:#5b6b7a;line-height:1.7}
@media (min-width:820px){
  #main{flex-direction:row}
  #dock{height:auto;width:370px;border-top:0;border-inline-start:3px solid var(--blue)}
  #dock.min{width:0;padding:0}
}
@media print{
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto!important;min-height:0!important;overflow:visible!important;background:#fff}
  #app{display:none!important}
  #ov{position:static!important;inset:auto!important;display:block!important;overflow:visible!important;height:auto!important;z-index:auto}
  .otop{display:none!important}
  .obody{max-width:100%;margin:0;padding:14mm 12mm}
  .sheet{page-break-inside:avoid;break-inside:avoid;overflow:visible}
  tr,td,th{page-break-inside:avoid;break-inside:avoid}
  thead{display:table-header-group}
  h2,h3{page-break-after:avoid;break-after:avoid}
  .foot{page-break-inside:avoid;break-inside:avoid}
}
</style>
</head>
<body>

<div id="app">
<header>
  <span id="logoBox"></span>
  <div class="brand"><h1>Steel Studio <span style="font-size:10px;color:#F1471E">v2</span></h1>
  <p>دراسة هياكل حديدية · برغولا · طاقة · هنغار</p></div>
</header>

<div id="tabs"></div>

<div id="main">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="badge"></div>
    <div id="util"></div>
    <div id="vbar">
      <button id="vCover" class="on">غطاء</button>
      <button id="vDim" class="on">أبعاد</button>
      <button id="vSite" class="on">الموقع</button>
      <button id="vFit">ضبط</button>
      <button id="vDock">▼</button>
    </div>
  </div>
  <div id="dock"></div>
</div>
</div>

<div id="ov"><div class="otop" id="ovTop"></div><div class="obody" id="ovBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =======================================================================
   iCOOL Steel Studio v2.0
   منصة بارامترية لدراسة الهياكل الحديدية
   الوحدات: تصميم حيّ · صورة→مخطط · محرّك أوامر عربي · تقرير موقّع · خرائط تنفيذية
   ======================================================================= */

/* ---------- 1. الهوية البصرية ---------- */
const LOGO=`<svg class="logo" viewBox="0 0 306 96" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
 <defs><linearGradient id="ic_g" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#1D8FC6"/><stop offset="1" stop-color="#005E9E"/></linearGradient>
 <clipPath id="ic_c"><circle cx="41" cy="36" r="23"/></clipPath></defs>
 <path d="M41 6c-14 0-25 11-25 25 0 15 17 31 25 44 8-13 25-29 25-44C66 17 55 6 41 6z" fill="url(#ic_g)"/>
 <circle cx="41" cy="36" r="23" fill="#fff"/>
 <rect x="17" y="12" width="24" height="48" fill="#0066A7" clip-path="url(#ic_c)"/>
 <rect x="41" y="12" width="25" height="48" fill="#F1471E" clip-path="url(#ic_c)"/>

  <line x1="30" y1="25" x2="30" y2="47"/><line x1="20.5" y1="30.5" x2="39.5" y2="41.5"/>
  <line x1="20.5" y1="41.5" x2="39.5" y2="30.5"/>
  <line x1="30" y1="28.5" x2="27" y2="25.5"/><line x1="30" y1="28.5" x2="33" y2="25.5"/>
  <line x1="30" y1="43.5" x2="27" y2="46.5"/><line x1="30" y1="43.5" x2="33" y2="46.5"/>
 </g>
 <g stroke="#fff" stroke-width="2.1" stroke-linecap="round">
  <circle cx="52" cy="36" r="6" fill="#fff" stroke="none"/>
  <line x1="52" y1="23" x2="52" y2="27"/><line x1="52" y1="45" x2="52" y2="49"/>
  <line x1="39" y1="36" x2="43" y2="36"/><line x1="61" y1="36" x2="65" y2="36"/>
  <line x1="43.5" y1="27.5" x2="46.5" y2="30.5"/><line x1="57.5" y1="41.5" x2="60.5" y2="44.5"/>
  <line x1="60.5" y1="27.5" x2="57.5" y2="30.5"/><line x1="46.5" y1="41.5" x2="43.5" y2="44.5"/>
 </g>
 <g style="direction:ltr" text-anchor="start" font-family="Tajawal,Segoe UI,Arial">
  <text x="80" y="45" font-size="40" font-weight="800" fill="#0066A7">i<tspan fill="#0B2239">COOL</tspan></text>
  <text x="82" y="63" font-size="11.5" font-weight="700" fill="#F1471E" letter-spacing="2.6">COOL YOUR LIFE</text>
  <text x="82" y="79" font-size="10" font-weight="500" fill="#5b6b7a" letter-spacing="0.6">TRADING &amp; CONTRACTING</text>
 </g></svg>`;
let LOGO_IMG=null;                                  // شعار رسمي يرفعه المستخدم
let SIGN_IMG=null;                                  // توقيع/ختم
function logoHTML(h){
  if(LOGO_IMG) return `<img src="${LOGO_IMG}" style="height:${h||32}px;width:auto" alt="iCOOL">`;
  return LOGO.replace('class="logo"',`class="logo" style="height:${h||32}px"`);
}

/* ---------- 2. مكتبة المقاطع ---------- */
const SEC={
 '40x40x2'  :{w:2.31,A:2.94,b:.04,h:.04},'50x50x2.5':{w:3.56,A:4.55,b:.05,h:.05},
 '60x40x2.5':{w:3.56,A:4.55,b:.04,h:.06},'60x60x3'  :{w:5.19,A:6.63,b:.06,h:.06},
 '80x40x3'  :{w:5.19,A:6.63,b:.04,h:.08},'80x80x3'  :{w:7.07,A:9.03,b:.08,h:.08},
 '80x80x4'  :{w:9.22,A:11.7,b:.08,h:.08},'100x50x3' :{w:6.51,A:8.29,b:.05,h:.10},
 '100x50x4' :{w:8.49,A:10.8,b:.05,h:.10},'100x100x4':{w:11.7,A:14.9,b:.10,h:.10},
 '120x60x4' :{w:10.6,A:13.4,b:.06,h:.12},'120x120x4':{w:14.2,A:18.1,b:.12,h:.12},
 '150x50x4' :{w:11.7,A:14.9,b:.05,h:.15},'150x150x5':{w:22.0,A:28.0,b:.15,h:.15},
 'IPE160'   :{w:15.8,A:20.1,b:.082,h:.16},'IPE200'  :{w:22.4,A:28.5,b:.10,h:.20},
 'IPE240'   :{w:30.7,A:39.1,b:.12,h:.24}};
const PANEL={w:2.382,h:1.134,t:.030,kg:32.3,Wp:660,nm:'Bluesun 2382×1134 / 660Wp'};

/* ---------- 3. حالة المشروع ---------- */
const M={cat:'solar',tpl:'S1',project:'مشروع جديد',client:'',site:'',muni:'',parcel:'',permit:'',
 terrain:'II',phi:0,cont:7,marg:12,vat:0,pAnch:4,pvPrice:0,knee:.60,win:1,
 bOn:1,bShape:'rect',bA:8.07,bB:9.83,ba:3.10,bb:1.36,bCorner:'NW',bF:2,bFH:3.0,bPar:.80,bParT:.20,
 bRot:0,bOX:.6,bOZ:.6, nPost:2,pInset:.15,fix2:'same',
 L:12,S:6,h1:2.2,h2:3.4,bay:2.5,td:.5,over:.5,
 secT:'100x50x3',secB:'50x50x2.5',secW:'50x50x2.5',secP:'100x100x4',secR:'50x50x2.5',
 diag:1,orient:'auto',fix:'base',wind:100,snow:0,price:1.35,fab:.85,coat:'paint',
 slatGap:.12,clearH:5,ridge:1.9};
let SITE=null,TRACE_POLY=null,LEGS=[],VAL={ok:true,msgs:[]};
function inPoly(x,z,p){let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];
    if(((a[1]>z)!==(b[1]>z))&&(x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function makeSite(){
  if(!M.bOn){SITE=null;return;}
  let p;
  if(M.bShape==='trace'&&TRACE_POLY)p=TRACE_POLY.map(q=>[q[0],q[1]]);
  else if(M.bShape==='L'){
    const A=M.bA,B=M.bB,a=Math.min(M.ba,A-.3),b=Math.min(M.bb,B-.3);
    p=[[0,0],[A,0],[A,B],[a,B],[a,B-b],[0,B-b]];
    if(M.bCorner==='NE')p=p.map(q=>[A-q[0],q[1]]);
    if(M.bCorner==='SW')p=p.map(q=>[q[0],B-q[1]]);
    if(M.bCorner==='SE')p=p.map(q=>[A-q[0],B-q[1]]);
  }else p=[[0,0],[M.bA,0],[M.bA,M.bB],[0,M.bB]];
  const r=(M.bRot|0)%360;
  if(r){const t=r*Math.PI/180;
    p=p.map(q=>[q[0]*Math.cos(t)-q[1]*Math.sin(t),q[0]*Math.sin(t)+q[1]*Math.cos(t)]);
    const mx=Math.min(...p.map(q=>q[0])),mz=Math.min(...p.map(q=>q[1]));
    p=p.map(q=>[q[0]-mx,q[1]-mz]);}
  let A2=0;for(let i=0;i<p.length;i++){const u=p[i],v=p[(i+1)%p.length];A2+=u[0]*v[1]-v[0]*u[1];}
  const xs=p.map(q=>q[0]),zs=p.map(q=>q[1]);
  SITE={poly:p,area:Math.abs(A2/2),bb:[Math.max(...xs),Math.max(...zs)],H:M.bF*M.bFH};}
function distPoly(x,z,P){let d=1e9;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    const vx=b[0]-a[0],vz=b[1]-a[1],l2=vx*vx+vz*vz||1;
    let t=((x-a[0])*vx+(z-a[1])*vz)/l2;t=Math.max(0,Math.min(1,t));
    d=Math.min(d,Math.hypot(x-(a[0]+t*vx),z-(a[1]+t*vz)));}
  return d;}
function legState(x,z,fx){
  if(!SITE)return{s:'ok',t:'—'};
  const P=SITE.poly,X=M.bOX+x,Z=M.bOZ+z,ins=inPoly(X,Z,P),d=distPoly(X,Z,P);
  const fac=(fx==='beam'||fx==='through');
  if(fac){
    if(!ins&&d<=.60)return{s:'ok',t:'على الواجهة (خارج '+(d*100).toFixed(0)+' سم)'};
    if(ins&&d<=.40)return{s:'ok',t:'ملاصقة للكمرة (داخل '+(d*100).toFixed(0)+' سم)'};
    if(ins)return{s:'warn',t:'داخل السطح '+(d*100).toFixed(0)+' سم — لا تصل إلى الكمرة'};
    return{s:'bad',t:'بعيدة '+(d*100).toFixed(0)+' سم عن الواجهة'};}
  if(!ins)return{s:'bad',t:'خارج السطح '+(d*100).toFixed(0)+' سم'};
  if(d<.12)return{s:'warn',t:'على الحافة تماماً ('+(d*100).toFixed(0)+' سم) — مسافة حافة غير كافية للمسمار'};
  return{s:'ok',t:'داخل السطح ('+(d*100).toFixed(0)+' سم عن الحافة)'};}
function validate(){
  VAL={ok:true,msgs:[]};
  if(!SITE)return;
  let bad=0,warn=0;
  LEGS.forEach(([x,z,fx])=>{const st=legState(x,z,fx);
    if(st.s==='bad')bad++; else if(st.s==='warn')warn++;});
  if(bad){VAL.ok=false;VAL.msgs.push(bad+' رجل في موضع غير صالح — راجع جدول الأرجل.');}
  if(warn)VAL.msgs.push(warn+' رجل بحاجة إلى مراجعة موضعها.');
  const cov=(M.L*M.S)/Math.max(SITE.area,1)*100;
  if(cov>85)VAL.msgs.push('الهيكل يغطي '+cov.toFixed(0)+'% من السطح — اترك ممر صيانة 60 سم على الأقل.');
  const need=(M.bF*M.bFH>0)?0:0;
  if(M.bPar>0&&Math.max(M.h1,M.h2)<M.bPar+.25)
    VAL.msgs.push('الحافة الأمامية للألواح أدنى من العمامة + 25 سم — احتمال تظليل شتوي.');}

const F={
 L:{l:'الطول (م)',t:'r',min:2,max:60,st:.1}, S:{l:'البحر / العرض (م)',t:'r',min:1.5,max:30,st:.05},
 h1:{l:'الارتفاع الأمامي (م)',t:'r',min:.6,max:9,st:.05}, h2:{l:'الارتفاع الخلفي (م)',t:'r',min:.6,max:10,st:.05},
 clearH:{l:'الارتفاع الصافي (م)',t:'r',min:3,max:14,st:.1}, ridge:{l:'ارتفاع الجملون (م)',t:'r',min:.4,max:5,st:.05},
 bay:{l:'تباعد الإطارات (م)',t:'r',min:1,max:7,st:.05}, td:{l:'ارتفاع الجمالون (م)',t:'r',min:.2,max:2.2,st:.05},
 over:{l:'بروز (م)',t:'r',min:0,max:2.5,st:.05}, slatGap:{l:'فراغ التضليع (م)',t:'r',min:.04,max:.5,st:.01},
 secT:{l:'الجائز العلوي',t:'s',o:['80x40x3','100x50x3','100x50x4','120x60x4','150x50x4','IPE160','IPE200','IPE240']},
 secB:{l:'الجائز السفلي',t:'s',o:['40x40x2','50x50x2.5','60x40x2.5','60x60x3','80x40x3','100x50x3']},
 secW:{l:'التضليع/الأقطار',t:'s',o:['40x40x2','50x50x2.5','60x60x3']},
 secP:{l:'الأعمدة',t:'s',o:['80x80x3','80x80x4','100x100x4','120x120x4','150x150x5','IPE200','IPE240']},
 secR:{l:'المرابط/المدادات',t:'s',o:['40x40x2','50x50x2.5','60x40x2.5','80x40x3','100x50x3']},

function tube(p1,p2,w,h,mat){
  const d=new THREE.Vector3().subVectors(p2,p1),l=d.length(); if(l<1e-6)return null;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),mat);
  m.position.copy(p1).add(p2).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0,0,1),d.normalize()); return m;}

function addM(kind,sec,p1,p2,mat,mark){

  const len=p1.distanceTo(p2);

    PC[k]=PC[k]||{mark,sec,len:+len.toFixed(2),q:0,kind}; PC[k].q++;}
  const m=tube(p1,p2,s.b,s.h,mat||MAT.top); if(m)gS.add(m);}

function house(x0,x1,z0,z1,h){
  if(!(h>0))return;
  const w=x1-x0,d=z1-z0;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MAT.mass);
  m.position.set((x0+x1)/2,-.30-h/2,(z0+z1)/2);gB.add(m);
  const nF=Math.max(1,Math.round(h/3));
  for(let i=1;i<nF;i++){const y=-.30-h*i/nF;
    [z0-.02,z1+.02].forEach(z=>gB.add(tube(V(x0,y,z),V(x1,y,z),.04,.14,MAT.ground)));
    [x0-.02,x1+.02].forEach(x=>gB.add(tube(V(x,y,z0),V(x,y,z1),.14,.04,MAT.ground)));}
  if(M.win){
    const cols=Math.max(1,Math.floor(w/2.6));
    for(let fl=0;fl<nF;fl++)for(let c=0;c<cols;c++){
      const wx=x0+(c+.5)*w/cols,wy=-.30-h*(fl+.55)/nF;
      const a=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.06),MAT.win);a.position.set(wx,wy,z1+.03);gB.add(a);
      const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.06),MAT.win);b.position.set(wx,wy,z0-.03);gB.add(b);}
    const rows=Math.max(1,Math.floor(d/2.6));
    for(let fl=0;fl<nF;fl++)for(let c=0;c<rows;c++){
      const wz=z0+(c+.5)*d/rows,wy=-.30-h*(fl+.55)/nF;
      const a=new THREE.Mesh(new THREE.BoxGeometry(.06,1.2,1.1),MAT.win);a.position.set(x1+.03,wy,wz);gB.add(a);
      const b=new THREE.Mesh(new THREE.BoxGeometry(.06,1.2,1.1),MAT.win);b.position.set(x0-.03,wy,wz);gB.add(b);}}
  gB.add(lbl('المبنى '+h.toFixed(1)+' م',V((x0+x1)/2,-.30-h*.5,z1+.6),'#5b6b7a',1.4));}

/* كتفا تقوية 50×50 عند الزاوية العلوية — أحدهما باتجاه الجمالون والآخر باتجاه المداد */
function knees(x,z,yTop,dx,dz){
  const k=M.knee; if(!(k>0))return;
  if(dx)addM('كتف تقوية',M.secW,V(x,yTop-k,z),V(x+dx*k,yTop-.04,z),MAT.brace,'K2');
  if(dz)addM('كتف تقوية',M.secW,V(x,yTop-k,z),V(x,yTop-.04,z+dz*k),MAT.brace,'K2');}

function truss(p1,p2,td,nB,diag){
  const q1=V(p1.x,p1.y-td,p1.z),q2=V(p2.x,p2.y-td,p2.z);
  addM('جوائز علوية',M.secT,p1,p2,MAT.top,'C1');
  addM('جوائز سفلية',M.secB,q1,q2,MAT.bot,'C2');
  for(let i=0;i<=nB;i++){const u=i/nB;
    addM('تضليع',M.secW,p1.clone().lerp(p2,u),q1.clone().lerp(q2,u),MAT.web,'W1');}
  if(diag)for(let i=0;i<nB;i++){const u1=i/nB,u2=(i+1)/nB;
    const a=(i%2===0)?q1.clone().lerp(q2,u1):p1.clone().lerp(p2,u1);
    const b=(i%2===0)?p1.clone().lerp(p2,u2):q1.clone().lerp(q2,u2);
    addM('أقطار',M.secW,a,b,MAT.brace,'D1');}}

/* ---------- الغطاء : تصحيح اتجاه الميل ----------
   دوران الصندوق حول X بزاوية θ ينقل محوره +Z إلى (0,−sinθ,cosθ).
   لذلك: مستوى صاعد مع +Z ⇒ θ = −t ، ومستوى هابط ⇒ θ = +t.
   pt.dir = +1 للمستوى الصاعد و −1 للهابط ، والدوران = −dir·t      */
function cover(type,x0,x1,s0,slopeLen,pt){
  const t=pt.t,W=x1-x0,rot=-pt.dir*t;
  if(type==='pv'){
    const g=.02,gr=.05,o=[];
    o.push({o:'port',c:Math.floor((W+g)/(PANEL.h+g)),r:Math.floor((slopeLen+gr)/(PANEL.w+gr)),w:PANEL.h,h:PANEL.w});
    o.push({o:'land',c:Math.floor((W+g)/(PANEL.w+g)),r:Math.floor((slopeLen+gr)/(PANEL.h+gr)),w:PANEL.w,h:PANEL.h});
    o.forEach(p=>{p.c=Math.max(0,p.c);p.r=Math.max(0,p.r);p.n=p.c*p.r;});
    const pick=M.orient==='auto'?(o[0].n>=o[1].n?o[0]:o[1]):(M.orient==='port'?o[0]:o[1]);
    NP+=pick.n; PVINFO={o:pick.o,c:pick.c,r:pick.r,w:pick.w,h:pick.h};
    if(pick.n===0)return;
    const rowW=pick.c*pick.w+(pick.c-1)*g,px0=x0+(W-rowW)/2+pick.w/2;
    const arr=pick.r*pick.h+(pick.r-1)*gr,sS=s0+Math.max(0,(slopeLen-arr)/2);
    const off=pick.h<1.5?.28:.55;
    for(let r=0;r<pick.r;r++){
      const sr=sS+r*(pick.h+gr);
      [off,pick.h-off].forEach(oo=>{const p=pt.at(sr+oo);
        addM('مرابط الألواح',M.secR,V(x0,p.y+.03,p.z),V(x1,p.y+.03,p.z),MAT.rail,'R1');});
      const c=pt.at(sr+pick.h/2);
      for(let i=0;i<pick.c;i++){
        const m=new THREE.Mesh(new THREE.BoxGeometry(pick.w,PANEL.t,pick.h),MAT.pv);
        m.position.set(px0+i*(pick.w+g),c.y+.085,c.z); m.rotation.x=rot; gC.add(m);
        const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),MAT.edge);
        e.position.copy(m.position); e.rotation.x=rot; gC.add(e);}}
  }else if(type==='slat'){
    const n=Math.max(2,Math.floor(slopeLen/(M.slatGap+SEC[M.secR].b)));
    for(let i=0;i<=n;i++){const p=pt.at(s0+slopeLen*i/n);
      addM('تضليع الغطاء',M.secR,V(x0,p.y+.05,p.z),V(x1,p.y+.05,p.z),MAT.slat,'S1');}
  }else{
    const a=pt.at(s0),b=pt.at(s0+slopeLen);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,slopeLen),MAT.sheet);
    m.position.set((x0+x1)/2,(a.y+b.y)/2+.06,(a.z+b.z)/2);
    m.rotation.x=-Math.PI/2+rot; gC.add(m);
    const nP=Math.max(2,Math.round(slopeLen/1.5));
    for(let i=0;i<=nP;i++){const p=pt.at(s0+slopeLen*i/nP);
      addM('مدادات السقف',M.secR,V(x0,p.y+.05,p.z),V(x1,p.y+.05,p.z),MAT.rail,'R1');}}}

function builderA(T){
  const t=T.flat?0:Math.atan((M.h2-M.h1)/M.S),S=M.S,L=M.L;
  const nBay=Math.max(1,Math.round(L/M.bay)),bx=[];
  for(let i=0;i<=nBay;i++)bx.push(L*i/nBay);
  const nB=Math.max(4,Math.round(S/.9)),yA=M.h1,yB=T.flat?M.h1:M.h2;
  bx.forEach(x=>{
    if(T.dbl){truss(V(x,yB,0),V(x,yA,S/2),M.td,Math.round(nB/2),M.diag);
              truss(V(x,yA,S/2),V(x,yB,S),M.td,Math.round(nB/2),M.diag);}
    else truss(V(x,yB,0),V(x,yA,S),M.td,nB,M.diag);});
  const rows=T.dbl?[S/2]:(T.cant?[S*.28]:[0,S]);
  bx.forEach(x=>rows.forEach(z=>{
    const y=T.flat?M.h1:(M.h2+(M.h1-M.h2)*(z/S));
    addM('أعمدة',M.secP,V(x,0,z),V(x,y-M.td-.02,z),MAT.post,'P1');

  cover(T.cover,0,L,0,S/Math.cos(t),{t,dir:+1,at:s=>({z:s*Math.cos(t),y:(yF+.15)+s*Math.sin(t)})});

    [0,S].forEach(z=>{addM('أعمدة',M.secP,V(x,0,z),V(x,H,z),MAT.post,'P1');PLATES++;ANCH+=4;

/* ---------- 6. الحسابات ---------- */
/* محرّك الرياح — سلسلة EN 1991-1-4 مبسّطة */
function windCalc(zRef,tdeg,T){
  const TZ={I:[.01,1],II:[.05,2],III:[.3,5],IV:[1,10]}[M.terrain]||[.05,2];
  const z0=TZ[0],zmin=TZ[1],z=Math.max(zRef,zmin);
  const kr=.19*Math.pow(z0/.05,.07), vb=M.wind/3.6;
  const cr=kr*Math.log(z/z0), co=1, vm=cr*co*vb;
  const Iv=1/(co*Math.log(z/z0)), rho=1.25;
  const qb=.5*rho*vb*vb/1000;
  const qp=(1+7*Iv)*.5*rho*vm*vm/1000;
  const ce=qp/qb;
  const ts=[0,5,10,15,20,25,30];
  const CF=[.2,.4,.5,.7,.8,1,1.2];
  const CPx=[.5,.8,1.2,1.4,1.7,2,2.2];
  const CN0=[-.6,-1.1,-1.5,-1.9,-2.2,-2.6,-3];
  const CN1=[-1.3,-1.4,-1.5,-1.9,-2.2,-2.6,-3];
  const ip=a=>{const x=Math.min(30,Math.max(0,Math.abs(tdeg)));
    let i=0;while(i<ts.length-2&&x>ts[i+1])i++;
    return a[i]+(a[i+1]-a[i])*(x-ts[i])/(ts[i+1]-ts[i]);};
  let cf=ip(CF),cpMax=ip(CPx),cpMin=ip(M.phi?CN1:CN0),src='EN 1991-1-4 جدول 7.6 — مظلة أحادية الميل';
  if(T.bld==='H'){cpMax=.2;cpMin=-1.5;cf=.8;src='EN 1991-1-4 §7.2.5 سقف جملوني مغلق + ضغط داخلي c_pi=±0.3';}
  if(T.cover==='slat'){cpMax*=.45;cpMin*=.45;cf*=.45;src='سقف مضلّع مفتوح — الضغوط مخفّضة بنسبة النفاذية';}
  /* التمييز الجوهري:
     cf  = معامل القوة الكلية → يُستعمل لتصميم الإطار والجوائز والأعمدة (حمل عام)
     cp,net = معاملات الضغط الصافي المناطقية → تُستعمل للعناصر الموضعية والمرابط والمسامير */
  return {z0,zmin,z,kr,vb,cr,vm,Iv,qb,qp,ce,cf,cpMax,cpMin,src,
          wGl:qp*cf, wLocUp:qp*Math.abs(cpMin), wLocDn:qp*cpMax,
          wUp:qp*cf, wDn:qp*cpMax, Fh:qp*cf};}
let R={};
function compute(g){
  const T=TPL[M.tpl];
  const steel=Object.keys(QTY).reduce((a,k)=>a+QTY[k]*SEC[k].w,0);
  const plateKg=PLATES*7.1,tot=steel+plateKg;
  const area=M.L*M.S/Math.cos(g.t);
  const tdeg=g.t*180/Math.PI;
  const zRef=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2);
  const WD=windCalc(zRef,tdeg,T);
  const q=WD.qp,Cf=WD.cf,wWind=WD.wGl;
  const gk=(T.cover==='pv'?.12:(T.cover==='sheet'?.15:.08))+tot*.00981/Math.max(area,1);
  const sk=M.snow*.00981;
  const C1=1.35*gk+1.5*sk;                 // شاقولي نحو الأسفل
  const C2=Math.abs(1.5*WD.wGl-1.0*gk);    // رفع صافٍ عام (معامل القوة الكلية)
  const C3=1.35*gk+1.5*WD.wGl*.6;          // ضغط نحو الأسفل + ميت
  const wU=Math.max(C1,C2,C3);
  const Ls=g.spanMain,trib=g.trib,w=wU*trib;
  const Mmax=T.cant?w*Ls*Ls/2:w*Ls*Ls/8;
  const d=(T.bld==='H')?M.td+M.ridge*.5:M.td;
  const N=Mmax/Math.max(d,.2);
  const At=SEC[M.secT].A,Ab=SEC[M.secB].A;
  const sig=N/(Math.min(At,Ab)/1e4)/1e3,util=sig/157;
  const Ieff=At*Math.pow(d*100*.42,2)+Ab*Math.pow(d*100*.58,2);
  let def=5*w*Math.pow(Ls*1e3,4)/(384*21e4*Ieff*1e4);
  if(T.cant)def=w*Math.pow(Ls*1e3,4)/(8*21e4*Ieff*1e4);
  if(!M.diag)def*=3.5;
  const defR=Ls*1e3/Math.max(def,.01);
  const Rv=wU*area/Math.max(g.nSup,1),Hf=wWind*area*Math.sin(g.t)/Math.max(g.nSup,1);
  const hTop=(T.bld==='H')?M.clearH:Math.max(M.h1,M.h2);
  const ANCHOR={M14:{n:'M14 غوص 120 مم',NRd:16,VRd:20},M16:{n:'M16 غوص 130 مم',NRd:22,VRd:27}};
  const FIX={base:[.30,'قاعدة 300×300×10 مم + 4 مسامير كيميائية M14 غوص 120 مم','M14',4],
   beam:[.30,'بليتتان 200×200×10 مم على الوجه الخارجي للكمرة الباطونية، المسافة بين محوريهما 300 مم، كل بليتة 4 × Anchor M16 غوص 130 مم','M16',8],
   through:[.50,'امتداد 50 سم تحت السقف + ثروبولت 2×M16 لكل صف مع بليتة داخلية 200×200×10','M16',4],
   parapet:[1.00,'كتيفتان على العمامة بمسافة 1.00 م + مسامير كيميائية M14','M14',4],
   wall:[.40,'بليتة ارتكاز 250×250×10 + 4 مسامير كيميائية M14','M14',4],
   hangar:[.35,'كلامب مجلفن على جائز الهنغار + براغي M12 مع حشوة EPDM','M14',4],
   ballast:[1.20,'كتلة باطونية موزونة — تزيد 1.5× عن قوة الرفع','M14',4]};
  const f2=(M.fix2==='same')?M.fix:M.fix2;
  const G1=FIX[M.fix],G2=FIX[f2]||G1;
  const lever=Math.min(G1[0],G2[0]);
  const fixTxt=(f2===M.fix)?G1[1]:('الصف الأمامي: '+G1[1]+' — الصف الخلفي: '+G2[1]);
  const ab=(ANCHOR[G1[2]].NRd<=ANCHOR[G2[2]].NRd)?ANCHOR[G1[2]]:ANCHOR[G2[2]];
  const nBolt=Math.min(G1[3],G2[3]);
  const Rup=Math.max(0,1.5*WD.wLocUp-1.0*gk)*area/Math.max(g.nSup,1);   // شدّ مباشر بالضغوط الموضعية
  const Mbase=Hf*hTop+Rv*.1, boltT=Mbase/lever+Rup;
  const ballast=wWind*area*1.5/9.81*1000;
  const coatArea=Object.keys(QTY).reduce((a,k)=>a+QTY[k]*2*(SEC[k].b+SEC[k].h),0);
  const coatCost=M.coat==='galv'?tot*.55:(M.coat==='paint'?coatArea*5.5:0);
  const steelCost=tot*M.price,fabCost=tot*M.fab,kwp=NP*PANEL.Wp/1e3;
  const upTot=WD.wGl*area, wTot=tot*.00981+ (TPL[M.tpl].cover==='pv'?NP*PANEL.kg*.00981:0);
  const FS=wTot/Math.max(upTot,.001);
  const ecc=(T.bld==='H')?0:WD.Fh*area*0.25*(T.bld==='B'?M.S:M.S);
  R={T,WD,upTot,wTot,FS,ecc,Rup,ab,nBolt,steel,plateKg,tot,area,q,Cf,wWind,gk,sk,C1,C2,C3,wU,Ls,trib,w,Mmax,d,N,sig,util,def,defR,
     Rv,Hf,Mbase,boltT,fixTxt,lever,ballast,coatArea,coatCost,steelCost,fabCost,kwp,tdeg,g,
     total:steelCost+fabCost+coatCost,kgm2:tot/Math.max(area,1),At,Ab,Ieff,hTop};}

/* ---------- 7. البناء ---------- */
function build(){
  [gS,gC,gB,gD].forEach(clr);QTY={};KIND={};PC={};NP=0;PLATES=0;ANCH=0;PVINFO={};LEGS=[];
  makeSite();
  const T=TPL[M.tpl];T.id=M.tpl;
  const g=T.bld==='A'?builderA(T):T.bld==='B'?builderB(T):T.bld==='C'?builderC(T):builderH(T);
  compute(g);g.legs=LEGS.slice();validate();drawSite();dims(T,g);badge();}
function dims(T,g){
  const L=M.L,S=M.S,hi=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2);
  gD.add(dLine(V(0,-.45,S+.7),V(L,-.45,S+.7)));
  gD.add(lbl('L = '+L.toFixed(2)+' م',V(L/2,-.12,S+.7),'#0066A7',1.3));
  gD.add(dLine(V(L+.7,-.45,0),V(L+.7,-.45,S)));
  gD.add(lbl('B = '+S.toFixed(2)+' م',V(L+.7,-.12,S/2),'#0066A7',1.3));
  gD.add(dLine(V(-.6,0,0),V(-.6,hi,0)));
  gD.add(lbl('H = '+hi.toFixed(2)+' م',V(-.6,hi/2,0),'#0066A7',1.3));
  gD.add(lbl(R.tdeg.toFixed(1)+'° ميل',V(L*.5,hi+.5,S*.5),'#F1471E',1.2));
  if(TPL[M.tpl].cover==='pv'&&PVINFO.c)
    gD.add(lbl((PVINFO.o==='port'?'بورتريه ':'عرضاني ')+PVINFO.r+'×'+PVINFO.c,
      V(L*.5,hi+1.0,S*.5),'#0B2239',1.3));}
function badge(){
  const T=TPL[M.tpl];
  document.getElementById('badge').innerHTML=`<b>${T.n}</b><br>حديد <b>${R.tot.toFixed(0)} كغ</b> · ${R.kgm2.toFixed(1)} كغ/م²`+
   (T.cover==='pv'?`<br>${NP} لوح · <b>${R.kwp.toFixed(2)} kWp</b>`:'')+`<br>تقديري <b>$${R.total.toFixed(0)}</b>`;
  const u=R.util,cls=u<.75?'t-ok':(u<1?'t-w':'t-b');
  document.getElementById('util').innerHTML=`<span class="tag ${cls}">استغلال ${(u*100).toFixed(0)}%</span><br>
   <span style="font-size:10px">هبوط L/${R.defR.toFixed(0)}</span>`;}

/* ---------- 8. الموقع من صورة ---------- */
let TR={img:null,pts:[],sc:null,mode:'poly',p1:null,p2:null};
function siteFromTrace(){
  if(TR.pts.length<3||!TR.sc){log('حدّد 3 نقاط على الأقل وأدخل مقياس معلوم.',1);return;}
  const p=TR.pts.map(q=>[q.x/TR.sc,q.y/TR.sc]);
  const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);
  const mnx=Math.min(...xs),mny=Math.min(...ys);
  const poly=p.map(a=>[a[0]-mnx,a[1]-mny]);
  let A=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];A+=a[0]*b[1]-b[0]*a[1];}
  TRACE_POLY=poly; M.bShape='trace'; M.bOn=1; makeSite(); drawSite();
  const m=.6;M.L=+(SITE.bb[0]-2*m).toFixed(2);M.S=+Math.min(SITE.bb[1]-2*m,12).toFixed(2);
  if(M.L<2)M.L=2; if(M.S<1.5)M.S=1.5;
  log('مخطط الموقع جاهز: مساحة '+SITE.area.toFixed(1)+' م² · إطار أقصى '+SITE.bb[0].toFixed(2)+'×'+SITE.bb[1].toFixed(2)+' م. تم ملاءمة الهيكل تلقائياً.');
  build();fit();dock();}
function drawSite(){
  clr(gSite); if(!SITE)return;
  const P=SITE.poly.map(q=>[q[0]-M.bOX,q[1]-M.bOZ]);
  const H=Math.max(0,M.bF*M.bFH);
  const sh=new THREE.Shape();
  P.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
  // بلاطة السطح
  const sl=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.30,bevelEnabled:false}),MAT.ground);
  sl.rotation.x=Math.PI/2; gSite.add(sl);
  // كتلة المبنى
  if(H>0){
    const ms=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:H,bevelEnabled:false}),MAT.mass);
    ms.rotation.x=Math.PI/2; ms.position.y=-.30; gSite.add(ms);}
  // العمامة
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[(i+1)%P.length];
    if(M.bPar>0)gSite.add(tube(V(a[0],M.bPar/2,a[1]),V(b[0],M.bPar/2,b[1]),M.bParT,M.bPar,MAT.wall));
    // كورنيش الطوابق
    for(let k=1;k<=M.bF;k++){
      const y=-.30-H*k/Math.max(M.bF,1)+ (k===M.bF?.001:0);
      if(k<M.bF)gSite.add(tube(V(a[0],y,a[1]),V(b[0],y,b[1]),.06,.14,MAT.ground));}
    // الشبابيك موزّعة على كل ضلع
    if(M.win&&H>0){
      const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const n=Math.floor(L/2.6);
      for(let k=0;k<M.bF;k++){
        const y=-.30-H*(k+.55)/M.bF;
        for(let j=0;j<n;j++){
          const u0=(j+.5)/n-.55/L, u1=(j+.5)/n+.55/L;
          const p1=V(a[0]+(b[0]-a[0])*u0,y,a[1]+(b[1]-a[1])*u0);
          const p2=V(a[0]+(b[0]-a[0])*u1,y,a[1]+(b[1]-a[1])*u1);
          gSite.add(tube(p1,p2,M.bParT+.08,1.25,MAT.win));}}}}
  gSite.add(lbl('السطح '+SITE.area.toFixed(1)+' م²'+(H>0?' · '+M.bF+' طوابق · '+H.toFixed(1)+' م':''),
    V(SITE.bb[0]*.5-M.bOX,M.bPar+.45,-M.bOZ-.8),'#5b6b7a',1.8));
  // خط حدود الهيكل على السطح
  [[0,0],[M.L,0],[M.L,M.S],[0,M.S]].forEach((p,i,arr)=>{
    const q=arr[(i+1)%4];
    gSite.add(tube(V(p[0],.02,p[1]),V(q[0],.02,q[1]),.04,.02,MAT.brace));});}

/* ---------- 9. محرّك الأوامر العربي ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
function num(s){return s.replace(/[٠-٩]/g,c=>AR.indexOf(c));}
function grab(txt,keys){
  for(const k of keys){
    const re=new RegExp(k+'\\s*[:=]?\\s*(-?\\d+(?:[.,]\\d+)?)');
    const m=txt.match(re); if(m)return parseFloat(m[1].replace(',','.'));}
  return null;}
function aiApply(raw){
  const t=num(raw).replace(/[×xX*]/g,'x');
  const ch=[];
  const T0=M.tpl;
  if(/مزدوج|صفين\s*سيار/.test(t))M.tpl='S3';
  else if(/موقف|كارب|carport/i.test(t))M.tpl=/جهتين|عمودين|صفي\s*أعمدة/.test(t)?'S1':'S2';
  else if(/هنغار/.test(t)&&/فوق|سطح/.test(t))M.tpl='S6';
  else if(/هنغار/.test(t))M.tpl=/مائل|مفرد/.test(t)?'H2':'H1';
  else if(/برغول|بركول/.test(t))M.tpl=/كابول|حائط/.test(t)?'P3':(/مائل/.test(t)?'P2':'P1');
  else if(/مظل[ةه]/.test(t))M.tpl=/سطح\s*مبنى/.test(t)?'S4':'S1';
  else if(/ثروبولت|واجهة|خارج\s*العمامة/.test(t))M.tpl='S5';
  else if(/حائطين|بين\s*حائط|بدون\s*(أ|ا)رجل/.test(t))M.tpl='S7';
  else if(/سطح\s*مبنى|4\s*أعمدة|أربع\s*أعمدة/.test(t))M.tpl='S4';
  if(M.tpl!==T0){applyTpl(M.tpl);M.cat=TPL[M.tpl].cat;ch.push('النموذج → '+TPL[M.tpl].n);}
  const set=(k,v,u)=>{if(v===null||isNaN(v))return;const f=F[k];
    if(f&&f.t==='r')v=Math.min(f.max,Math.max(f.min,v));
    if(M[k]!==v){M[k]=v;ch.push(f.l+' → '+v+(u||''));}};
  set('L',grab(t,['الطول','طول','لون?ج']));
  set('S',grab(t,['البحر','بحر','العرض','عرض']));
  set('h1',grab(t,['الارتفاع\\s*الأمامي','ارتفاع\\s*أمامي','امامي']));
  set('h2',grab(t,['الارتفاع\\s*الخلفي','ارتفاع\\s*خلفي','خلفي']));
  set('bay',grab(t,['تباعد','المسافة\\s*بين']));
  set('td',grab(t,['ارتفاع\\s*الجمالون','عمق\\s*الجمالون']));
  set('clearH',grab(t,['الارتفاع\\s*الصافي','صافي']));
  set('ridge',grab(t,['الجملون','جملون']));
  set('wind',grab(t,['ريح','الريح']));
  set('snow',grab(t,['ثلج','الثلج']));
  const tl=grab(t,['ميل','زاوية']);
  if(tl!==null&&!isNaN(tl)&&TPL[M.tpl].bld!=='H'){
    const sl=(TPL[M.tpl].bld==='B')?M.S:M.S;
    M.h2=+(M.h1+sl*Math.tan(tl*Math.PI/180)).toFixed(2);ch.push('ميل '+tl+'° → ارتفاع خلفي '+M.h2+' م');}
  if(/بدون\s*أقطار|مستطيل|vierendeel/i.test(t)){M.diag=0;ch.push('جمالون مستطيل بدون أقطار');}
  if(/مع\s*أقطار|مثلث/.test(t)){M.diag=1;ch.push('جمالون بأقطار');}
  if(/بورتريه|طولي\s*اللوح/.test(t)){M.orient='port';ch.push('ألواح بورتريه');}
  if(/عرضاني|landscape/i.test(t)){M.orient='land';ch.push('ألواح عرضانية');}
  if(/كيميائي/.test(t)){M.fix='base';ch.push('تثبيت: قاعدة كيميائية');}
  if(/ثروبولت/.test(t)){M.fix='through';ch.push('تثبيت: ثروبولت');}
  if(/عمامة/.test(t)){M.fix='parapet';ch.push('تثبيت: كتائف العمامة');}
  if(/كلامب/.test(t)){M.fix='hangar';ch.push('تثبيت: كلامب');}
  if(/وزن\s*باطون|بالاست/.test(t)){M.fix='ballast';ch.push('تثبيت: وزن باطوني');}
  if(/جلفن/.test(t)){M.coat='galv';ch.push('حماية: جلفنة');}
  const secs=t.match(/\d{2,3}x\d{2,3}(?:x[\d.]+)?/g)||[];
  secs.forEach(s=>{
    const k=Object.keys(SEC).find(q=>q.startsWith(s))||Object.keys(SEC).find(q=>q.indexOf(s)===0);
    if(!k)return;
    if(/عمود|أعمدة|رجل|أرجل/.test(t)&&SEC[k].b>=.08){M.secP=k;ch.push('الأعمدة → '+k);}
    else if(/مراب|مداد|تضليع/.test(t)&&SEC[k].b<=.06){M.secW=k;M.secR=k;ch.push('التضليع/المرابط → '+k);}
    else if(SEC[k].h>=.1){M.secT=k;ch.push('الجائز العلوي → '+k);}
    else {M.secB=k;ch.push('الجائز السفلي → '+k);}});
  if(!ch.length){log('لم أفهم أمراً قابلاً للتنفيذ. مثال: «موقف سيارات طول 18 بحر 5.5 ميل 12 أعمدة 120x120 بدون أقطار».',1);return;}
  build();fit();dock();
  log('تم: '+ch.join(' · '));}
function log(s,e){
  const el=document.getElementById('log'); if(!el)return;
  const d=document.createElement('div'); if(e)d.className='e'; d.textContent=s;
  el.insertBefore(d,el.firstChild);}

/* ---------- 10. رسم SVG للخرائط التنفيذية ---------- */
function SV(w,h,body,grid){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal,Arial">
  <rect width="${w}" height="${h}" fill="#fff"/>${grid||''}${body}</svg>`;}
const ln=(a,b,c,d,st)=>`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" stroke="${(st&&st.c)||'#16222e'}" stroke-width="${(st&&st.w)||1.3}" ${st&&st.dash?'stroke-dasharray="5 3"':''}/>`;
const tx=(x,y,t,o)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${(o&&o.s)||10}" fill="${(o&&o.c)||'#16222e'}" text-anchor="${(o&&o.a)||'middle'}" ${o&&o.b?'font-weight="700"':''} ${o&&o.r?`transform="rotate(${o.r} ${x.toFixed(1)} ${y.toFixed(1)})"`:''}>${t}</text>`;
const rc=(x,y,w,h,f,s)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.abs(w).toFixed(1)}" height="${Math.abs(h).toFixed(1)}" fill="${f||'none'}" stroke="${s||'#16222e'}" stroke-width="1.1"/>`;
function dimH(x1,x2,y,t){
  const c='#0066A7';
  return ln(x1,y,x2,y,{c,w:.9})+ln(x1,y-4,x1,y+4,{c,w:.9})+ln(x2,y-4,x2,y+4,{c,w:.9})+
   `<rect x="${((x1+x2)/2-20).toFixed(1)}" y="${(y-8).toFixed(1)}" width="40" height="11" fill="#fff"/>`+
   tx((x1+x2)/2,y+1,t,{s:9,c,b:1});}
function dimV(y1,y2,x,t){
  const c='#0066A7';
  return ln(x,y1,x,y2,{c,w:.9})+ln(x-4,y1,x+4,y1,{c,w:.9})+ln(x-4,y2,x+4,y2,{c,w:.9})+
   `<rect x="${(x-20).toFixed(1)}" y="${((y1+y2)/2-6).toFixed(1)}" width="40" height="11" fill="#fff"/>`+
   tx(x,(y1+y2)/2+3,t,{s:9,c,b:1});}

function sheetPlan(){

    (g.rows||[]).forEach(z=>{

  b+=dimH(X(0),X(M.L),Z(M.S)+18,M.L.toFixed(2)+' م');
  b+=dimV(Z(0),Z(M.S),X(M.L)+18,M.S.toFixed(2)+' م');
  if((g.bx||[]).length>1)b+=dimH(X(g.bx[0]),X(g.bx[1]),Z(0)-24,(g.bx[1]-g.bx[0]).toFixed(2));
  b+=tx(X(M.L/2),26,'مخطط أفقي — توزيع الإطارات والأعمدة',{s:12,b:1,c:'#0B2239'});
  b+=tx(mx,H-14,'شمال الرسم اختياري — يُثبّت اتجاه الانحدار حسب الجنوب في الموقع',{s:9,a:'start',c:'#5b6b7a'});

function sheetSection(){

    if(isB){[.15,span-.15].forEach(x=>{

function sheetTruss(){

function sheetDetail(){

function cutList(){
  const items=Object.values(PC).sort((a,b)=>a.mark<b.mark?-1:1);
  let rows='',tw=0;
  items.forEach(p=>{const wt=p.len*p.q*SEC[p.sec].w;tw+=wt;
    rows+=`<tr><td class="n">${p.mark}</td><td>${p.kind}</td><td class="n">${p.sec}</td>
     <td class="n">${p.len.toFixed(2)}</td><td class="n">${p.q}</td><td class="n">${(p.len*p.q).toFixed(1)}</td><td class="n">${wt.toFixed(0)}</td></tr>`;});
  return {rows,tw,n:items.length};}

function sheetElev(kind){
  const T=TPL[M.tpl],W=760,H=400,mx=70,my=58,rear=(kind==='rear');
  const yEdge=(T.bld==='H')?M.clearH:(T.flat?M.h1:(rear?M.h2:M.h1));
  const hiTop=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2)+.3;
  const sc=Math.min((W-2*mx)/M.L,(H-2*my)/hiTop);
  const X=x=>mx+x*sc,Y=y=>H-my-y*sc;
  const xs=R.g.bx||[0,M.L];
  const postTop=z=>(T.bld==='H')?M.clearH:((T.flat?M.h1:(M.h2+(M.h1-M.h2)*(z/M.S)))-M.td-.02);
  let b='';
  b+=ln(mx-34,Y(0),W-mx+34,Y(0),{c:'#8d8577',w:2});
  for(let i=0;i<30;i++)b+=ln(mx-34+i*((W-2*mx+68)/30),Y(0),mx-40+i*((W-2*mx+68)/30),Y(0)+7,{c:'#8d8577',w:.8});
  // الصفوف البعيدة متقطعة
  (R.g.rows||[]).forEach((z,k)=>{
    const near=rear?(z===Math.min(...R.g.rows)):(z===Math.max(...R.g.rows));
    const st=near?{w:3,c:'#53606c'}:{w:1.2,c:'#9aa6b0',dash:1};
    xs.forEach(x=>{b+=ln(X(x),Y(0),X(x),Y(postTop(z)),st);
      if(near)b+=rc(X(x)-13,Y(0)-4,26,5,'#53606c','#16222e');});});
  if(T.bld==='C'){ // حائط ارتكاز بدل الأعمدة
    b+=rc(X(0)-6,Y(yEdge-M.td),M.L*sc+12,(yEdge-M.td)*sc,'#e6e0d4','#8d8577');
    b+=tx(X(M.L*.5),Y((yEdge-M.td)*.5),'حائط الارتكاز',{s:11,b:1,c:'#5b6b7a'});}
  // حافة السقف + الجمالون
  b+=ln(X(0),Y(yEdge),X(M.L),Y(yEdge),{w:2.6});
  if(T.bld==='B'){
    b+=ln(X(0),Y(yEdge-M.td),X(M.L),Y(yEdge-M.td),{w:1.8});
    const n=R.g.nWeb||8;
    for(let i=0;i<=n;i++)b+=ln(X(M.L*i/n),Y(yEdge),X(M.L*i/n),Y(yEdge-M.td),{c:'#9aa6b0',w:1});
    if(M.diag)for(let i=0;i<n;i++)b+=(i%2===0)?ln(X(M.L*i/n),Y(yEdge-M.td),X(M.L*(i+1)/n),Y(yEdge),{c:'#F1471E',w:1.1})
      :ln(X(M.L*i/n),Y(yEdge),X(M.L*(i+1)/n),Y(yEdge-M.td),{c:'#F1471E',w:1.1});
    b+=tx(X(M.L*.5),Y(yEdge)-9,'الجمالون الطولي C1/C2 — '+M.secT+' / '+M.secB,{s:9,b:1});
  }else{
    xs.forEach(x=>b+=ln(X(x),Y(yEdge),X(x),Y(yEdge-Math.min(M.td,yEdge*.5)),{c:'#9aa6b0',w:1}));
    b+=ln(X(0),Y(yEdge-Math.min(M.td,yEdge*.5)),X(M.L),Y(yEdge-Math.min(M.td,yEdge*.5)),{w:1.4,c:'#9aa6b0'});}
  // تربيط قطري في البحرين الطرفيين
  if(xs.length>1&&T.bld!=='C'){
    const zz=rear?Math.min(...(R.g.rows||[0])):Math.max(...(R.g.rows||[0]));
    [[xs[0],xs[1]],[xs[xs.length-2],xs[xs.length-1]]].forEach(([a,c])=>{
      b+=ln(X(a),Y(.2),X(c),Y(postTop(zz)-.15),{c:'#F1471E',w:1.4});
      b+=ln(X(c),Y(.2),X(a),Y(postTop(zz)-.15),{c:'#F1471E',w:1.4});});
    b+=tx(X((xs[0]+xs[1])/2),Y(0)+22,'B1 تربيط',{s:9,c:'#F1471E',b:1});}
  if(T.bld==='H'){
    b+=ln(X(0),Y(M.clearH+M.ridge),X(M.L),Y(M.clearH+M.ridge),{c:'#9aa6b0',w:1.2,dash:1});
    b+=tx(X(M.L*.5),Y(M.clearH+M.ridge)-7,'خط الجملون',{s:9,c:'#5b6b7a'});}
  b+=dimV(Y(0),Y(yEdge),X(0)-26,yEdge.toFixed(2));
  if(xs.length>1)b+=dimH(X(xs[0]),X(xs[1]),Y(0)+32,(xs[1]-xs[0]).toFixed(2));
  b+=dimH(X(0),X(M.L),Y(0)+54,M.L.toFixed(2)+' م');
  b+=tx(W/2,26,rear?'واجهة خلفية (الجهة المرتفعة)':'واجهة أمامية (الجهة المنخفضة)',{s:12,b:1,c:'#0B2239'});
  b+=tx(W-mx,H-12,'الأعمدة البعيدة مرسومة متقطعة',{s:9,a:'end',c:'#5b6b7a'});
  return SV(W,H,b);}

function snap(th,ph){
  const t0=theta,p0=phi;
  if(th!==undefined){theta=th;phi=ph;place();}
  renderer.render(scene,camera);
  let d='';try{d=renderer.domElement.toDataURL('image/png');}catch(e){d='';}
  theta=t0;phi=p0;place();renderer.render(scene,camera);
  return d;}
function sheet3D(){
  const views=[['منظور عام',-1.05,1.0],['من الجانب',0,1.40],['من الخلف',-Math.PI/2,1.42],['من الأمام',Math.PI/2,1.42]];
  let h='<div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px">';
  views.forEach(([n,t,p])=>{const d=snap(t,p);

  return h+'</div>';}

    t.innerHTML=`<tr><th>وزن الحديد</th><td class="n">${R.tot.toFixed(0)} كغ</td></tr>
     <tr><th>كغ/م²</th><td class="n">${R.kgm2.toFixed(1)}</td></tr>
     <tr><th>الاستغلال</th><td class="n">${(R.util*100).toFixed(0)}%</td></tr>
     <tr><th>الهبوط</th><td class="n">L/${R.defR.toFixed(0)}</td></tr>
     <tr><th>شدّ المسامير</th><td class="n">${R.boltT.toFixed(1)} kN</td></tr>
     <tr><th>التكلفة</th><td class="n">$${R.total.toFixed(0)}</td></tr>`;
    el.appendChild(t);
  } else if(TAB==='id'){
    grp('الهوية البصرية');
    tip('الشعار المرسوم داخل المنصة تقريبي. ارفع ملف الشعار الرسمي (PNG بخلفية شفافة) ليُستخدم في كل التقارير والخرائط.');
    const f1=document.createElement('input');f1.type='file';f1.accept='image/*';
    f1.onchange=e=>rd(e.target.files[0],s=>{LOGO_IMG=s;save();document.getElementById('logoBox').innerHTML=logoHTML(32);dock();});
    const r1=document.createElement('div');r1.className='f';const l1=document.createElement('label');l1.textContent='شعار iCOOL';
    r1.appendChild(l1);r1.appendChild(f1);el.appendChild(r1);
    const f2=document.createElement('input');f2.type='file';f2.accept='image/*';
    f2.onchange=e=>rd(e.target.files[0],s=>{SIGN_IMG=s;save();dock();});
    const r2=document.createElement('div');r2.className='f';const l2=document.createElement('label');l2.textContent='التوقيع/الختم';
    r2.appendChild(l2);r2.appendChild(f2);el.appendChild(r2);
    const pv=document.createElement('div');pv.style.cssText='margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px';
    pv.innerHTML=logoHTML(46)+(SIGN_IMG?`<br><img src="${SIGN_IMG}" style="max-height:60px;margin-top:6px">`:'');
    el.appendChild(pv);
    if(LOGO_IMG||SIGN_IMG){const b=document.createElement('button');b.textContent='حذف الملفات المرفوعة';
      b.onclick=()=>{LOGO_IMG=SIGN_IMG=null;save();document.getElementById('logoBox').innerHTML=logoHTML(32);dock();};el.appendChild(b);}
  }
}
function field(el,k){
  const f=F[k];if(!f)return;
  const row=document.createElement('div');row.className='f';
  const lab=document.createElement('label');lab.textContent=f.l;row.appendChild(lab);
  if(f.t==='r'){
    const i=document.createElement('input');i.type='range';i.min=f.min;i.max=f.max;i.step=f.st;i.value=M[k];
    const v=document.createElement('div');v.className='v';v.textContent=(+M[k]).toFixed(2);
    i.oninput=()=>{M[k]=+i.value;v.textContent=(+M[k]).toFixed(2);build();};
    row.appendChild(i);row.appendChild(v);
  }else if(f.t==='s'){
    const s=document.createElement('select');
    f.o.forEach(o=>{const val=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;
      const op=document.createElement('option');op.value=val;op.textContent=t;
      if(String(M[k])===String(val))op.selected=true;s.appendChild(op);});
    s.onchange=()=>{M[k]=f.num?+s.value:s.value;build();};row.appendChild(s);
  }else{
    const i=document.createElement('input');i.type='text';i.value=M[k]||'';
    i.oninput=()=>{M[k]=i.value;};row.appendChild(i);}
  el.appendChild(row);}

/* ---------- تتبّع الصورة ---------- */
function rd(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);}
function loadTrace(f){rd(f,s=>{const im=new Image();im.onload=()=>{TR.img=im;TR.pts=[];TR.sc=null;paint();};im.src=s;});}
function paint(){
  const cv=document.getElementById('trace');if(!cv)return;
  const W=cv.parentElement.clientWidth-24||320;
  cv.width=W;cv.height=Math.round(W*0.72);
  const c=cv.getContext('2d');
  c.fillStyle='#f7f9fb';c.fillRect(0,0,cv.width,cv.height);
  if(TR.img){
    const r=Math.min(cv.width/TR.img.width,cv.height/TR.img.height);
    TR.dw=TR.img.width*r;TR.dh=TR.img.height*r;TR.ox=(cv.width-TR.dw)/2;TR.oy=(cv.height-TR.dh)/2;
    c.drawImage(TR.img,TR.ox,TR.oy,TR.dw,TR.dh);
  }else{c.fillStyle='#9aa6b0';c.font='13px Tajawal';c.textAlign='center';
    c.fillText('ارفع صورة المخطط أولاً',cv.width/2,cv.height/2);}
  if(TR.p1&&TR.p2){c.strokeStyle='#F1471E';c.lineWidth=2;c.beginPath();
    c.moveTo(TR.p1.x,TR.p1.y);c.lineTo(TR.p2.x,TR.p2.y);c.stroke();}
  if(TR.pts.length){
    c.strokeStyle='#0066A7';c.fillStyle='rgba(0,102,167,.14)';c.lineWidth=2;
    c.beginPath();TR.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
    if(TR.pts.length>2)c.closePath();c.fill();c.stroke();
    c.fillStyle='#0066A7';TR.pts.forEach((p,i)=>{c.beginPath();c.arc(p.x,p.y,4,0,7);c.fill();});}
  const st=document.getElementById('trst');
  if(st)st.innerHTML=`الوضع: <b>${TR.mode==='scale'?'مقياس':'محيط'}</b> · نقاط: ${TR.pts.length} · `+
    (TR.sc?`المقياس: ${TR.sc.toFixed(1)} px/م`:'<b style="color:#c02617">لا مقياس بعد</b>');}
function onTrace(e){
  const cv=e.target,r=cv.getBoundingClientRect();
  const p={x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};
  if(TR.mode==='scale'){
    if(!TR.p1){TR.p1=p;}
    else{TR.p2=p;
      const d=prompt('المسافة الحقيقية بين النقطتين بالمتر:','8.07');
      const v=parseFloat(num(String(d||'')).replace(',','.'));
      if(v>0){TR.sc=Math.hypot(TR.p2.x-TR.p1.x,TR.p2.y-TR.p1.y)/v;}
      TR.mode='poly';}
  }else TR.pts.push(p);
  paint();}

/* ---------- تخزين ---------- */
function save(){try{localStorage.setItem('icool_ss',JSON.stringify({LOGO_IMG,SIGN_IMG}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('icool_ss')||'{}');
  if(s.LOGO_IMG)LOGO_IMG=s.LOGO_IMG; if(s.SIGN_IMG)SIGN_IMG=s.SIGN_IMG;}catch(e){}}

/* ---------- كاميرا ---------- */
let rho=24,theta=-1.05,phi=1.02,tgt=new THREE.Vector3(5,1.5,3);
function place(){camera.position.set(tgt.x+rho*Math.sin(phi)*Math.cos(theta),tgt.y+rho*Math.cos(phi),tgt.z+rho*Math.sin(phi)*Math.sin(theta));camera.lookAt(tgt);}
function fit(){const T=TPL[M.tpl];
  const hi=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2||M.h1);
  tgt.set(M.L/2,hi*.45,M.S/2);rho=Math.max(M.L,M.S)*1.85+5;place();}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;
  if(w<10||h<10)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',()=>{resize();paint();});
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
const el=renderer.domElement;let drag=false,lx=0,ly=0,pinch=0;
const dst=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
function down(x,y){drag=true;lx=x;ly=y;}
function mv(x,y){if(!drag)return;theta-=(x-lx)*.008;phi=Math.max(.07,Math.min(1.55,phi-(y-ly)*.006));lx=x;ly=y;place();}
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
addEventListener('mouseup',()=>drag=false);
el.addEventListener('wheel',e=>{e.preventDefault();rho=Math.max(3,Math.min(300,rho+e.deltaY*.03));place();},{passive:false});
el.addEventListener('touchstart',e=>{if(e.touches.length===1)down(e.touches[0].clientX,e.touches[0].clientY);else if(e.touches.length===2){drag=false;pinch=dst(e);}},{passive:true});
el.addEventListener('touchmove',e=>{e.preventDefault();
 if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);
 else if(e.touches.length===2){const d=dst(e);rho=Math.max(3,Math.min(300,rho*(pinch/d)));pinch=d;place();}},{passive:false});
el.addEventListener('touchend',()=>drag=false,{passive:true});
document.getElementById('vCover').onclick=e=>{gC.visible=!gC.visible;e.target.classList.toggle('on',gC.visible);};
document.getElementById('vDim').onclick=e=>{gD.visible=!gD.visible;e.target.classList.toggle('on',gD.visible);};
document.getElementById('vSite').onclick=e=>{const v=!gSite.visible;gSite.visible=v;gB.visible=v;e.target.classList.toggle('on',v);};
document.getElementById('vFit').onclick=fit;
document.getElementById('vDock').onclick=e=>{
  const d=document.getElementById('dock');d.classList.toggle('min');
  e.target.textContent=d.classList.contains('min')?'▲':'▼';setTimeout(resize,260);};

/* ---------- تشغيل ---------- */
load();
document.getElementById('logoBox').innerHTML=logoHTML(32);
drawTabs();build();fit();dock();resize();
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);})();
</script>
</body>
