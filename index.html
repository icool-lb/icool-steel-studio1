<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>iCOOL Steel Studio v2</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#0066A7;--orange:#F1471E;--navy:#0B2239;--ink:#16222e;--line:#dbe2e9;--paper:#eef2f6;--ok:#1a7f4b;--warn:#b06a00;--bad:#c02617}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Tajawal,system-ui,sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:#fff;border-bottom:3px solid var(--orange);padding:5px 9px;display:flex;align-items:center;gap:8px;flex:0 0 auto}
.logo{height:32px;width:auto;direction:ltr}
.brand h1{margin:0;font-size:13.5px;font-weight:800;color:var(--navy);line-height:1.1}
.brand p{margin:1px 0 0;font-size:10px;color:#5b6b7a}
#tabs{display:flex;gap:4px;background:#fff;padding:5px 6px;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs button{white-space:nowrap;font-size:11.5px;padding:6px 9px}
button{font-family:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--navy);padding:6px 9px;border-radius:8px;cursor:pointer;font-size:11.5px}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.o{border-color:var(--orange);color:var(--orange)}
button.o.on{background:var(--orange);color:#fff}
#main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1 1 auto;min-height:120px}
canvas#gl{display:block;width:100%;height:100%;touch-action:none}
#badge{position:absolute;top:6px;inset-inline-start:6px;background:rgba(255,255,255,.93);border-radius:8px;padding:5px 8px;font-size:10.5px;line-height:1.55;box-shadow:0 2px 9px rgba(11,34,57,.12);max-width:58%}
#badge b{color:var(--blue)}
#util{position:absolute;top:6px;inset-inline-end:6px;background:rgba(255,255,255,.93);border-radius:8px;padding:5px 8px;font-size:10.5px;text-align:center;box-shadow:0 2px 9px rgba(11,34,57,.12)}
#vbar{position:absolute;bottom:5px;inset-inline-end:6px;display:flex;gap:4px}
#vbar button{padding:4px 7px;font-size:10.5px;background:rgba(255,255,255,.93)}
#dock{flex:0 0 auto;height:40vh;background:#fff;border-top:3px solid var(--blue);overflow:auto;padding:8px 10px 18px}
#dock.min{height:0;padding:0;overflow:hidden;border-top-width:0}
.grp{margin:7px 0 2px;font-size:10.5px;font-weight:800;color:var(--orange);border-bottom:1px dashed var(--line);padding-bottom:2px}
.f{display:flex;align-items:center;gap:7px;margin:5px 0}
.f label{font-size:11.5px;min-width:104px;color:var(--navy);font-weight:700}
.f input[type=range]{flex:1;accent-color:var(--orange)}
.f .v{font-size:11.5px;font-weight:800;color:var(--blue);min-width:56px;text-align:left;direction:ltr}
.f select,.f input[type=text],.f input[type=number],.f input[type=file]{flex:1;font-family:inherit;font-size:11.5px;padding:5px 6px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
.tip{font-size:10.5px;color:#5b6b7a;line-height:1.7;background:#f5f8fb;border-radius:7px;padding:6px 8px;margin:6px 0}
#cmd{display:flex;gap:5px;margin:6px 0}
#cmd textarea{flex:1;font-family:inherit;font-size:12px;padding:6px;border:1px solid var(--line);border-radius:8px;height:58px;resize:none}
#log{font-size:11px;line-height:1.7;max-height:150px;overflow:auto}
#log div{padding:4px 6px;border-radius:6px;margin:3px 0;background:#f5f8fb}
#log .e{background:#fff1ee;color:#8c2013}
#trace{width:100%;border:1px solid var(--line);border-radius:8px;touch-action:none;background:#f7f9fb}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:5px 0}
.chips button{font-size:10.5px;padding:4px 8px}
#ov{position:fixed;inset:0;background:#fff;z-index:60;overflow:auto;display:none}
#ov.open{display:block}
.otop{position:sticky;top:0;background:#fff;border-bottom:2px solid var(--orange);padding:7px 10px;display:flex;gap:5px;z-index:3}
.obody{padding:10px 12px 60px;max-width:940px;margin:0 auto}
.obody h2{font-size:13.5px;color:#fff;background:var(--navy);padding:5px 8px;border-radius:5px;margin:15px 0 7px}
.obody h3{font-size:12px;color:var(--blue);margin:11px 0 4px}
.obody p,.obody li{font-size:11.5px;line-height:1.8}
table{width:100%;border-collapse:collapse;font-size:11px;margin:5px 0 9px}
th{background:#f2f5f8;color:var(--navy);padding:4px;text-align:right;border:1px solid var(--line)}
td{border:1px solid var(--line);padding:4px}
td.n{text-align:left;direction:ltr;font-weight:700}
.tag{display:inline-block;padding:1px 6px;border-radius:20px;font-size:10px;font-weight:800;color:#fff}
.t-ok{background:var(--ok)}.t-w{background:var(--warn)}.t-b{background:var(--bad)}
.note{font-size:11px;line-height:1.75;background:#fff6f3;border-inline-start:4px solid var(--orange);padding:7px 9px;border-radius:7px;margin:7px 0}
.kpi{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0 9px}
.kpi div{flex:1 1 30%;background:#f4f7fa;border:1px solid var(--line);border-radius:8px;padding:6px}
.kpi span{display:block;font-size:10px;color:#5b6b7a}
.kpi b{font-size:13px;color:var(--blue)}
.sign{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sign div{flex:1 1 44%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px;line-height:1.7}
.sign img{max-height:70px}
.sheet{border:1.5px solid var(--navy);border-radius:4px;margin:14px 0;background:#fff;overflow:hidden}
.sheet .tb{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--navy);padding:4px 7px;background:#f4f7fa;font-size:10.5px;font-weight:800;color:var(--navy)}
.sheet svg{width:100%;height:auto;display:block;direction:ltr}
.foot{border-top:1px solid var(--line);margin-top:16px;padding-top:7px;font-size:10px;color:#5b6b7a;line-height:1.7}
@media (min-width:820px){
  #main{flex-direction:row}
  #dock{height:auto;width:370px;border-top:0;border-inline-start:3px solid var(--blue)}
  #dock.min{width:0;padding:0}
}
@media print{
  @page{size:A4;margin:0}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{height:auto!important;min-height:0!important;overflow:visible!important;background:#fff}
  #app{display:none!important}
  #ov{position:static!important;inset:auto!important;display:block!important;overflow:visible!important;height:auto!important;z-index:auto}
  .otop{display:none!important}
  .obody{max-width:100%;margin:0;padding:14mm 12mm}
  .sheet{page-break-inside:avoid;break-inside:avoid;overflow:visible}
  tr,td,th{page-break-inside:avoid;break-inside:avoid}
  thead{display:table-header-group}
  h2,h3{page-break-after:avoid;break-after:avoid}
  .foot{page-break-inside:avoid;break-inside:avoid}
}
</style>
</head>
<body>

<div id="app">
<header>
  <span id="logoBox"></span>
  <div class="brand"><h1>Steel Studio <span style="font-size:10px;color:#F1471E">v2</span></h1>
  <p>دراسة هياكل حديدية · برغولا · طاقة · هنغار</p></div>
</header>

<div id="tabs"></div>

<div id="main">
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="badge"></div>
    <div id="util"></div>
    <div id="vbar">
      <button id="vCover" class="on">غطاء</button>
      <button id="vDim" class="on">أبعاد</button>
      <button id="vSite" class="on">الموقع</button>
      <button id="vRoom">الغرفة</button>
      <button id="vFit">ضبط</button>
      <button id="vDock">▼</button>
    </div>
  </div>
  <div id="dock"></div>
</div>
</div>

<div id="ov"><div class="otop" id="ovTop"></div><div class="obody" id="ovBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =======================================================================
   iCOOL Steel Studio v2.0
   منصة بارامترية لدراسة الهياكل الحديدية
   الوحدات: تصميم حيّ · صورة→مخطط · محرّك أوامر عربي · تقرير موقّع · خرائط تنفيذية
   ======================================================================= */

/* ---------- 1. الهوية البصرية ---------- */
const LOGO=`<svg class="logo" viewBox="0 0 306 96" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
 <defs><linearGradient id="ic_g" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#1D8FC6"/><stop offset="1" stop-color="#005E9E"/></linearGradient>
 <clipPath id="ic_c"><circle cx="41" cy="36" r="23"/></clipPath></defs>
 <path d="M41 6c-14 0-25 11-25 25 0 15 17 31 25 44 8-13 25-29 25-44C66 17 55 6 41 6z" fill="url(#ic_g)"/>
 <circle cx="41" cy="36" r="23" fill="#fff"/>
 <rect x="17" y="12" width="24" height="48" fill="#0066A7" clip-path="url(#ic_c)"/>
 <rect x="41" y="12" width="25" height="48" fill="#F1471E" clip-path="url(#ic_c)"/>
 <g stroke="#fff" stroke-width="2.1" stroke-linecap="round">
  <line x1="30" y1="25" x2="30" y2="47"/><line x1="20.5" y1="30.5" x2="39.5" y2="41.5"/>
  <line x1="20.5" y1="41.5" x2="39.5" y2="30.5"/>
  <line x1="30" y1="28.5" x2="27" y2="25.5"/><line x1="30" y1="28.5" x2="33" y2="25.5"/>
  <line x1="30" y1="43.5" x2="27" y2="46.5"/><line x1="30" y1="43.5" x2="33" y2="46.5"/>
 </g>
 <g stroke="#fff" stroke-width="2.1" stroke-linecap="round">
  <circle cx="52" cy="36" r="6" fill="#fff" stroke="none"/>
  <line x1="52" y1="23" x2="52" y2="27"/><line x1="52" y1="45" x2="52" y2="49"/>
  <line x1="39" y1="36" x2="43" y2="36"/><line x1="61" y1="36" x2="65" y2="36"/>
  <line x1="43.5" y1="27.5" x2="46.5" y2="30.5"/><line x1="57.5" y1="41.5" x2="60.5" y2="44.5"/>
  <line x1="60.5" y1="27.5" x2="57.5" y2="30.5"/><line x1="46.5" y1="41.5" x2="43.5" y2="44.5"/>
 </g>
 <g style="direction:ltr" text-anchor="start" font-family="Tajawal,Segoe UI,Arial">
  <text x="80" y="45" font-size="40" font-weight="800" fill="#0066A7">i<tspan fill="#0B2239">COOL</tspan></text>
  <text x="82" y="63" font-size="11.5" font-weight="700" fill="#F1471E" letter-spacing="2.6">COOL YOUR LIFE</text>
  <text x="82" y="79" font-size="10" font-weight="500" fill="#5b6b7a" letter-spacing="0.6">TRADING &amp; CONTRACTING</text>
 </g></svg>`;
let LOGO_IMG=null;                                  // شعار رسمي يرفعه المستخدم
let SIGN_IMG=null;                                  // توقيع/ختم
function logoHTML(h){
  if(LOGO_IMG) return `<img src="${LOGO_IMG}" style="height:${h||32}px;width:auto" alt="iCOOL">`;
  return LOGO.replace('class="logo"',`class="logo" style="height:${h||32}px"`);
}

/* ---------- 2. مكتبة المقاطع ---------- */
const SEC={
 '40x40x2'  :{w:2.31,A:2.94,b:.04,h:.04},'50x50x2.5':{w:3.56,A:4.55,b:.05,h:.05},
 '60x40x2.5':{w:3.56,A:4.55,b:.04,h:.06},'60x60x3'  :{w:5.19,A:6.63,b:.06,h:.06},
 '80x40x3'  :{w:5.19,A:6.63,b:.04,h:.08},'80x80x3'  :{w:7.07,A:9.03,b:.08,h:.08},
 '80x80x4'  :{w:9.22,A:11.7,b:.08,h:.08},'100x50x3' :{w:6.51,A:8.29,b:.05,h:.10},
 '100x50x4' :{w:8.49,A:10.8,b:.05,h:.10},'100x100x4':{w:11.7,A:14.9,b:.10,h:.10},
 '120x60x4' :{w:10.6,A:13.4,b:.06,h:.12},'120x120x4':{w:14.2,A:18.1,b:.12,h:.12},
 '150x50x4' :{w:11.7,A:14.9,b:.05,h:.15},'150x150x5':{w:22.0,A:28.0,b:.15,h:.15},
 'IPE160'   :{w:15.8,A:20.1,b:.082,h:.16},'IPE200'  :{w:22.4,A:28.5,b:.10,h:.20},
 'IPE240'   :{w:30.7,A:39.1,b:.12,h:.24}};
/* عطالة المقطع حول المحور القوي (سم⁴). المقاطع المجوّفة تُحسب من الاسم
   بمعامل 0.95 تعويضاً عن تدوير الزوايا؛ مقاطع IPE من الجداول. */
const IPE_I={IPE160:869,IPE200:1943,IPE240:3892};
function secI(nm){
  if(IPE_I[nm])return IPE_I[nm];
  const m=/^(\d+)x(\d+)x([\d.]+)$/.exec(nm||'');
  if(!m){const s=SEC[nm];return s?s.A*Math.pow(s.h*100,2)/12:1;}
  const h=+m[1],b=+m[2],t=+m[3];
  const I=(b*Math.pow(h,3)-(b-2*t)*Math.pow(h-2*t,3))/12;
  return Math.max(1,I/1e4*0.95);}
const PANEL={w:2.382,h:1.134,t:.030,kg:32.3,Wp:660,nm:'Bluesun 2382×1134 / 660Wp'};

/* ---------- 3. حالة المشروع ---------- */
const M={cat:'solar',tpl:'S1',project:'مشروع جديد',client:'',site:'',muni:'',parcel:'',permit:'',
 terrain:'II',phi:0,cont:7,marg:12,vat:0,pAnch:4,pvPrice:0,knee:.60,win:1,
 bOn:1,bShape:'rect',bA:8.07,bB:9.83,ba:3.10,bb:1.36,bCorner:'NW',bF:2,bFH:3.0,bPar:.80,bParT:.20,
 bRot:0,bOX:.6,bOZ:.6, nPost:2,pInset:.15,fix2:'same',
 L:12,S:6,h1:2.2,h2:3.4,bay:2.5,td:.5,over:.5,
 secT:'100x50x3',secB:'50x50x2.5',secW:'50x50x2.5',secP:'100x100x4',secR:'50x50x2.5',
 diag:1,orient:'auto',fix:'base',wind:100,snow:0,price:1.35,fab:.85,coat:'paint',
 slatGap:.12,clearH:5,ridge:1.9,sys:'auto',
 lat:33.8938,lon:35.5018,tz:2,north:0,srH:2.60,sMon:12,sDay:21,sHour:12,sunOn:1,shadow:1,az:180,
 animSec:10,sysType:'hybrid',ghiY:1900,albedo:.20,noct:45,pTcP:-0.34,shFac:2,
 lSoil:3,lMis:2,lWire:2,lInv:3,lAvail:1,
 pWp:660,pVoc:45.9,pVmp:38.4,pIsc:18.3,pImp:17.2,pTcV:-0.25,
 tMin:0,tCellMax:70,invVmax:1000,invVmin:200,invIsc:30,invMppt:2,invKW:10,
 loadD:30,loadNight:45,loadPk:6,
 batChem:'lifepo4',batV:48,batVm:51.2,batAh:200,batDays:1,batDoD:90,invModel:'deye12',
 trayType:'tray',trayY:2.05,trayOpen:1,showCab:1,roomBg:1,showLbl:1,showDim3:1};
let SITE=null,TRACE_POLY=null,LEGS=[],VAL={ok:true,msgs:[]};
let KML_POLY=null,KMLP=[],OBS=[],OBSW=[],GEO=null,SUN={alt:0,az:180,up:false},SUNT=null,SHW=null;
let ARR=[],AI=0,ARES=[],NOGRND=false;
function inPoly(x,z,p){let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];
    if(((a[1]>z)!==(b[1]>z))&&(x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function xfPoly(p,t,mx,mz){
  return p.map(q=>{const x=t?q[0]*Math.cos(t)-q[1]*Math.sin(t):q[0],
                   z=t?q[0]*Math.sin(t)+q[1]*Math.cos(t):q[1];
                   return [x-mx,z-mz];});}
function unXf(q){
  if(!SITE)return[q[0],q[1]];
  const t=-(SITE.t||0),x=q[0]+(SITE.mx||0),z=q[1]+(SITE.mz||0);
  return t?[x*Math.cos(t)-z*Math.sin(t),x*Math.sin(t)+z*Math.cos(t)]:[x,z];}
function makeSite(){
  if(!M.bOn){SITE=null;OBSW=[];return;}
  let p;
  if(M.bShape==='kml'&&KML_POLY)p=KML_POLY.map(q=>[q[0],q[1]]);
  else if(M.bShape==='trace'&&TRACE_POLY)p=TRACE_POLY.map(q=>[q[0],q[1]]);
  else if(M.bShape==='L'){
    const A=M.bA,B=M.bB,a=Math.min(M.ba,A-.3),b=Math.min(M.bb,B-.3);
    p=[[0,0],[A,0],[A,B],[a,B],[a,B-b],[0,B-b]];
    if(M.bCorner==='NE')p=p.map(q=>[A-q[0],q[1]]);
    if(M.bCorner==='SW')p=p.map(q=>[q[0],B-q[1]]);
    if(M.bCorner==='SE')p=p.map(q=>[A-q[0],B-q[1]]);
  }else p=[[0,0],[M.bA,0],[M.bA,M.bB],[0,M.bB]];
  const r=(M.bRot|0)%360;
  let t=0,mx=0,mz=0;
  if(r){t=r*Math.PI/180;
    const q=p.map(a=>[a[0]*Math.cos(t)-a[1]*Math.sin(t),a[0]*Math.sin(t)+a[1]*Math.cos(t)]);
    mx=Math.min(...q.map(a=>a[0]));mz=Math.min(...q.map(a=>a[1]));
    p=q.map(a=>[a[0]-mx,a[1]-mz]);}
  let A2=0;for(let i=0;i<p.length;i++){const u=p[i],v=p[(i+1)%p.length];A2+=u[0]*v[1]-v[0]*u[1];}
  const xs=p.map(q=>q[0]),zs=p.map(q=>q[1]);
  SITE={poly:p,area:Math.abs(A2/2),bb:[Math.max(...xs),Math.max(...zs)],H:M.bF*M.bFH,t,mx,mz};
  OBSW=OBS.map(o=>({h:+o.h||0,base:+o.base||0,kind:o.kind,name:o.name,poly:xfPoly(o.poly,t,mx,mz)}));}
function distPoly(x,z,P){let d=1e9;
  for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];
    const vx=b[0]-a[0],vz=b[1]-a[1],l2=vx*vx+vz*vz||1;
    let t=((x-a[0])*vx+(z-a[1])*vz)/l2;t=Math.max(0,Math.min(1,t));
    d=Math.min(d,Math.hypot(x-(a[0]+t*vx),z-(a[1]+t*vz)));}
  return d;}
function legState(x,z,fx){
  if(!SITE)return{s:'ok',t:'—'};
  const P=SITE.poly,X=x,Z=z,ins=inPoly(X,Z,P),d=distPoly(X,Z,P);
  const fac=(fx==='beam'||fx==='through');
  if(fac){
    if(!ins&&d<=.60)return{s:'ok',t:'على الواجهة (خارج '+(d*100).toFixed(0)+' سم)'};
    if(ins&&d<=.40)return{s:'ok',t:'ملاصقة للكمرة (داخل '+(d*100).toFixed(0)+' سم)'};
    if(ins)return{s:'warn',t:'داخل السطح '+(d*100).toFixed(0)+' سم — لا تصل إلى الكمرة'};
    return{s:'bad',t:'بعيدة '+(d*100).toFixed(0)+' سم عن الواجهة'};}
  if(!ins)return{s:'bad',t:'خارج السطح '+(d*100).toFixed(0)+' سم'};
  if(d<.12)return{s:'warn',t:'على الحافة تماماً ('+(d*100).toFixed(0)+' سم) — مسافة حافة غير كافية للمسمار'};
  return{s:'ok',t:'داخل السطح ('+(d*100).toFixed(0)+' سم عن الحافة)'};}
function validate(){
  VAL={ok:true,msgs:[]};
  if(!SITE)return;
  let bad=0,warn=0;
  LEGS.forEach(([x,z,fx])=>{const st=legState(x,z,fx);
    if(st.s==='bad')bad++; else if(st.s==='warn')warn++;});
  if(bad){VAL.ok=false;VAL.msgs.push(bad+' رجل في موضع غير صالح — راجع جدول الأرجل.');}
  if(warn)VAL.msgs.push(warn+' رجل بحاجة إلى مراجعة موضعها.');
  const cov=(M.L*M.S)/Math.max(SITE.area,1)*100;

  const d=new THREE.Vector3().subVectors(p2,p1),l=d.length(); if(l<1e-6)return null;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),mat);
  m.position.copy(p1).add(p2).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0,0,1),d.normalize()); return m;}
let QTY={},KIND={},PC={},NP=0,PLATES=0,ANCH=0,PVINFO={};
const BASE={secT:'100x50x3',secB:'50x50x2.5',secW:'50x50x2.5',secP:'100x100x4',secR:'50x50x2.5',diag:1,orient:'auto',fix:'base',coat:'paint'};
function addM(kind,sec,p1,p2,mat,mark){
  const s=SEC[sec]; if(!s)return;
  const len=p1.distanceTo(p2);
  QTY[sec]=(QTY[sec]||0)+len;
  (KIND[kind]=KIND[kind]||{})[sec]=((KIND[kind]||{})[sec]||0)+len;
  if(mark){const k=mark+'|'+sec+'|'+len.toFixed(2);
    PC[k]=PC[k]||{mark,sec,len:+len.toFixed(2),q:0,kind}; PC[k].q++;}
  const m=tube(p1,p2,s.b,s.h,mat||MAT.top); if(m)gS.add(m);}
function lbl(t,pos,c,sc){
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;const x=cv.getContext('2d');
  x.fillStyle='rgba(255,255,255,0.93)';x.fillRect(0,0,512,128);
  x.strokeStyle=c||'#0066A7';x.lineWidth=8;x.strokeRect(4,4,504,120);
  x.fillStyle=c||'#0066A7';x.font='bold 58px Tajawal, Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(t,256,68);
  const tex0=new THREE.CanvasTexture(cv); if(THREE.sRGBEncoding)tex0.encoding=THREE.sRGBEncoding;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex0,transparent:true,depthTest:false}));
  s.position.copy(pos);s.scale.set(1.7*(sc||1),.42*(sc||1),1);s.renderOrder=999;return s;}
const dLine=(a,b)=>new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),MAT.dim);

/* بيت ثلاثي الأبعاد تحت الهيكل */
function house(x0,x1,z0,z1,h){
  if(!(h>0))return;
  const w=x1-x0,d=z1-z0;
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),MAT.mass);
  m.position.set((x0+x1)/2,-.30-h/2,(z0+z1)/2);gB.add(m);
  const nF=Math.max(1,Math.round(h/3));
  for(let i=1;i<nF;i++){const y=-.30-h*i/nF;
    [z0-.02,z1+.02].forEach(z=>gB.add(tube(V(x0,y,z),V(x1,y,z),.04,.14,MAT.ground)));
    [x0-.02,x1+.02].forEach(x=>gB.add(tube(V(x,y,z0),V(x,y,z1),.14,.04,MAT.ground)));}
  if(M.win){
    const cols=Math.max(1,Math.floor(w/2.6));
    for(let fl=0;fl<nF;fl++)for(let c=0;c<cols;c++){
      const wx=x0+(c+.5)*w/cols,wy=-.30-h*(fl+.55)/nF;
      const a=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.06),MAT.win);a.position.set(wx,wy,z1+.03);gB.add(a);
      const b=new THREE.Mesh(new THREE.BoxGeometry(1.1,1.2,.06),MAT.win);b.position.set(wx,wy,z0-.03);gB.add(b);}
    const rows=Math.max(1,Math.floor(d/2.6));
    for(let fl=0;fl<nF;fl++)for(let c=0;c<rows;c++){
      const wz=z0+(c+.5)*d/rows,wy=-.30-h*(fl+.55)/nF;
      const a=new THREE.Mesh(new THREE.BoxGeometry(.06,1.2,1.1),MAT.win);a.position.set(x1+.03,wy,wz);gB.add(a);
      const b=new THREE.Mesh(new THREE.BoxGeometry(.06,1.2,1.1),MAT.win);b.position.set(x0-.03,wy,wz);gB.add(b);}}
  gB.add(lbl('المبنى '+h.toFixed(1)+' م',V((x0+x1)/2,-.30-h*.5,z1+.6),'#5b6b7a',1.4));}

/* كتفا تقوية 50×50 عند الزاوية العلوية — أحدهما باتجاه الجمالون والآخر باتجاه المداد */
function knees(x,z,yTop,dx,dz){
  const k=M.knee; if(!(k>0))return;
  if(dx)addM('كتف تقوية',M.secW,V(x,yTop-k,z),V(x+dx*k,yTop-.04,z),MAT.brace,'K2');
  if(dz)addM('كتف تقوية',M.secW,V(x,yTop-k,z),V(x,yTop-.04,z+dz*k),MAT.brace,'K2');}

let SYSNOW='truss';
function truss(p1,p2,td,nB,diag){
  if(SYSNOW==='beam'){addM('جوائز رئيسية',M.secT,p1,p2,MAT.top,'B1');return;}
  const q1=V(p1.x,p1.y-td,p1.z),q2=V(p2.x,p2.y-td,p2.z);
  addM('جوائز علوية',M.secT,p1,p2,MAT.top,'C1');
  addM('جوائز سفلية',M.secB,q1,q2,MAT.bot,'C2');
  for(let i=0;i<=nB;i++){const u=i/nB;
    addM('تضليع',M.secW,p1.clone().lerp(p2,u),q1.clone().lerp(q2,u),MAT.web,'W1');}
  if(diag)for(let i=0;i<nB;i++){const u1=i/nB,u2=(i+1)/nB;
    const a=(i%2===0)?q1.clone().lerp(q2,u1):p1.clone().lerp(p2,u1);
    const b=(i%2===0)?p1.clone().lerp(p2,u2):q1.clone().lerp(q2,u2);
    addM('أقطار',M.secW,a,b,MAT.brace,'D1');}}

/* ---------- الغطاء : تصحيح اتجاه الميل ----------
   دوران الصندوق حول X بزاوية θ ينقل محوره +Z إلى (0,−sinθ,cosθ).
   لذلك: مستوى صاعد مع +Z ⇒ θ = −t ، ومستوى هابط ⇒ θ = +t.
   pt.dir = +1 للمستوى الصاعد و −1 للهابط ، والدوران = −dir·t      */
function cover(type,x0,x1,s0,slopeLen,pt){
  const t=pt.t,W=x1-x0,rot=-pt.dir*t;
  if(type==='pv'){
    const g=.02,gr=.05,o=[];
    o.push({o:'port',c:Math.floor((W+g)/(PANEL.h+g)),r:Math.floor((slopeLen+gr)/(PANEL.w+gr)),w:PANEL.h,h:PANEL.w});
    o.push({o:'land',c:Math.floor((W+g)/(PANEL.w+g)),r:Math.floor((slopeLen+gr)/(PANEL.h+gr)),w:PANEL.w,h:PANEL.h});
    o.forEach(p=>{p.c=Math.max(0,p.c);p.r=Math.max(0,p.r);p.n=p.c*p.r;});
    const pick=M.orient==='auto'?(o[0].n>=o[1].n?o[0]:o[1]):(M.orient==='port'?o[0]:o[1]);
    NP+=pick.n; PVINFO={o:pick.o,c:pick.c,r:pick.r,w:pick.w,h:pick.h};
    if(pick.n===0)return;
    const rowW=pick.c*pick.w+(pick.c-1)*g,px0=x0+(W-rowW)/2+pick.w/2;
    const arr=pick.r*pick.h+(pick.r-1)*gr,sS=s0+Math.max(0,(slopeLen-arr)/2);
    const off=pick.h<1.5?.28:.55;
    for(let r=0;r<pick.r;r++){
      const sr=sS+r*(pick.h+gr);
      [off,pick.h-off].forEach(oo=>{const p=pt.at(sr+oo);
        addM('مرابط الألواح',M.secR,V(x0,p.y+.03,p.z),V(x1,p.y+.03,p.z),MAT.rail,'R1');});
      const c=pt.at(sr+pick.h/2);
      for(let i=0;i<pick.c;i++){
        const m=new THREE.Mesh(new THREE.BoxGeometry(pick.w,PANEL.t,pick.h),MAT.pv);
        m.position.set(px0+i*(pick.w+g),c.y+.085,c.z); m.rotation.x=rot; gC.add(m);
        const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),MAT.edge);
        e.position.copy(m.position); e.rotation.x=rot; gC.add(e);}}
  }else if(type==='slat'){
    const n=Math.max(2,Math.floor(slopeLen/(M.slatGap+SEC[M.secR].b)));
    for(let i=0;i<=n;i++){const p=pt.at(s0+slopeLen*i/n);
      addM('تضليع الغطاء',M.secR,V(x0,p.y+.05,p.z),V(x1,p.y+.05,p.z),MAT.slat,'S1');}
  }else{
    const a=pt.at(s0),b=pt.at(s0+slopeLen);
    const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,slopeLen),MAT.sheet);
    m.position.set((x0+x1)/2,(a.y+b.y)/2+.06,(a.z+b.z)/2);
    m.rotation.x=-Math.PI/2+rot; gC.add(m);
    const nP=Math.max(2,Math.round(slopeLen/1.5));
    for(let i=0;i<=nP;i++){const p=pt.at(s0+slopeLen*i/nP);
      addM('مدادات السقف',M.secR,V(x0,p.y+.05,p.z),V(x1,p.y+.05,p.z),MAT.rail,'R1');}}}

/* ---------- 5. البناة ---------- */
function builderA(T){
  const t=T.flat?0:Math.atan((M.h2-M.h1)/M.S),S=M.S,L=M.L;
  const nBay=Math.max(1,Math.round(L/M.bay)),bx=[];
  for(let i=0;i<=nBay;i++)bx.push(L*i/nBay);
  const nB=Math.max(4,Math.round(S/.9)),yA=M.h1,yB=T.flat?M.h1:M.h2;
  bx.forEach(x=>{
    if(T.dbl){truss(V(x,yB,0),V(x,yA,S/2),M.td,Math.round(nB/2),M.diag);
              truss(V(x,yA,S/2),V(x,yB,S),M.td,Math.round(nB/2),M.diag);}
    else truss(V(x,yB,0),V(x,yA,S),M.td,nB,M.diag);});
  const rows=T.dbl?[S/2]:(T.cant?[S*.28]:[0,S]);
  bx.forEach(x=>rows.forEach(z=>{
    const y=T.flat?M.h1:(M.h2+(M.h1-M.h2)*(z/S));
    addM('أعمدة',M.secP,V(x,0,z),V(x,y-M.td-.02,z),MAT.post,'P1');
    PLATES++;ANCH+=4;
    LEGS.push([x,z,M.fix]);knees(x,z,y-M.td-.02,(x<L/2?1:-1),(z<S/2?1:-1));
    if(T.cant||T.dbl){[1,-1].forEach(k=>
      addM('كتائف',M.secW,V(x,y-M.td-.85,z),V(x,y-M.td-.05,z+k*.85),MAT.brace,'K1'));}}));
  rows.forEach(z=>[[bx[0],bx[1]],[bx[nBay-1],bx[nBay]]].forEach(([a,b])=>{
    const y=T.flat?M.h1:(M.h2+(M.h1-M.h2)*(z/S));
    addM('تربيط',M.secW,V(a,.2,z),V(b,y-M.td-.15,z),MAT.brace,'B1');
    addM('تربيط',M.secW,V(b,.2,z),V(a,y-M.td-.15,z),MAT.brace,'B1');}));
  if(!SITE&&!NOGRND){const gr=new THREE.Mesh(new THREE.BoxGeometry(L+4,.2,S+4),MAT.ground);
    gr.position.set(L/2,-.1,S/2); gB.add(gr);}
  if(T.cant&&(M.fix==='through'||M.fix==='wall')){
    const wh=yB+.5,w=new THREE.Mesh(new THREE.BoxGeometry(L+1,wh,.25),MAT.wall);
    w.position.set(L/2,wh/2,-.15);gB.add(w);
    bx.forEach(x=>[.35,.75].forEach(u=>
      addM('كتائف ثروبولت',M.secW,V(x,yB-M.td*u,.02),V(x,yB-M.td*u,-.28),MAT.brace,'T1')));}
  if(T.dbl){
    cover(T.cover,0,L,0,(S/2)/Math.cos(t),{t,dir:-1,at:s=>({z:s*Math.cos(t),y:yB-s*Math.sin(t)})});
    cover(T.cover,0,L,0,(S/2)/Math.cos(t),{t,dir:+1,at:s=>({z:S-s*Math.cos(t),y:yB-s*Math.sin(t)})});
  }else cover(T.cover,0,L,0,S/Math.cos(t),{t,dir:-1,at:s=>({z:s*Math.cos(t),y:yB-s*Math.sin(t)})});
  return {t,nSup:bx.length*rows.length,frames:bx.length,bays:nBay,bx,rows,
    primary:'إطار عرضي بحر '+S.toFixed(2)+' م',spanMain:S,trib:L/nBay,nWeb:nB};}

function builderB(T){
  const t=Math.atan((M.h2-M.h1)/M.S),L=M.L,S=M.S;
  const yF=M.h1-.14,yR=yF+S*Math.tan(t),nB=Math.max(6,Math.round(L/.85));
  truss(V(0,yF,0),V(L,yF,0),M.td,nB,M.diag);
  truss(V(0,yR,S),V(L,yR,S),M.td,nB,M.diag);
  const nP=Math.max(2,Math.round(M.nPost)),ins=Math.min(M.pInset,L/4),px=[];
  for(let i=0;i<nP;i++)px.push(ins+(L-2*ins)*i/(nP-1));
  px.forEach(x=>[[0,yF],[S,yR]].forEach(([z,y])=>{
    const fx=(z<S/2)?M.fix:(M.fix2==='same'?M.fix:M.fix2);
    const base=(fx==='beam'||fx==='through')?-.5:0;
    addM('أعمدة',M.secP,V(x,base,z),V(x,y+.06,z),MAT.post,base<0?'P2':'P1');
    LEGS.push([x,z,fx]);PLATES++;ANCH+=(fx==='beam'?8:4);
    if(fx==='beam'){            // بليتتان 200×200×10 على الكمرة الباطونية
      [-.15,-.45].forEach(h=>{
        const pl=new THREE.Mesh(new THREE.BoxGeometry(.20,.20,.01),MAT.brace);
        pl.position.set(x,h,z+(z<S/2?-.14:.14));gS.add(pl);
        addM('وصلة الكمرة',M.secW,V(x,h,z),V(x,h,z+(z<S/2?-.16:.16)),MAT.brace,'T2');});
    } else if(fx==='through'){[-.15,-.42].forEach(h=>addM('ثروبولت/كتائف',M.secW,V(x,h,z),V(x+(x<L/2?.35:-.35),h,z),MAT.brace,'T1'));}
    else if(fx==='parapet'){[.3,.62].forEach(h=>addM('كتائف العمامة',M.secW,V(x,h,z),V(x,h,z+(z<S/2?-.3:.3)),MAT.brace,'T1'));}
    else if(fx==='base'){const bp=new THREE.Mesh(new THREE.BoxGeometry(.3,.02,.3),MAT.post);bp.position.set(x,.01,z);gS.add(bp);}
    // كتفا التقوية عند الزاوية العلوية
    knees(x,z,y,(x<L/2?1:-1),(z<S/2?1:-1));}));
  const nR=Math.max(3,Math.round(L/1.7));
  for(let i=0;i<=nR;i++){const x=L*i/nR;
    addM('عوارض مائلة',M.secT,V(x,yF+.1,0),V(x,yR+.1,S),MAT.top,'RF');}
  if(!SITE){
    const roof=(T.fac||M.fix==='parapet'||M.fix==='beam'||M.fix==='through');
    if(roof){
      const x0=-1.2,x1=L+1.2,z0=-1.5,z1=S+1.2;
      const sl=new THREE.Mesh(new THREE.BoxGeometry(x1-x0,.3,z1-z0),MAT.ground);
      sl.position.set((x0+x1)/2,-.15,(z0+z1)/2);gB.add(sl);
      [[x0,z0,x1,z0],[x0,z1,x1,z1],[x0,z0,x0,z1],[x1,z0,x1,z1]].forEach(([a,b,c,d])=>
        gB.add(tube(V(a,.4,b),V(c,.4,d),(a===c?.2:Math.abs(c-a)),.8,MAT.wall)));
      house(x0,x1,z0,z1,M.bldH);
      gB.add(lbl('كمرة باطون مسلح',V(L/2,.95,z0-.15),'#F1471E',1.5));
    }else if(!NOGRND){const gr=new THREE.Mesh(new THREE.BoxGeometry(L+2,.2,S+2),MAT.ground);gr.position.set(L/2,-.1,S/2);gB.add(gr);}}

  cover(T.cover,0,L,0,S/Math.cos(t),{t,dir:+1,at:s=>({z:s*Math.cos(t),y:(yF+.15)+s*Math.sin(t)})});
  return {t,nSup:px.length*2,frames:2,bays:px.length-1,bx:px,rows:[0,S],
    primary:'جمالون طولي بحر '+(px[1]-px[0]).toFixed(2)+' م بين الأرجل',spanMain:(px[1]-px[0]),trib:S/2,nWeb:nB};}

function builderC(T){
  const t=Math.atan((M.h2-M.h1)/M.S),L=M.L,S=M.S;
  const nBay=Math.max(1,Math.round(L/M.bay)),bx=[];
  for(let i=0;i<=nBay;i++)bx.push(L*i/nBay);
  const nB=Math.max(4,Math.round(S/.85));
  bx.forEach(x=>truss(V(x,M.h2,0),V(x,M.h1,S),M.td,nB,M.diag));
  if(T.hang){
    const hy=Math.min(M.h1,M.h2)-M.td-.15;
    const sh=new THREE.Mesh(new THREE.PlaneGeometry(L+1.5,S+1.5),MAT.sheet);
    sh.position.set(L/2,hy-.05,S/2);sh.rotation.x=-Math.PI/2;gB.add(sh);
    bx.forEach(x=>[0,S].forEach(z=>addM('كلامب/بليتة',M.secW,
      V(x,M.h2-(z/S)*(M.h2-M.h1)-M.td-.02,z),V(x,hy,z),MAT.brace,'CL')));
    gB.add(lbl('سطح الهنغار القائم',V(L*.5,hy-.5,S+.9),'#5b6b7a',1.4));
    ANCH+=bx.length*4;
  }else{
    [0,S].forEach((z,k)=>{const y=k?M.h1:M.h2;
      const w=new THREE.Mesh(new THREE.BoxGeometry(L+1.2,y-M.td,.25),MAT.wall);
      w.position.set(L/2,(y-M.td)/2,z);gB.add(w);});
    gB.add(lbl('ارتكاز على الحائط ببليتة',V(L*.5,M.h2-M.td-.4,-.7),'#F1471E',1.5));
    PLATES+=bx.length*2;ANCH+=bx.length*8;}
  cover(T.cover,0,L,0,S/Math.cos(t),{t,dir:-1,at:s=>({z:s*Math.cos(t),y:M.h2-s*Math.sin(t)})});
  return {t,nSup:bx.length*2,frames:bx.length,bays:nBay,bx,rows:[0,S],
    primary:'جمالون عرضي حر بحر '+S.toFixed(2)+' م',spanMain:S,trib:L/nBay,nWeb:nB};}

function builderH(T){
  const L=M.L,S=M.S,H=M.clearH,Rg=M.ridge,t=Math.atan(Rg/(S/2));
  const nBay=Math.max(1,Math.round(L/M.bay)),bx=[];
  for(let i=0;i<=nBay;i++)bx.push(L*i/nBay);
  const nB=Math.max(4,Math.round((S/2)/1));
  bx.forEach(x=>{
    addM('جوائز علوية',M.secT,V(x,H+Rg,S/2),V(x,H,0),MAT.top,'C1');
    addM('جوائز علوية',M.secT,V(x,H+Rg,S/2),V(x,H,S),MAT.top,'C1');
    addM('جوائز سفلية',M.secB,V(x,H-M.td,0),V(x,H-M.td,S),MAT.bot,'C2');
    for(let i=0;i<=nB;i++){const u=i/nB;
      [[0,S/2],[S,S/2]].forEach(([a,b])=>{const z=a+(b-a)*u;
        addM('تضليع',M.secW,V(x,H+Rg*u,z),V(x,H-M.td,z),MAT.web,'W1');});}
    if(M.diag)for(let i=0;i<nB;i++){const u1=i/nB,u2=(i+1)/nB;
      [[0,S/2],[S,S/2]].forEach(([a,b])=>{
        addM('أقطار',M.secW,V(x,H-M.td,a+(b-a)*u1),V(x,H+Rg*u2,a+(b-a)*u2),MAT.brace,'D1');});}
    [0,S].forEach(z=>{addM('أعمدة',M.secP,V(x,0,z),V(x,H,z),MAT.post,'P1');PLATES++;ANCH+=4;
      LEGS.push([x,z,M.fix]);knees(x,z,H-.02,(x<L/2?1:-1),(z<S/2?1:-1));});});
  [0,S].forEach(z=>[[bx[0],bx[1]],[bx[nBay-1],bx[nBay]]].forEach(([a,b])=>{
    addM('تربيط',M.secW,V(a,.3,z),V(b,H-.3,z),MAT.brace,'B1');
    addM('تربيط',M.secW,V(b,.3,z),V(a,H-.3,z),MAT.brace,'B1');}));
  if(!SITE&&!NOGRND){const gr=new THREE.Mesh(new THREE.BoxGeometry(L+5,.2,S+5),MAT.ground);gr.position.set(L/2,-.1,S/2);gB.add(gr);}
  const sl=(S/2)/Math.cos(t);
  cover('sheet',0,L,0,sl,{t,dir:+1,at:s=>({z:s*Math.cos(t),y:H+s*Math.sin(t)})});
  cover('sheet',0,L,0,sl,{t,dir:-1,at:s=>({z:S-s*Math.cos(t),y:H+s*Math.sin(t)})});
  return {t,nSup:bx.length*2,frames:bx.length,bays:nBay,bx,rows:[0,S],
    primary:'إطار جملوني بحر '+S.toFixed(2)+' م',spanMain:S,trib:L/nBay,nWeb:nB};}

/* ---------- 6. الحسابات ---------- */
/* محرّك الرياح — سلسلة EN 1991-1-4 مبسّطة */
function windCalc(zRef,tdeg,T){
  const TZ={I:[.01,1],II:[.05,2],III:[.3,5],IV:[1,10]}[M.terrain]||[.05,2];
  const z0=TZ[0],zmin=TZ[1],z=Math.max(zRef,zmin);
  const kr=.19*Math.pow(z0/.05,.07), vb=M.wind/3.6;
  const cr=kr*Math.log(z/z0), co=1, vm=cr*co*vb;
  const Iv=1/(co*Math.log(z/z0)), rho=1.25;
  const qb=.5*rho*vb*vb/1000;
  const qp=(1+7*Iv)*.5*rho*vm*vm/1000;
  const ce=qp/qb;
  const ts=[0,5,10,15,20,25,30];
  const CF=[.2,.4,.5,.7,.8,1,1.2];
  const CPx=[.5,.8,1.2,1.4,1.7,2,2.2];
  const CN0=[-.6,-1.1,-1.5,-1.9,-2.2,-2.6,-3];
  const CN1=[-1.3,-1.4,-1.5,-1.9,-2.2,-2.6,-3];
  const ip=a=>{const x=Math.min(30,Math.max(0,Math.abs(tdeg)));
    let i=0;while(i<ts.length-2&&x>ts[i+1])i++;
    return a[i]+(a[i+1]-a[i])*(x-ts[i])/(ts[i+1]-ts[i]);};
  let cf=ip(CF),cpMax=ip(CPx),cpMin=ip(M.phi?CN1:CN0),src='EN 1991-1-4 جدول 7.6 — مظلة أحادية الميل';
  if(T.bld==='H'){cpMax=.2;cpMin=-1.5;cf=.8;src='EN 1991-1-4 §7.2.5 سقف جملوني مغلق + ضغط داخلي c_pi=±0.3';}
  if(T.cover==='slat'){cpMax*=.45;cpMin*=.45;cf*=.45;src='سقف مضلّع مفتوح — الضغوط مخفّضة بنسبة النفاذية';}
  /* التمييز الجوهري:
     cf  = معامل القوة الكلية → يُستعمل لتصميم الإطار والجوائز والأعمدة (حمل عام)
     cp,net = معاملات الضغط الصافي المناطقية → تُستعمل للعناصر الموضعية والمرابط والمسامير */
  return {z0,zmin,z,kr,vb,cr,vm,Iv,qb,qp,ce,cf,cpMax,cpMin,src,
          wGl:qp*cf, wLocUp:qp*Math.abs(cpMin), wLocDn:qp*cpMax,
          wUp:qp*cf, wDn:qp*cpMax, Fh:qp*cf};}
let R={};
function compute(g,qty,np,plates){
  const T=TPL[M.tpl];
  qty=qty||QTY; np=(np===undefined)?NP:np; plates=(plates===undefined)?PLATES:plates;
  const steel=Object.keys(qty).reduce((a,k)=>a+qty[k]*SEC[k].w,0);
  const plateKg=plates*7.1,tot=steel+plateKg;
  const area=M.L*M.S/Math.cos(g.t);
  const tdeg=g.t*180/Math.PI;
  const zRef=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2);
  const WD=windCalc(zRef,tdeg,T);
  const q=WD.qp,Cf=WD.cf,wWind=WD.wGl;
  const gk=(T.cover==='pv'?.12:(T.cover==='sheet'?.15:.08))+tot*.00981/Math.max(area,1);
  const sk=M.snow*.00981;
  const C1=1.35*gk+1.5*sk;                 // شاقولي نحو الأسفل
  const C2=Math.abs(1.5*WD.wGl-1.0*gk);    // رفع صافٍ عام (معامل القوة الكلية)
  const C3=1.35*gk+1.5*WD.wGl*.6;          // ضغط نحو الأسفل + ميت
  const wU=Math.max(C1,C2,C3);
  const Ls=g.spanMain,trib=g.trib,w=wU*trib;
  const Mmax=T.cant?w*Ls*Ls/2:w*Ls*Ls/8;
  const beam=(SYSNOW==='beam');
  const d=beam?SEC[M.secT].h:((T.bld==='H')?M.td+M.ridge*.5:M.td);
  const N=Mmax/Math.max(d,.05);
  const At=SEC[M.secT].A,Ab=SEC[M.secB].A;
  let sig,Ieff,Wsec=0;
  if(beam){
    Ieff=secI(M.secT);
    Wsec=Ieff/Math.max(SEC[M.secT].h*100/2,.5);
    sig=Mmax*1e3/Math.max(Wsec,.01);
  }else{
    sig=N/(Math.min(At,Ab)/1e4)/1e3;
    Ieff=At*Math.pow(d*100*.42,2)+Ab*Math.pow(d*100*.58,2);}
  const util=sig/157;
  let def=5*w*Math.pow(Ls*1e3,4)/(384*21e4*Ieff*1e4);
  if(T.cant)def=w*Math.pow(Ls*1e3,4)/(8*21e4*Ieff*1e4);
  if(!beam&&!M.diag)def*=3.5;
  const defR=Ls*1e3/Math.max(def,.01);
  const Rv=wU*area/Math.max(g.nSup,1),Hf=wWind*area*Math.sin(g.t)/Math.max(g.nSup,1);
  const hTop=(T.bld==='H')?M.clearH:Math.max(M.h1,M.h2);
  const ANCHOR={M14:{n:'M14 غوص 120 مم',NRd:16,VRd:20},M16:{n:'M16 غوص 130 مم',NRd:22,VRd:27}};
  const FIX={base:[.30,'قاعدة 300×300×10 مم + 4 مسامير كيميائية M14 غوص 120 مم','M14',4],
   beam:[.30,'بليتتان 200×200×10 مم على الوجه الخارجي للكمرة الباطونية، المسافة بين محوريهما 300 مم، كل بليتة 4 × Anchor M16 غوص 130 مم','M16',8],
   through:[.50,'امتداد 50 سم تحت السقف + ثروبولت 2×M16 لكل صف مع بليتة داخلية 200×200×10','M16',4],
   parapet:[1.00,'كتيفتان على العمامة بمسافة 1.00 م + مسامير كيميائية M14','M14',4],
   wall:[.40,'بليتة ارتكاز 250×250×10 + 4 مسامير كيميائية M14','M14',4],
   hangar:[.35,'كلامب مجلفن على جائز الهنغار + براغي M12 مع حشوة EPDM','M14',4],
   ballast:[1.20,'كتلة باطونية موزونة — تزيد 1.5× عن قوة الرفع','M14',4]};
  const f2=(M.fix2==='same')?M.fix:M.fix2;
  const G1=FIX[M.fix],G2=FIX[f2]||G1;
  const lever=Math.min(G1[0],G2[0]);
  const fixTxt=(f2===M.fix)?G1[1]:('الصف الأمامي: '+G1[1]+' — الصف الخلفي: '+G2[1]);
  const ab=(ANCHOR[G1[2]].NRd<=ANCHOR[G2[2]].NRd)?ANCHOR[G1[2]]:ANCHOR[G2[2]];
  const nBolt=Math.min(G1[3],G2[3]);
  const Rup=Math.max(0,1.5*WD.wLocUp-1.0*gk)*area/Math.max(g.nSup,1);   // شدّ مباشر بالضغوط الموضعية
  const Mbase=Hf*hTop+Rv*.1, boltT=Mbase/lever+Rup;
  const ballast=wWind*area*1.5/9.81*1000;
  const coatArea=Object.keys(qty).reduce((a,k)=>a+qty[k]*2*(SEC[k].b+SEC[k].h),0);
  const coatCost=M.coat==='galv'?tot*.55:(M.coat==='paint'?coatArea*5.5:0);
  const steelCost=tot*M.price,fabCost=tot*M.fab,kwp=np*(+M.pWp||PANEL.Wp)/1e3;
  const upTot=WD.wGl*area, wTot=tot*.00981+ (TPL[M.tpl].cover==='pv'?np*PANEL.kg*.00981:0);
  const FS=wTot/Math.max(upTot,.001);
  const ecc=(T.bld==='H')?0:WD.Fh*area*0.25*(T.bld==='B'?M.S:M.S);
  return {T,WD,upTot,wTot,FS,ecc,Rup,ab,nBolt,steel,plateKg,tot,area,q,Cf,wWind,gk,sk,C1,C2,C3,wU,Ls,trib,w,Mmax,d,N,sig,util,def,defR,
     Rv,Hf,Mbase,boltT,fixTxt,lever,ballast,coatArea,coatCost,steelCost,fabCost,kwp,tdeg,g,np,
     sys:SYSNOW,beam,Wsec,
     total:steelCost+fabCost+coatCost,kgm2:tot/Math.max(area,1),At,Ab,Ieff,hTop};}

const ARRF=['tpl','L','S','h1','h2','bay','td','over','orient','diag','fix','fix2','knee','sys',
  'secT','secB','secW','secP','secR','clearH','ridge','slatGap','az'];
function azOf(a){const v=+(a&&a.az);return isFinite(v)?((v%360)+360)%360:180;}
function arrPhi(a){return (180-(northDeg()+azOf(a)))*Math.PI/180;}
function newArr(nm){
  const a={name:nm||('مصفوفة '+(ARR.length+1)),x:+M.bOX||0,z:+M.bOZ||0};
  ARRF.forEach(k=>a[k]=M[k]);return a;}
function syncToArr(){
  if(!ARR.length){ARR=[newArr('مصفوفة 1')];AI=0;return;}
  if(AI<0||AI>=ARR.length)AI=0;
  const a=ARR[AI];ARRF.forEach(k=>a[k]=M[k]);a.x=+M.bOX;a.z=+M.bOZ;}
function applyArr(a){ARRF.forEach(k=>{if(a[k]!==undefined)M[k]=a[k];});M.bOX=a.x;M.bOZ=a.z;}
function snapM(){const o={bOX:M.bOX,bOZ:M.bOZ};ARRF.forEach(k=>o[k]=M[k]);return o;}
function restoreM(o){Object.keys(o).forEach(k=>M[k]=o[k]);}
function wrapFrom(marks,a,ox,oz){
  const phi=arrPhi(a);
  [gS,gC,gB,gD].forEach((src,i)=>{
    if(src.children.length<=marks[i])return;
    const w=new THREE.Group();
    src.children.splice(marks[i]).forEach(c=>w.add(c));
    w.rotation.y=phi;w.position.set(a.x-ox,0,a.z-oz);src.add(w);});}
function govR(){
  if(!ARES.length)return R;
  let g=ARES[0];ARES.forEach(r=>{if(r.util>g.util)g=r;});
  const S=Object.assign({},g);
  const sum=k=>ARES.reduce((a,r)=>a+(+r[k]||0),0);
  ['steel','plateKg','tot','area','coatArea','coatCost','steelCost','fabCost','total','kwp']
    .forEach(k=>S[k]=sum(k));
  S.kgm2=S.tot/Math.max(S.area,1);
  S.gov=g;S.nArr=ARR.length;S.g=g.g;

function build(){
  [gS,gC,gB,gD].forEach(clr);QTY={};KIND={};PC={};NP=0;PLATES=0;ANCH=0;PVINFO={};LEGS=[];
  makeSite();syncToArr();
  const keep=snapM();ARES=[];
  const ox=ARR[AI].x,oz=ARR[AI].z;
  ARR.forEach((a,i)=>{
    applyArr(a);NOGRND=(i>0);
    const T=TPL[M.tpl];T.id=M.tpl;
    const marks=[gS.children.length,gC.children.length,gB.children.length,gD.children.length];
    const s0={QTY:JSON.parse(JSON.stringify(QTY)),KIND:JSON.parse(JSON.stringify(KIND)),
      PC:JSON.parse(JSON.stringify(PC)),NP,PLATES,ANCH,nLeg:LEGS.length};
    const undo=()=>{QTY=JSON.parse(JSON.stringify(s0.QTY));KIND=JSON.parse(JSON.stringify(s0.KIND));
      PC=JSON.parse(JSON.stringify(s0.PC));NP=s0.NP;PLATES=s0.PLATES;ANCH=s0.ANCH;
      LEGS.length=s0.nLeg;
      [gS,gC,gB,gD].forEach((gg,k)=>gg.children.splice(marks[k]).forEach(c=>{
        if(c&&c.traverse)c.traverse(o=>{if(o.geometry&&o.geometry.dispose)o.geometry.dispose();});}));};
    const runOne=sv=>{
      SYSNOW=sv;
      M.td=(sv==='beam')?SEC[M.secT].h:a.td;
      const gg=T.bld==='A'?builderA(T):T.bld==='B'?builderB(T):T.bld==='C'?builderC(T):builderH(T);
      const qa={};Object.keys(QTY).forEach(k=>{const dq=QTY[k]-(s0.QTY[k]||0);if(dq>1e-9)qa[k]=dq;});
      return {g:gg,res:compute(gg,qa,NP-s0.NP,PLATES-s0.PLATES)};};
    const want=a.sys||'auto';
    let out=null,chosen=null;
    if(want!=='auto'){out=runOne(want);chosen=want;}
    else{
      /* تلقائي: جرّب جائزاً مفرداً ورفّع المقطع حتى يكفي، ولا تلجأ إلى الجمالون إلا إذا لم يكفِ أثقلها */
      const base=a.secT;
      for(const sc of F.secT.o){
        M.secT=sc;out=runOne('beam');
        if(out.res.util<=0.95&&out.res.defR>=200){chosen='beam';break;}

    const g=out.g,res=out.res;
    res.ai=i;res.arr=a;res.pv=Object.assign({},PVINFO);
    ARES.push(res);
    if(i===AI){R=res;dims(T,g);}
    const phi=arrPhi(a),c=Math.cos(phi),sn=Math.sin(phi);
    for(let k=s0.nLeg;k<LEGS.length;k++){
      const lx=LEGS[k][0],lz=LEGS[k][1],fx=LEGS[k][2];
      LEGS[k]=[lx*c+lz*sn+a.x,-lx*sn+lz*c+a.z,fx,i,lz];}
    wrapFrom(marks,a,ox,oz);});
  SYSNOW='truss';
  NOGRND=false;restoreM(keep);

  validate();drawSite();badge();drawSun();applyShadows();}

let TR={img:null,pts:[],sc:null,mode:'poly',p1:null,p2:null};
function siteFromTrace(){
  if(TR.pts.length<3||!TR.sc){log('حدّد 3 نقاط على الأقل وأدخل مقياس معلوم.',1);return;}
  if(TR.target==='room'){
    const q=TR.pts.map(a=>[a.x/TR.sc,a.y/TR.sc]);
    TR.target=null;TAB='room';drawTabs();
    roomFromPoly(q,'صورة/PDF');setRoomView(true);return;}
  const p=TR.pts.map(q=>[q.x/TR.sc,q.y/TR.sc]);
  const xs=p.map(a=>a[0]),ys=p.map(a=>a[1]);
  const mnx=Math.min(...xs),mny=Math.min(...ys);
  const poly=p.map(a=>[a[0]-mnx,a[1]-mny]);
  let A=0;for(let i=0;i<poly.length;i++){const a=poly[i],b=poly[(i+1)%poly.length];A+=a[0]*b[1]-b[0]*a[1];}
  TRACE_POLY=poly; M.bShape='trace'; M.bOn=1; makeSite(); drawSite();
  const m=.6;M.L=+(SITE.bb[0]-2*m).toFixed(2);M.S=+Math.min(SITE.bb[1]-2*m,12).toFixed(2);
  if(M.L<2)M.L=2; if(M.S<1.5)M.S=1.5;
  log('مخطط الموقع جاهز: مساحة '+SITE.area.toFixed(1)+' م² · إطار أقصى '+SITE.bb[0].toFixed(2)+'×'+SITE.bb[1].toFixed(2)+' م. تم ملاءمة الهيكل تلقائياً.');
  build();fit();dock();}
function drawSite(){
  clr(gSite); if(!SITE)return;
  const P=SITE.poly.map(q=>[q[0]-M.bOX,q[1]-M.bOZ]);
  const H=Math.max(0,M.bF*M.bFH);
  const sh=new THREE.Shape();
  P.forEach((p,i)=>i?sh.lineTo(p[0],p[1]):sh.moveTo(p[0],p[1]));
  // بلاطة السطح
  const sl=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:.30,bevelEnabled:false}),MAT.ground);
  sl.rotation.x=Math.PI/2; gSite.add(sl);
  // كتلة المبنى
  if(H>0){
    const ms=new THREE.Mesh(new THREE.ExtrudeGeometry(sh,{depth:H,bevelEnabled:false}),MAT.mass);
    ms.rotation.x=Math.PI/2; ms.position.y=-.30; gSite.add(ms);}
  // العمامة
  for(let i=0;i<P.length;i++){
    const a=P[i],b=P[(i+1)%P.length];
    if(M.bPar>0)gSite.add(tube(V(a[0],M.bPar/2,a[1]),V(b[0],M.bPar/2,b[1]),M.bParT,M.bPar,MAT.wall));
    // كورنيش الطوابق
    for(let k=1;k<=M.bF;k++){
      const y=-.30-H*k/Math.max(M.bF,1)+ (k===M.bF?.001:0);
      if(k<M.bF)gSite.add(tube(V(a[0],y,a[1]),V(b[0],y,b[1]),.06,.14,MAT.ground));}
    // الشبابيك موزّعة على كل ضلع
    if(M.win&&H>0){
      const L=Math.hypot(b[0]-a[0],b[1]-a[1]);
      const n=Math.floor(L/2.6);
      for(let k=0;k<M.bF;k++){
        const y=-.30-H*(k+.55)/M.bF;
        for(let j=0;j<n;j++){
          const u0=(j+.5)/n-.55/L, u1=(j+.5)/n+.55/L;
          const p1=V(a[0]+(b[0]-a[0])*u0,y,a[1]+(b[1]-a[1])*u0);
          const p2=V(a[0]+(b[0]-a[0])*u1,y,a[1]+(b[1]-a[1])*u1);
          gSite.add(tube(p1,p2,M.bParT+.08,1.25,MAT.win));}}}}
  // العوائق على السطح: بيت الدرج · الخزانات
  OBSW.forEach(o=>{
    if(!(o.h>0)||o.poly.length<3)return;
    const s2=new THREE.Shape();
    o.poly.forEach((q,i)=>{const X=q[0]-M.bOX,Z=q[1]-M.bOZ; i?s2.lineTo(X,Z):s2.moveTo(X,Z);});
    const bse=Math.min(+o.base||0,o.h-.05);
    const m2=new THREE.Mesh(new THREE.ExtrudeGeometry(s2,{depth:o.h-bse,bevelEnabled:false}),
      o.kind==='tank'?MAT.obs2:(o.kind==='bldg'?MAT.obs3:MAT.obs));
    m2.rotation.x=Math.PI/2; m2.position.y=o.h; gSite.add(m2);
    const cxz=o.poly.reduce((a,q)=>[a[0]+q[0],a[1]+q[1]],[0,0]);
    gSite.add(lbl((o.name||ROLE[o.kind]||'عائق')+' '+o.h.toFixed(2)+' م',
      V(cxz[0]/o.poly.length-M.bOX,o.h+.5,cxz[1]/o.poly.length-M.bOZ),'#8c5a13',1.7));});
  gSite.add(lbl('السطح '+SITE.area.toFixed(1)+' م²'+(H>0?' · '+M.bF+' طوابق · '+H.toFixed(1)+' م':''),
    V(SITE.bb[0]*.5-M.bOX,M.bPar+.45,-M.bOZ-.8),'#5b6b7a',1.8));
  // خط حدود الهيكل على السطح
  [[0,0],[M.L,0],[M.L,M.S],[0,M.S]].forEach((p,i,arr)=>{
    const q=arr[(i+1)%4];
    gSite.add(tube(V(p[0],.02,p[1]),V(q[0],.02,q[1]),.04,.02,MAT.brace));});}

function bearing(b){const t=(northDeg()+b)*RAD;return [Math.sin(t),-Math.cos(t)];}

/* ---- موقع الشمس (NOAA مبسّط) ---- */
function doy(mo,dy){const d=new Date(2001,(mo|0)-1,dy|0);return Math.floor((d-new Date(2001,0,0))/864e5);}
function decEot(n,hr){

      -0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)
      -0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)

function solar(lat,lon,tz,mo,dy,hr){
  const {eot,dec}=decEot(doy(mo,dy),hr),la=lat*RAD;

  let s=Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(H);
  s=Math.max(-1,Math.min(1,s));

  let c=(Math.cos(90.833*RAD)-Math.sin(la)*Math.sin(dec))/Math.max(1e-7,Math.cos(la)*Math.cos(dec));
  if(c>1)return{rise:null,set:null,noon};

function updateSun(){

/* ---- هندسة الظل ---- */
function segInt(a,b,c,d){
  const rx=b[0]-a[0],rz=b[1]-a[1],sx=d[0]-c[0],sz=d[1]-c[1];
  const den=rx*sz-rz*sx; if(Math.abs(den)<1e-12)return false;
  const t=((c[0]-a[0])*sz-(c[1]-a[1])*sx)/den;
  const u=((c[0]-a[0])*rz-(c[1]-a[1])*rx)/den;
  return t>=0&&t<=1&&u>=0&&u<=1;}
function segHits(a,b,poly){
  if(inPoly(b[0],b[1],poly))return true;
  for(let i=0;i<poly.length;i++)if(segInt(a,b,poly[i],poly[(i+1)%poly.length]))return true;
  return false;}
/* ارتفاع مستوى الألواح فوق السطح عند z محلي داخل الهيكل */

function panelYA(a,z){
  const T=TPL[a&&a.tpl?a.tpl:M.tpl]||TPL[M.tpl];
  const h1=a?+a.h1:+M.h1,h2=a?+a.h2:+M.h2,S=a?+a.S:+M.S;
  if(T.bld==='H')return (a?+a.clearH:+M.clearH)||0;

function shadedAt(X,Z,y,alt,az){
  const A=alt===undefined?SUN.alt:alt;
  if(!(A>1))return true;
  const tn=Math.tan(A*RAD),h=sunHoriz(az);
  for(const o of OBSW){
    const dh=o.h-y; if(dh<=.02)continue;
    const d=dh/tn; if(!isFinite(d))continue;
    if(segHits([X,Z],[X+d*h[0],Z+d*h[1]],o.poly))return true;}
  if(SITE&&M.bPar>0){
    const dh=M.bPar-y;
    if(dh>.02){const d=dh/tn,b=[X+d*h[0],Z+d*h[1]],P=SITE.poly;
      if(!inPoly(b[0],b[1],P))return true;
      for(let i=0;i<P.length;i++)if(segInt([X,Z],b,P[i],P[(i+1)%P.length]))return true;}}

/* نسبة مساحة الألواح المظللة عند ساعة معيّنة */
function shadeFracA(a,mo,dy,hr,nx,nz){

  if(!(s.alt>1))return {alt:s.alt,az:s.az,frac:1,dark:1};
  nx=nx||13;nz=nz||9;let tot=0,sh=0;

    const lx=a.L*(i+.5)/nx,lz=a.S*(j+.5)/nz,p=arrPt(a,lx,lz);
    tot++; if(shadedAt(p[0],p[1],panelYA(a,lz),s.alt,s.az))sh++;}

/* غلاف محدّب لظل منشور رأسي على مستوى السطح */
function hull(pts){
  const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  if(p.length<3)return p;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[];for(const q of p){while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
  const up=[];for(let i=p.length-1;i>=0;i--){const q=p[i];
    while(up.length>=2&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
  lo.pop();up.pop();return lo.concat(up);}

  if(!(h>0)||!(alt>1))return null;
  const d=h/Math.tan(alt*RAD); if(!isFinite(d)||d>500)return null;
  const s=sunHoriz(az);

function animStart(mode,secPerDay,once,onEnd){

    t0:performance.now(),di:0,keep:{mo:+M.sMon,dy:+M.sDay,hr:+M.sHour}};
  dock();}
function animStop(restore){

  const k=ANIM.keep,cb=ANIM.onEnd;ANIM=null;
  if(restore!==false){M.sMon=k.mo;M.sDay=k.dy;M.sHour=k.hr;}
  drawSun();dock();

function animTick(){
  if(!ANIM)return;
  const span=ANIM.secPerDay,el=(performance.now()-ANIM.t0)/1000;
  let k,day;
  if(ANIM.mode==='season'){
    const total=4*span;
    if(ANIM.once&&el>=total){animStop();return;}
    const e2=el%total;ANIM.di=Math.min(3,Math.floor(e2/span));
    k=(e2%span)/span;day=SEASONS[ANIM.di];
  }else{
    if(ANIM.once&&el>=span){animStop();return;}
    k=(el%span)/span;day=[+M.sMon,+M.sDay];}
  M.sMon=day[0];M.sDay=day[1];
  const st=sunTimes(+M.lat,+M.lon,+M.tz,M.sMon,M.sDay);
  const r=(st&&st.rise!=null)?st.rise+.2:6, s2=(st&&st.set!=null)?st.set-.2:18;
  M.sHour=r+(s2-r)*k;
  drawSun(true);}

/* ---- تسجيل فيديو من لوحة العرض ---- */
function recSupported(){
  const cv=renderer.domElement;
  return !!(cv&&cv.captureStream&&typeof MediaRecorder!=='undefined');}
function recStart(mode,secPerDay){
  if(REC){log('تسجيل جارٍ بالفعل.',1);return;}
  if(!recSupported()){
    log('متصفحك لا يدعم تسجيل الفيديو (MediaRecorder). استعمل Chrome أو Edge على الكمبيوتر.',1);return;}
  const cv=renderer.domElement;
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
  let mr;
  try{mr=new MediaRecorder(cv.captureStream(30),mt?{mimeType:mt,videoBitsPerSecond:8e6}:undefined);}
  catch(e){log('تعذّر بدء التسجيل: '+e.message,1);return;}
  const chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{
    REC=null;
    const b=new Blob(chunks,{type:mt||'video/webm'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=((M.project||'icool')+'-'+(mode==='season'?'four-seasons':'day')+'.webm').replace(/\s+/g,'-');
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),6000);
    log('تم حفظ الفيديو ('+(b.size/1048576).toFixed(1)+' ميغابايت).');
    dock();};
  REC=mr;mr.start();
  animStart(mode,secPerDay,true,()=>{try{mr.stop();}catch(e){REC=null;}});
  dock();}

/* ---- قراءة KML ---- */
function tagsOf(root,name){
  let a=[].slice.call(root.getElementsByTagName(name));
  if(!a.length)a=[].slice.call(root.getElementsByTagName('*')).filter(e=>e.localName===name);
  return a;}
function kmlRing(t){
  const r=t.trim().split(/\s+/).map(x=>x.split(','))
    .filter(a=>a.length>=2).map(a=>[parseFloat(a[0]),parseFloat(a[1])])
    .filter(a=>isFinite(a[0])&&isFinite(a[1]));
  if(r.length>1&&Math.abs(r[0][0]-r[r.length-1][0])<1e-12&&Math.abs(r[0][1]-r[r.length-1][1])<1e-12)r.pop();
  return r;}
function llToLocal(ring,lat0,lon0){
  const mLat=111132.92-559.82*Math.cos(2*lat0*RAD)+1.175*Math.cos(4*lat0*RAD);
  const mLon=111412.84*Math.cos(lat0*RAD)-93.5*Math.cos(3*lat0*RAD);
  return ring.map(p=>[(p[0]-lon0)*mLon,-(p[1]-lat0)*mLat]);}

  const doc=new DOMParser().parseFromString(txt,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('الملف ليس KML صالحاً.');
  const out=[];
  tagsOf(doc,'Placemark').forEach(pm=>{
    const ne=tagsOf(pm,'name')[0],nm=ne?ne.textContent.trim():'';
    const push=(ring)=>{if(ring.length>=3)out.push({name:nm,ring});};
    tagsOf(pm,'Polygon').forEach(pg=>{
      const ob=tagsOf(pg,'outerBoundaryIs')[0]||pg;
      const co=tagsOf(ob,'coordinates')[0];
      if(co)push(kmlRing(co.textContent));});
    tagsOf(pm,'LineString').forEach(ls=>{
      const co=tagsOf(ls,'coordinates')[0];
      if(co)push(kmlRing(co.textContent));});});
  if(!out.length)throw new Error('لا يوجد أي مضلّع في الملف. ارسم السطح كمضلّع (Polygon) في Google Earth ثم Save Place As → .kml');
  return out;}
const ROLE={roof:'السطح',stair:'بيت الدرج',tank:'خزان مياه',bldg:'مبنى مجاور',obs:'عائق آخر',skip:'تجاهل'};
const ROLE_H={stair:2.60,tank:1.20,bldg:6.00,obs:1.00};
function loadKML(f){
  if(!f)return;
  if(/\.kmz$/i.test(f.name)){log('KMZ غير مدعوم — في Google Earth اختر Save Place As ثم KML بدل KMZ.',1);return;}
  const r=new FileReader();
  r.onload=()=>{
    try{
      const raw=parseKML(String(r.result));
      const c=raw[0].ring.reduce((a,p)=>[a[0]+p[0],a[1]+p[1]],[0,0]);
      const lon0=c[0]/raw[0].ring.length,lat0=c[1]/raw[0].ring.length;
      KMLP=raw.map(o=>{const xy=llToLocal(o.ring,lat0,lon0);
        return {name:o.name,ring:o.ring,area:polyArea(xy),lat0,lon0,role:'skip',h:2.60};});
      let bi=0;KMLP.forEach((o,i)=>{if(o.area>KMLP[bi].area)bi=i;});
      KMLP.forEach((o,i)=>{
        if(i===bi){o.role='roof';return;}
        if(/درج|stair|staircase|penthouse/i.test(o.name)){o.role='stair';o.h=ROLE_H.stair;}
        else if(/خزان|tank|water/i.test(o.name)){o.role='tank';o.h=ROLE_H.tank;}
        else if(/مجاور|جار|بناية|مبنى|building|neighbou?r|tower/i.test(o.name)){o.role='bldg';o.h=ROLE_H.bldg;}
        else {o.role='obs';o.h=ROLE_H.obs;}});
      log('KML: '+KMLP.length+' مضلّع. الأكبر ('+KMLP[bi].area.toFixed(1)+' م²) اعتُبر السطح. راجع الأدوار ثم اضغط «تطبيق».');
      dock();

  r.onerror=()=>log('تعذّر قراءة الملف.',1);
  r.readAsText(f);}

/* ---------- 9. محرّك الأوامر العربي ---------- */
const AR='٠١٢٣٤٥٦٧٨٩';
function num(s){return s.replace(/[٠-٩]/g,c=>AR.indexOf(c));}
function grab(txt,keys){
  for(const k of keys){
    const re=new RegExp(k+'\\s*[:=]?\\s*(-?\\d+(?:[.,]\\d+)?)');
    const m=txt.match(re); if(m)return parseFloat(m[1].replace(',','.'));}
  return null;}
function aiApply(raw){
  const t=num(raw).replace(/[×xX*]/g,'x');
  const ch=[];
  const T0=M.tpl;
  if(/مزدوج|صفين\s*سيار/.test(t))M.tpl='S3';
  else if(/موقف|كارب|carport/i.test(t))M.tpl=/جهتين|عمودين|صفي\s*أعمدة/.test(t)?'S1':'S2';
  else if(/هنغار/.test(t)&&/فوق|سطح/.test(t))M.tpl='S6';
  else if(/هنغار/.test(t))M.tpl=/مائل|مفرد/.test(t)?'H2':'H1';
  else if(/برغول|بركول/.test(t))M.tpl=/كابول|حائط/.test(t)?'P3':(/مائل/.test(t)?'P2':'P1');
  else if(/مظل[ةه]/.test(t))M.tpl=/سطح\s*مبنى/.test(t)?'S4':'S1';
  else if(/ثروبولت|واجهة|خارج\s*العمامة/.test(t))M.tpl='S5';
  else if(/حائطين|بين\s*حائط|بدون\s*(أ|ا)رجل/.test(t))M.tpl='S7';
  else if(/سطح\s*مبنى|4\s*أعمدة|أربع\s*أعمدة/.test(t))M.tpl='S4';
  if(M.tpl!==T0){applyTpl(M.tpl);M.cat=TPL[M.tpl].cat;ch.push('النموذج → '+TPL[M.tpl].n);}
  const set=(k,v,u)=>{if(v===null||isNaN(v))return;const f=F[k];
    if(f&&f.t==='r')v=Math.min(f.max,Math.max(f.min,v));
    if(M[k]!==v){M[k]=v;ch.push(f.l+' → '+v+(u||''));}};
  set('L',grab(t,['الطول','طول','لون?ج']));
  set('S',grab(t,['البحر','بحر','العرض','عرض']));
  set('h1',grab(t,['الارتفاع\\s*الأمامي','ارتفاع\\s*أمامي','امامي']));
  set('h2',grab(t,['الارتفاع\\s*الخلفي','ارتفاع\\s*خلفي','خلفي']));
  set('bay',grab(t,['تباعد','المسافة\\s*بين']));
  set('td',grab(t,['ارتفاع\\s*الجمالون','عمق\\s*الجمالون']));
  set('clearH',grab(t,['الارتفاع\\s*الصافي','صافي']));
  set('ridge',grab(t,['الجملون','جملون']));
  set('wind',grab(t,['ريح','الريح']));
  set('snow',grab(t,['ثلج','الثلج']));
  const tl=grab(t,['ميل','زاوية']);
  if(tl!==null&&!isNaN(tl)&&TPL[M.tpl].bld!=='H'){
    const sl=(TPL[M.tpl].bld==='B')?M.S:M.S;
    M.h2=+(M.h1+sl*Math.tan(tl*Math.PI/180)).toFixed(2);ch.push('ميل '+tl+'° → ارتفاع خلفي '+M.h2+' م');}
  if(/بدون\s*أقطار|مستطيل|vierendeel/i.test(t)){M.diag=0;ch.push('جمالون مستطيل بدون أقطار');}
  if(/مع\s*أقطار|مثلث/.test(t)){M.diag=1;ch.push('جمالون بأقطار');}
  if(/بورتريه|طولي\s*اللوح/.test(t)){M.orient='port';ch.push('ألواح بورتريه');}
  if(/عرضاني|landscape/i.test(t)){M.orient='land';ch.push('ألواح عرضانية');}
  if(/كيميائي/.test(t)){M.fix='base';ch.push('تثبيت: قاعدة كيميائية');}
  if(/ثروبولت/.test(t)){M.fix='through';ch.push('تثبيت: ثروبولت');}
  if(/عمامة/.test(t)){M.fix='parapet';ch.push('تثبيت: كتائف العمامة');}
  if(/كلامب/.test(t)){M.fix='hangar';ch.push('تثبيت: كلامب');}
  if(/وزن\s*باطون|بالاست/.test(t)){M.fix='ballast';ch.push('تثبيت: وزن باطوني');}
  if(/جلفن/.test(t)){M.coat='galv';ch.push('حماية: جلفنة');}
  const secs=t.match(/\d{2,3}x\d{2,3}(?:x[\d.]+)?/g)||[];
  secs.forEach(s=>{
    const k=Object.keys(SEC).find(q=>q.startsWith(s))||Object.keys(SEC).find(q=>q.indexOf(s)===0);
    if(!k)return;
    if(/عمود|أعمدة|رجل|أرجل/.test(t)&&SEC[k].b>=.08){M.secP=k;ch.push('الأعمدة → '+k);}
    else if(/مراب|مداد|تضليع/.test(t)&&SEC[k].b<=.06){M.secW=k;M.secR=k;ch.push('التضليع/المرابط → '+k);}
    else if(SEC[k].h>=.1){M.secT=k;ch.push('الجائز العلوي → '+k);}
    else {M.secB=k;ch.push('الجائز السفلي → '+k);}});
  if(!ch.length){log('لم أفهم أمراً قابلاً للتنفيذ. مثال: «موقف سيارات طول 18 بحر 5.5 ميل 12 أعمدة 120x120 بدون أقطار».',1);return;}
  build();fit();dock();
  log('تم: '+ch.join(' · '));}
function log(s,e){
  const el=document.getElementById('log'); if(!el)return;
  const d=document.createElement('div'); if(e)d.className='e'; d.textContent=s;
  el.insertBefore(d,el.firstChild);}

/* ---------- 10. رسم SVG للخرائط التنفيذية ---------- */
function SV(w,h,body,grid){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" font-family="Tajawal,Arial">
  <rect width="${w}" height="${h}" fill="#fff"/>${grid||''}${body}</svg>`;}
const ln=(a,b,c,d,st)=>`<line x1="${a.toFixed(1)}" y1="${b.toFixed(1)}" x2="${c.toFixed(1)}" y2="${d.toFixed(1)}" stroke="${(st&&st.c)||'#16222e'}" stroke-width="${(st&&st.w)||1.3}" ${st&&st.dash?'stroke-dasharray="5 3"':''}/>`;
const tx=(x,y,t,o)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${(o&&o.s)||10}" fill="${(o&&o.c)||'#16222e'}" text-anchor="${(o&&o.a)||'middle'}" ${o&&o.b?'font-weight="700"':''} ${o&&o.r?`transform="rotate(${o.r} ${x.toFixed(1)} ${y.toFixed(1)})"`:''}>${t}</text>`;
const rc=(x,y,w,h,f,s)=>`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.abs(w).toFixed(1)}" height="${Math.abs(h).toFixed(1)}" fill="${f||'none'}" stroke="${s||'#16222e'}" stroke-width="1.1"/>`;
function dimH(x1,x2,y,t){
  const c='#0066A7';
  return ln(x1,y,x2,y,{c,w:.9})+ln(x1,y-4,x1,y+4,{c,w:.9})+ln(x2,y-4,x2,y+4,{c,w:.9})+
   `<rect x="${((x1+x2)/2-20).toFixed(1)}" y="${(y-8).toFixed(1)}" width="40" height="11" fill="#fff"/>`+
   tx((x1+x2)/2,y+1,t,{s:9,c,b:1});}
function dimV(y1,y2,x,t){
  const c='#0066A7';
  return ln(x,y1,x,y2,{c,w:.9})+ln(x-4,y1,x+4,y1,{c,w:.9})+ln(x-4,y2,x+4,y2,{c,w:.9})+
   `<rect x="${(x-20).toFixed(1)}" y="${((y1+y2)/2-6).toFixed(1)}" width="40" height="11" fill="#fff"/>`+
   tx(x,(y1+y2)/2+3,t,{s:9,c,b:1});}

/* ---------- 8ج. الطاقة: الإنتاجية · الأحمال · البطاريات · التشريج ---------- */
const MDAYS=[31,28,31,30,31,30,31,31,30,31,30,31];
const MNAME=['ك2','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','ت1','ت2','ك1'];
const MFULL=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
const MREP=[17,47,75,105,135,162,198,228,258,288,318,344];
/* شكل الإشعاع الأفقي الشهري (kWh/م²/يوم) — ساحل لبنان، يُعاير على المجموع السنوي المُدخل */
const GHI_SHAPE=[2.6,3.4,4.7,5.9,7.0,7.8,7.7,7.1,6.0,4.6,3.2,2.4];
const TAMB=[14,14,16,19,22,25,27,28,27,24,19,16];
const GHI_BASE=GHI_SHAPE.reduce((a,v,i)=>a+v*MDAYS[i],0);
const CHEM={lifepo4:{n:'ليثيوم LiFePO4',dod:.90,eta:.96,cyc:6000,cmax:1.0,vm:51.2},
 agm:{n:'رصاص AGM',dod:.50,eta:.85,cyc:800,cmax:.30,vm:12},
 gel:{n:'رصاص جل',dod:.50,eta:.85,cyc:1000,cmax:.25,vm:12},
 flood:{n:'رصاص سائل',dod:.50,eta:.80,cyc:1200,cmax:.20,vm:12}};

function ghiMonth(m){return GHI_SHAPE[m]*((+M.ghiY||1900)/GHI_BASE);}
function erbsKd(Kt){
  if(Kt<=0)return 1;
  if(Kt<0.715)return Math.max(.05,Math.min(1,1-0.2727*Kt+2.4495*Kt*Kt-11.9514*Kt*Kt*Kt+9.3879*Kt*Kt*Kt*Kt));
  return .143;}
/* نسبة المساحة المظللة عند وضع شمسي معطى */
function shadeFracSun(a,alt,az,nx,nz){
  if(!(alt>1))return 1;
  nx=nx||7;nz=nz||5;let tot=0,sh=0;
  for(let i=0;i<nx;i++)for(let j=0;j<nz;j++){
    const lx=a.L*(i+.5)/nx,lz=a.S*(j+.5)/nz,p=arrPt(a,lx,lz);
    tot++; if(shadedAt(p[0],p[1],panelYA(a,lz),alt,az))sh++;}
  return tot?sh/tot:0;}
/* ميل مستوى الألواح بالدرجات لمصفوفة */
function arrTilt(a){
  const T=TPL[a.tpl]||TPL[M.tpl];
  if(T.flat)return 0;
  if(T.bld==='H')return Math.atan2(+M.ridge||0,Math.max(+a.S,.1)/2)/RAD;
  return Math.atan2(Math.abs((+a.h2)-(+a.h1)),Math.max(+a.S,.1))/RAD;}
function sysDerate(){
  const f=[M.lSoil,M.lMis,M.lWire,M.lInv,M.lAvail].map(v=>1-(+v||0)/100);
  return f.reduce((x,y)=>x*y,1);}

/* محاكاة ساعية على يوم ممثّل لكل شهر */
function yieldArray(a,kwp){
  const lat=+M.lat,la=lat*RAD,beta=arrTilt(a)*RAD,tcP=(+M.pTcP||-0.34)/100;
  const rho=+M.albedo||.2,noct=+M.noct||45,der=sysDerate(),shf=+M.shFac||2;
  const azp=azOf(a);
  const nrm=[Math.sin(beta)*Math.sin(azp*RAD),Math.sin(beta)*Math.cos(azp*RAD),Math.cos(beta)];
  const mon=[];let yr=0,poaY=0,ghiY=0,shLossY=0;
  for(let m=0;m<12;m++){
    const n=MREP[m],H=ghiMonth(m);
    const dec=0.4093*Math.sin(2*Math.PI*(284+n)/365);
    let cw=-Math.tan(la)*Math.tan(dec);cw=Math.max(-1,Math.min(1,cw));
    const ws=Math.acos(cw);
    const Gon=1.367*(1+0.033*Math.cos(2*Math.PI*n/365));
    const H0=(24/Math.PI)*Gon*(Math.cos(la)*Math.cos(dec)*Math.sin(ws)+ws*Math.sin(la)*Math.sin(dec));
    const Kt=Math.max(.05,Math.min(.85,H/Math.max(H0,.01)));
    const Hd=H*erbsKd(Kt);
    const wsd=ws/RAD;
    const aa=0.409+0.5016*Math.sin((wsd-60)*RAD), bb=0.6609-0.4767*Math.sin((wsd-60)*RAD);
    const den=Math.sin(ws)-ws*Math.cos(ws);
    let Ed=0,poaD=0,Eun=0;
    for(let hr=0.5;hr<24;hr+=1){
      const w=(hr-12)*15*RAD;
      if(Math.abs(w)>=ws)continue;
      const cz=Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(w);
      if(cz<=0.02)continue;
      const alt=Math.asin(Math.min(1,cz))/RAD;
      let ca=(Math.sin(dec)-cz*Math.sin(la))/Math.max(1e-6,Math.cos(Math.asin(cz))*Math.cos(la));
      ca=Math.max(-1,Math.min(1,ca));
      let az=Math.acos(ca)/RAD; if(w>0)az=360-az;
      const rt=Math.max(0,(Math.PI/24)*(aa+bb*Math.cos(w))*(Math.cos(w)-Math.cos(ws))/Math.max(den,1e-6));
      const rd=Math.max(0,(Math.PI/24)*(Math.cos(w)-Math.cos(ws))/Math.max(den,1e-6));
      const I=rt*H, Id=Math.min(I,rd*Hd), Ib=Math.max(0,I-Id);
      if(I<=0.001)continue;
      const sv=[Math.cos(alt*RAD)*Math.sin(az*RAD),Math.cos(alt*RAD)*Math.cos(az*RAD),Math.sin(alt*RAD)];
      const cosT=Math.max(0,sv[0]*nrm[0]+sv[1]*nrm[1]+sv[2]*nrm[2]);
      const Rb=Math.min(6,cosT/Math.max(cz,.05));
      const I0=Gon*cz;
      const Ai=Math.max(0,Math.min(1,Ib/Math.max(I0,.001)));
      const f=Math.sqrt(Math.max(0,Ib/I));
      const poa=Ib*Rb
        + Id*((1-Ai)*((1+Math.cos(beta))/2)*(1+f*Math.pow(Math.sin(beta/2),3))+Ai*Rb)
        + I*rho*(1-Math.cos(beta))/2;
      if(poa<=0)continue;
      const Tc=TAMB[m]+(noct-20)/0.8*poa;
      const pdc=kwp*poa*(1+tcP*(Tc-25));
      const shf0=shadeFracSun(a,alt,az);
      const loss=Math.max(0,Math.min(1,shf0*shf));
      poaD+=poa; Eun+=Math.max(0,pdc)*der; Ed+=Math.max(0,pdc)*der*(1-loss);}
    const d=MDAYS[m];
    mon.push({m,ghi:H,poa:poaD,Ed,E:Ed*d,Eun:Eun*d,days:d,
      sh:Eun>0?(1-Ed/Eun):0,tamb:TAMB[m]});
    yr+=Ed*d; poaY+=poaD*d; ghiY+=H*d; shLossY+=(Eun-Ed)*d;}
  const pr=(poaY*kwp>0)?yr/(poaY*kwp):0;
  return {mon,year:yr,poaY,ghiY,shLossY,pr,kwp,tilt:arrTilt(a),az:azp,
    spec:kwp>0?yr/kwp:0,worst:mon.reduce((x,y)=>y.Ed<x.Ed?y:x,mon[0])};}

function energyAll(){
  const out=[];let tot=0,kwp=0;
  ARES.forEach(r=>{
    const a=r.arr;
    if(!TPL[a.tpl]||TPL[a.tpl].cover!=='pv')return;
    const k=(r.np||0)*(+M.pWp||PANEL.Wp)/1000;
    if(k<=0)return;
    const y=yieldArray(a,k);y.name=a.name;y.np=r.np;
    out.push(y);tot+=y.year;kwp+=k;});
  const monT=[];
  for(let m=0;m<12;m++)monT.push(out.reduce((s,y)=>s+y.mon[m].E,0));
  return {arrays:out,year:tot,kwp,monT,
    spec:kwp>0?tot/kwp:0,
    worstM:monT.length?monT.indexOf(Math.min(...monT)):0};}

/* ---- الأحمال والبطاريات والتشريج ---- */
function loadCalc(){
  const d=+M.loadD||0, nightPc=(+M.loadNight||0)/100;
  return {day:d, night:d*nightPc, dayPart:d*(1-nightPc), peak:+M.loadPk||0, year:d*365};}
function batCalc(){
  const c=CHEM[M.batChem]||CHEM.lifepo4;
  const dod=(+M.batDoD||c.dod*100)/100, eta=c.eta;
  const L=loadCalc();
  const V=+M.batV||48, vm=+M.batVm||c.vm, ah=+M.batAh||200;
  const needWh=L.night*(+M.batDays||1)*1000;
  const needAh=needWh/Math.max(V*dod*eta,1);
  const ser=Math.max(1,Math.round(V/Math.max(vm,1)));
  const par=Math.max(1,Math.ceil(needAh/Math.max(ah,1)));
  const n=ser*par;
  const bankAh=par*ah, usable=bankAh*V*dod*eta/1000;
  const iPk=L.peak*1000/Math.max(V,1);
  const cRate=iPk/Math.max(bankAh,1);
  const vErr=Math.abs(ser*vm-V)>0.6;
  return {c,dod,eta,V,vm,ah,ser,par,n,bankAh,usable,needAh,needWh,iPk,cRate,vErr,
    days:+M.batDays||1,autonomy:L.night>0?usable/L.night:0,
    kwhNom:n*vm*ah/1000};}
function stringCalc(){
  const tcv=(+M.pTcV||-0.25)/100;
  const tMin=+M.tMin, tMax=+M.tCellMax;
  const vocC=(+M.pVoc||45.9)*(1+tcv*(tMin-25));
  const vmpH=(+M.pVmp||38.4)*(1+tcv*(tMax-25));
  const nMax=Math.floor((+M.invVmax||1000)/Math.max(vocC,1));
  const nMin=Math.ceil((+M.invVmin||200)/Math.max(vmpH,1));
  const npTot=ARES.reduce((a,r)=>a+((TPL[r.arr.tpl]&&TPL[r.arr.tpl].cover==='pv')?(r.np||0):0),0);
  const mppt=Math.max(1,+M.invMppt||2);
  let best=null;
  for(let n=Math.max(1,nMin);n<=Math.max(nMin,nMax);n++){
    const str=Math.ceil(npTot/n);
    if(str<1)continue;
    const perM=Math.ceil(str/mppt);
    const iStr=perM*(+M.pIsc||18.3);
    const waste=n*str-npTot;
    const sc={n,str,perM,iStr,waste,
      vmax:vocC*n,vmp:vmpH*n,
      okI:iStr<=(+M.invIsc||30)+1e-9,
      okV:vocC*n<=(+M.invVmax||1000)&&vmpH*n>=(+M.invVmin||200)};
    if(!sc.okV)continue;
    if(!best||(sc.okI&&!best.okI)||(sc.okI===best.okI&&sc.waste<best.waste))best=sc;}
  return {vocC,vmpH,nMax,nMin,npTot,mppt,best,tMin,tMax,
    kwp:npTot*(+M.pWp||PANEL.Wp)/1000};}
function sizePanels(){
  const L=loadCalc(),E=energyAll();
  const der=1;
  const per=E.kwp>0?E.year/E.kwp:0;                 // kWh/kWp/سنة
  const wp=(+M.pWp||PANEL.Wp)/1000;
  let worstDaily=0,annualPer=0;
  if(E.arrays.length){
    const ref=E.arrays[0];
    const w=ref.worst;
    worstDaily=(w.Ed/Math.max(ref.kwp,.001))*wp;    // kWh/لوح/يوم في أسوأ شهر
    annualPer=(ref.year/Math.max(ref.kwp,.001))*wp; // kWh/لوح/سنة
  }
  const bat=batCalc();
  const rt=bat.eta;
  const needOff=worstDaily>0?Math.ceil(L.day/ (worstDaily*rt)):0;
  const needGrid=annualPer>0?Math.ceil(L.year/annualPer):0;
  return {L,E,per,worstDaily,annualPer,needOff,needGrid,
    have:E.arrays.reduce((a,y)=>a+y.np,0),
    cover:L.year>0?E.year/L.year:0};}

/* ---------- لوحة الظلال + فصل التقرير ---------- */
function sheetShadow(mo,dy){
  mo=mo||12;dy=dy||21;
  const W=760,H=470,mx=64,my=52;
  if(!SITE)return SV(W,H,tx(W/2,H/2,'لم يُحدَّد السطح — استورد ملف KML أو أدخل أبعاد السطح',{s:12,c:'#5b6b7a'}));
  const times=[[9,'#F1471E'],[12,'#0066A7'],[15,'#7a5cc4']];
  const shp=[];let parLine=null;
  times.forEach(([hr,col])=>{
    const s=solar(+M.lat,+M.lon,+M.tz,mo,dy,hr);
    OBSW.forEach(o=>{const hl=shadowHull(o.poly,o.h,s.alt,s.az);
      if(hl)shp.push({hl,col});});
    if(hr===12&&M.bPar>0&&s.alt>1){
      const d=M.bPar/Math.tan(s.alt*RAD),v=sunHoriz(s.az);
      parLine={p:SITE.poly.map(q=>[q[0]-d*v[0],q[1]-d*v[1]]),d};}});
  const all=SITE.poly.concat(...shp.map(s=>s.hl));
  const mnx=Math.min(...all.map(p=>p[0])),mxx=Math.max(...all.map(p=>p[0]));

  const sc=Math.min((W-2*mx)/Math.max(mxx-mnx,1),(H-2*my-26)/Math.max(mxz-mnz,1));
  const X=x=>mx+(x-mnx)*sc,Z=z=>my+(z-mnz)*sc;
  const pth=p=>'M'+p.map(q=>X(q[0]).toFixed(1)+','+Z(q[1]).toFixed(1)).join(' L')+' Z';
  let b='';
  shp.forEach(s=>{b+=`<path d="${pth(s.hl)}" fill="${s.col}" fill-opacity=".15" stroke="${s.col}" stroke-width="1" stroke-dasharray="4 3"/>`;});
  if(parLine)b+=`<path d="${pth(parLine.p)}" fill="none" stroke="#0066A7" stroke-width="1" stroke-dasharray="2 3"/>`;
  b+=`<path d="${pth(SITE.poly)}" fill="none" stroke="#0B2239" stroke-width="2"/>`;
  OBSW.forEach(o=>{
    b+=`<path d="${pth(o.poly)}" fill="#b9b2a3" stroke="#6b6152" stroke-width="1.2"/>`;
    const c=o.poly.reduce((a,q)=>[a[0]+q[0],a[1]+q[1]],[0,0]);
    b+=tx(X(c[0]/o.poly.length),Z(c[1]/o.poly.length)+3,(o.name||'عائق')+' h='+(+o.h).toFixed(2),{s:8,b:1,c:'#3a3225'});});
  b+=`<rect x="${X(M.bOX).toFixed(1)}" y="${Z(M.bOZ).toFixed(1)}" width="${(M.L*sc).toFixed(1)}" height="${(M.S*sc).toFixed(1)}" fill="none" stroke="#F1471E" stroke-width="1.6" stroke-dasharray="6 3"/>`;
  b+=tx(X(M.bOX+M.L/2),Z(M.bOZ+M.S/2),'الهيكل '+M.L.toFixed(2)+'×'+M.S.toFixed(2),{s:9,b:1,c:'#F1471E'});
  const nv=bearing(0),sv2=bearing(180),ax=W-50,ay=62,r=25;
  b+=`<circle cx="${ax}" cy="${ay}" r="${r}" fill="#fff" stroke="#c9d3db" stroke-width="1"/>`;
  b+=ln(ax,ay,ax+nv[0]*r,ay+nv[1]*r,{c:'#0066A7',w:2.2});
  b+=tx(ax+nv[0]*(r+10),ay+nv[1]*(r+10)+3,'ش',{s:11,b:1,c:'#0066A7'});
  b+=tx(ax+sv2[0]*(r+10),ay+sv2[1]*(r+10)+3,'ج',{s:11,b:1,c:'#F1471E'});
  let ly=H-34;
  b+=tx(mx,ly,'ظلال '+dy+' '+MFULL[mo-1]+':',{s:9,b:1,a:'start'});
  times.forEach(([hr,col],i)=>{const x0=mx+108+i*108;
    b+=`<rect x="${x0}" y="${ly-8}" width="15" height="9" fill="${col}" fill-opacity=".15" stroke="${col}" stroke-width="1"/>`;
    b+=tx(x0+20,ly,hhmm(hr),{s:9,a:'start'});});
  if(parLine)b+=tx(W-mx,ly,'--- حدّ ظل العمامة ظهراً ('+parLine.d.toFixed(2)+' م)',{s:8.5,a:'end',c:'#0066A7'});
  b+=tx(W/2,H-11,'الظل مُسقط على مستوى السطح كغلاف محدّب لمنشور رأسي. مستوى الألواح أعلى من السطح، فالظل الواقع عليها أقصر — النسب المئوية في التقرير محسوبة على مستوى الألواح.',{s:8,c:'#5b6b7a'});
  return SV(W,H,b);}

function arraysTable(){
  if(ARES.length<2)return '';
  const gov=R.gov||ARES[0];
  let r='';
  ARES.forEach((x,i)=>{
    const a=x.arr,T=TPL[a.tpl]||{};
    const w=shadeFracA(a,12,21,12).frac;

function roomPoly(){
  if(ROOM.poly&&ROOM.poly.length>=3)return ROOM.poly;
  const W=Math.max(1,+ROOM.W),L=Math.max(1,+ROOM.L);
  return [[0,0],[W,0],[W,L],[0,L]];}
function roomBB(){const p=roomPoly();
  const xs=p.map(q=>q[0]),zs=p.map(q=>q[1]);
  return {x0:Math.min(...xs),x1:Math.max(...xs),z0:Math.min(...zs),z1:Math.max(...zs)};}
function roomArea(){return polyArea(roomPoly());}
function roomWalls(){
  const p=roomPoly(),out=[];
  for(let i=0;i<p.length;i++){
    const a=p[i],b=p[(i+1)%p.length];
    const dx=b[0]-a[0],dz=b[1]-a[1],len=Math.hypot(dx,dz)||1;
    const ux=dx/len,uz=dz/len;
    /* الاتجاه الداخلي: يسار الضلع لمضلّع عكس عقارب الساعة في (x,z) */
    let nx=uz,nz=-ux;
    const mx=(a[0]+b[0])/2+nx*.05,mz=(a[1]+b[1])/2+nz*.05;
    if(!inPoly(mx,mz,p)){nx=-nx;nz=-nz;}
    out.push({i,a,b,len,ux,uz,nx,nz,ang:Math.atan2(nx,nz)*180/Math.PI});}
  return out;}

function cullWalls(){

function wallSegR(w,o0,o1,y0,y1,mat){
  if(o1-o0<=.001||y1-y0<=.001)return null;
  const p0=wallPt(w,o0),p1=wallPt(w,o1);
  /* المضلّع = الوجه الداخلي للجدار، فالجدار يُبنى إلى الخارج */
  const cx=(p0[0]+p1[0])/2-w.nx*WT/2, cz=(p0[1]+p1[1])/2-w.nz*WT/2;
  const m=sbox(o1-o0,y1-y0,WT,mat||MAT.rWallS);

function eqMeshR(e){
  const L=EQLIB[e.kind];if(!L)return null;
  const w=+e.w||L.w,h=+e.h||L.h,d=+e.d||L.d;
  const t=faceFor(e);
  const g=new THREE.Group();
  const m=t?facedBox(w,h,d,t,L.col):sbox(w,h,d,smat(L.col,.6,.06));
  g.add(m);

    const pl=sbox(w*1.02,.06,d*1.02,smat(0x6E767D,.55,.35));
    pl.position.y=-h/2+.03;g.add(pl);
    [[-1,-1],[1,-1],[1,1],[-1,1]].forEach(([sx,sz])=>{
      const f=sbox(.05,.05,.05,smat(0x4A5158,.5,.4));
      f.position.set(sx*(w/2-.06),-h/2-.02,sz*(d/2-.06));g.add(f);});}
  const y=(L.mount==='floor')?h/2+.05:(L.mount==='ceil'?ROOM.H-h/2:(+e.y||L.y));

  RWALLS=[];WG={};
  walls.forEach(w=>{
    const G=new THREE.Group();WG[w.i]=G;gRoom.add(G);
    const mid0=wallPt(w,w.len/2);
    RWALLS.push({m:G,n:[w.nx,w.nz],p:[mid0[0],mid0[1]]});
    const dr=(ROOM.door&&ROOM.door.wall===w.i)?ROOM.door:null;
    const wn=(ROOM.win&&ROOM.win.on&&ROOM.win.wall===w.i)?ROOM.win:null;

      if(c.y0>0)G.add(wallSegR(w,c.o0,c.o1,0,c.y0));
      if(c.y1<H)G.add(wallSegR(w,c.o0,c.o1,c.y1,H));
      /* إطار الفتحة */
      const fm=smat(c.k==='door'?0x6E5138:0x8D959B,.55,.1);
      [c.o0,c.o1].forEach(o=>{const s=wallSegR(w,o-.03,o+.03,c.y0,c.y1,fm);if(s)G.add(s);});
      const hd=wallSegR(w,c.o0-.03,c.o1+.03,c.y1-.03,c.y1+.03,fm);if(hd)G.add(hd);

        if(leaf)G.add(leaf);
        const hp=wallPt(w,c.o1-.12);
        const kn=new THREE.Mesh(new THREE.SphereGeometry(.028,10,8),smat(0xB9A16B,.35,.75));
        kn.position.set(hp[0]-w.nx*.02,c.y1*.45,hp[1]-w.nz*.02);G.add(kn);}
      cur=c.o1;});
    G.add(wallSegR(w,cur,w.len,0,H));
    /* وزرة */
    const sk=wallSegR(w,0,w.len,0,.10,smat(0x8E969C,.7,.05));
    if(sk){sk.position.x+=w.nx*.012;sk.position.z+=w.nz*.012;G.add(sk);}
    const mid=wallPt(w,w.len/2);
    if(+M.showLbl)G.add(rlbl('ج'+(w.i+1)+' · '+w.len.toFixed(2)+' م',
      V(mid[0]+w.nx*.22,.34,mid[1]+w.nz*.22),'#7E8B96',.52));});

  const vres=roomCheck();
  const byWall={};
  EQP.forEach((e,i)=>{
    const g=eqMeshR(e);if(!g)return;
    const L=EQLIB[e.kind];
    let best=null,bd=1e9;
    walls.forEach(w=>{
      const vx=e.x-w.a[0],vz=e.z-w.a[1];
      const t=vx*w.ux+vz*w.uz, dp=Math.abs(vx*w.nx+vz*w.nz);

/* ---- مسار الكابلات على جدار وما يتفرّع منه ---- */
function buildRaceway(w,items){
  const G=WG[w.i]||gRoom;
  const tY=Math.min(+M.trayY||2.05,ROOM.H-.15);
  const isTray=(M.trayType!=='trunk'),open=!!+M.trayOpen;
  const h=.10,d=.08;
  const ts=items.map(o=>o.t);
  const o0=Math.max(.10,Math.min(...ts)-.45), o1=Math.min(w.len-.10,Math.max(...ts)+.45);
  if(o1-o0<.3)return;
  const len=o1-o0;
  const mid=wallPt(w,(o0+o1)/2);
  const ang=Math.atan2(w.ux,w.uz)-Math.PI/2;
  const put=(m,off,y,dep)=>{if(!m)return;
    const c=wallPt(w,(o0+o1)/2+ (off||0));
    m.position.set(c[0]+w.nx*(dep||0),y,c[1]+w.nz*(dep||0));
    m.rotation.y=ang;G.add(m);};
  if(isTray){
    const met=new THREE.MeshStandardMaterial({map:TX.tray,roughness:.40,metalness:.70,color:0xffffff});
    const plain=smat(0xB6BBBF,.40,.70);
    put(sbox(len,h,.012,met),0,tY,.006);
    [tY+h/2,tY-h/2].forEach((yy,i)=>{
      put(sbox(len,.012,d,plain),0,yy,.012+d/2);
      put(sbox(len,.024,.010,plain),0,yy+(i===0?-.012:.012),.012+d-.005);});
    const nb=Math.max(2,Math.round(len/.55));
    for(let b=0;b<nb;b++){
      const bo=-len/2+.1+b*((len-.2)/Math.max(nb-1,1));
      const bolt=new THREE.Mesh(new THREE.CylinderGeometry(.008,.008,.014,10),smat(0x8A9096,.4,.8));
      bolt.rotation.x=Math.PI/2;put(bolt,bo,tY,.018);}
  }else{
    const pvc=smat(0xF4F4F2,.66,.02);
    const slot=new THREE.MeshStandardMaterial({map:TX.trunk,roughness:.66,color:0xffffff});
    put(sbox(len,h,.010,pvc),0,tY,.005);
    [tY+h/2,tY-h/2].forEach(yy=>put(sbox(len,.010,d,slot),0,yy,.010+d/2));
    if(!open){
      put(sbox(len,h+.014,.009,pvc),0,tY,.010+d);
      put(sbox(len,.004,.004,smat(0xE4E4E1,.7)),0,tY,.010+d+.006);}}
  /* كابلات داخل المسار */
  if(isTray||open){
    const nW=7;
    for(let i=0;i<nW;i++){
      const cy=tY-h/2+.016+(i%3)*(h*.30);
      const dep=.020+Math.floor(i/3)*(d*.26)+.010;
      const a=wallPt(w,o0+.06),b=wallPt(w,o1-.06);
      G.add(cableRunV(
        V(a[0]+w.nx*dep,cy,a[1]+w.nz*dep),
        V(b[0]+w.nx*dep,cy,b[1]+w.nz*dep),
        WIRE[i%WIRE.length],(i%4===0)?.010:.007,.006+(i%3)*.002));}}
  /* نزول إلى كل جهاز: مجرى + غلاند + رباط */
  items.forEach(({e,t})=>{
    const L=EQLIB[e.kind];
    const hh=+e.h||L.h;
    const top=(L.mount==='floor')?hh+.05:((+e.y||L.y)+hh/2);
    if(Math.abs(top-tY)<.12)return;
    const pa=wallPt(w,t), dep=.012+d*.5;
    const A=V(pa[0]+w.nx*dep,tY-h/2-.01,pa[1]+w.nz*dep);
    const B=V(e.x,top+.02,e.z);
    G.add(conduitTube(A,B,(L.mount==='floor')?.018:.014));
    G.add(glandAt(V(B.x,B.y+.01,B.z)));
    const n=Math.max(1,Math.round(Math.abs(tY-top)/.45));
    for(let i=1;i<=n;i++){
      const u=i/(n+1);
      G.add(tieAt(V(A.x+(B.x-A.x)*u,A.y+(B.y-A.y)*u,A.z+(B.z-A.z)*u),.026,ang));}});
  if(+M.showLbl){const lp=wallPt(w,o0+.75);
    G.add(rlbl2(isTray?'تراي معدني مثقّب':'PVC Trunking',
      Math.round(h*1000)+'×'+Math.round(d*1000)+' مم · ارتفاع '+Math.round(tY*100)+' سم',
      V(lp[0]+w.nx*.30,tY+.30,lp[1]+w.nz*.30),'#0066A7',.74));}}
