/* ---- تحقّق المسافات النظامية ---- */
function eqFoot(e){
  const L=EQLIB[e.kind],w=+e.w||L.w,d=+e.d||L.d,a=(+e.rot||0)*Math.PI/180;
  const c=Math.cos(a),s=Math.sin(a);
  return [[-w/2,-d/2],[w/2,-d/2],[w/2,d/2],[-w/2,d/2]]
    .map(q=>[e.x+q[0]*c+q[1]*s,e.z-q[0]*s+q[1]*c]);}
function eqClearBox(e){
  const L=EQLIB[e.kind];if(!(L.clr>0))return null;
  const w=+e.w||L.w,d=+e.d||L.d,a=(+e.rot||0)*Math.PI/180;
  const c=Math.cos(a),s=Math.sin(a);
  return [[-w/2,d/2],[w/2,d/2],[w/2,d/2+L.clr],[-w/2,d/2+L.clr]]
    .map(q=>[e.x+q[0]*c+q[1]*s,e.z-q[0]*s+q[1]*c]);}
function polyHit(A,B){
  for(const q of A)if(inPoly(q[0],q[1],B))return true;
  for(const q of B)if(inPoly(q[0],q[1],A))return true;
  for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)
    if(segInt(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;
  return false;}
function roomCheck(){
  const msgs=[],bad=[],P=roomPoly();
  EQP.forEach((e,i)=>{
    const L=EQLIB[e.kind];
    const f=eqFoot(e);
    if(!f.every(q=>inPoly(q[0],q[1],P))){
      msgs.push((e.name||L.n)+': خارج حدود الغرفة.');bad.push(i);}
    const cb=eqClearBox(e);
    if(cb){
      if(!cb.every(q=>inPoly(q[0],q[1],P))){
        msgs.push((e.name||L.n)+': المسافة الحرّة أمامه ('+L.clr.toFixed(2)+' م) تخرج عن الغرفة.');
        if(bad.indexOf(i)<0)bad.push(i);}
      EQP.forEach((o,j)=>{if(j===i)return;
        if(polyHit(cb,eqFoot(o))){
          msgs.push((e.name||L.n)+': «'+(o.name||EQLIB[o.kind].n)+'» يقع داخل مسافته الحرّة.');
          if(bad.indexOf(i)<0)bad.push(i);}});}
    EQP.forEach((o,j)=>{if(j<=i)return;
      if(EQLIB[e.kind].mount!==EQLIB[o.kind].mount&&
         Math.abs(((+e.y)||EQLIB[e.kind].y)-((+o.y)||EQLIB[o.kind].y))>1.2)return;
      if(polyHit(f,eqFoot(o))){
        msgs.push((e.name||L.n)+' و«'+(o.name||EQLIB[o.kind].n)+'» متداخلان.');
        if(bad.indexOf(i)<0)bad.push(i);if(bad.indexOf(j)<0)bad.push(j);}});});
  const dr=ROOM.door;
  if(dr){
    const w=roomWalls()[dr.wall];
    if(w){
      const c=wallPt(w,dr.off+dr.w/2);
      const zone=[[c[0]-dr.w/2,c[1]-dr.w/2],[c[0]+dr.w/2,c[1]-dr.w/2],
                  [c[0]+dr.w/2,c[1]+dr.w/2],[c[0]-dr.w/2,c[1]+dr.w/2]];
      EQP.forEach((e,i)=>{if(polyHit(zone,eqFoot(e))){
        msgs.push((e.name||EQLIB[e.kind].n)+': يعترض الباب.');
        if(bad.indexOf(i)<0)bad.push(i);}});}}
  const A=roomArea();
  if(ROOM.on&&A>0&&EQP.length){
    const occ=EQP.reduce((s,e)=>s+((+e.w||EQLIB[e.kind].w)*(+e.d||EQLIB[e.kind].d)),0);
    if(occ/A>.45)msgs.push('المعدّات تشغل '+(occ/A*100).toFixed(0)+'% من أرض الغرفة — اترك ممرّ خدمة كافياً.');}
  if(ROOM.H<2.4)msgs.push('ارتفاع الغرفة '+(+ROOM.H).toFixed(2)+' م أقل من 2.40 م.');
  return {msgs,bad,ok:bad.length===0};}

/* ---- التوزيع التلقائي من المنظومة المحسوبة ---- */
function invCount(){
  const kwp=ARES.reduce((a,r)=>a+(+r.kwp||0),0);
  const per=Math.max(1,+M.invKW||10);
  return Math.max(1,Math.ceil(kwp/per));}
function autoLayout(){
  if(!ROOM.on){log('فعّل الغرفة أولاً.',1);return;}
  const walls=roomWalls().slice().sort((a,b)=>b.len-a.len);
  const B=batCalc();
  const nInv=invCount(), nBat=(M.sysType==='ongrid')?0:B.n;
  const batKind=(M.batChem==='lifepo4')?'batw':'batc';
  const items=[];
  const invL=INVLIB[M.invModel]||INVLIB.gen;
  for(let i=0;i<nInv;i++)items.push({kind:'inv',label:invL.n,
    w:invL.w/1000,h:invL.h/1000,d:invL.d/1000,tag:'INV-'+(i+1)});
  for(let i=0;i<nBat;i++)items.push({kind:batKind,kwh:+(B.vm*B.ah/1000).toFixed(1),
    soc:90,tag:'BAT-'+(i+1)});
  items.push({kind:'db',rows:3,mods:12,tag:'DB-1'});
  items.push({kind:'acdb',tag:'AC-1'});
  if(M.sysType!=='ongrid')items.push({kind:'dcdb',tag:'DC-1'});
  items.push({kind:'earth',tag:'E-1'});
  items.push({kind:'ac',tag:'AC'});
  items.push({kind:'fan',tag:'F-1'});
  items.push({kind:'ext',tag:'FE-1'});
  const out=[];let wi=0,off=.35;
  const gaps=[];
  if(ROOM.door)gaps.push({wall:ROOM.door.wall,a:ROOM.door.off-.25,b:ROOM.door.off+ROOM.door.w+.25});
  if(ROOM.win&&ROOM.win.on)gaps.push({wall:ROOM.win.wall,a:ROOM.win.off-.15,b:ROOM.win.off+ROOM.win.w+.15});
  items.forEach(it=>{
    const L=EQLIB[it.kind];
    const w=(+it.w||L.w);
    for(let guard=0;guard<walls.length+1;guard++){
      const wl=walls[wi%walls.length];
      let o=off;
      for(let pass=0;pass<gaps.length+1;pass++){
        let moved=false;
        gaps.forEach(g=>{if(g.wall===wl.i&&o<g.b&&o+w>g.a){o=g.b;moved=true;}});
        if(!moved)break;}
      if(o+w+.30<=wl.len){off=o+w+.34;
        const c=wallPt(wl,o+w/2);
        const d=(+it.d||L.d);
        out.push(Object.assign({},it,{
          x:c[0]+wl.nx*(d/2+.02), z:c[1]+wl.nz*(d/2+.02),
          rot:(Math.atan2(wl.nx,wl.nz)*180/Math.PI+360)%360,
          y:L.y,name:L.n}));
        return;}
      wi++;off=.35;}
    const c=wallPt(walls[0],.35);
    out.push(Object.assign({},it,{x:c[0],z:c[1],rot:0,y:L.y,name:L.n}));});
  EQP=out;EQSEL=-1;
  const v=roomCheck();
  log('وُزّعت '+EQP.length+' قطعة: '+nInv+' إنفرتر و'+nBat+' بطارية'+
    (v.ok?' — كل المسافات النظامية سليمة.':' — '+v.bad.length+' قطعة بحاجة إلى مراجعة موضعها.'));
  buildRoom();dock();}

/* ---- قراءة DXF ---- */
const DXF_U={1:.0254,2:.3048,4:.001,5:.01,6:1};
function parseDXF(txt){
  const L=txt.split(/\r?\n/);
  const segs=[],polys=[];let units=0,cur=null,mode=null;
  const flush=()=>{
    if(!cur)return;
    if(cur.t==='LINE'&&isFinite(cur.x1)&&isFinite(cur.x2))
      segs.push([[cur.x1,cur.y1],[cur.x2,cur.y2]]);
    else if(cur.v&&cur.v.length>=2)polys.push({pts:cur.v,closed:!!(cur.flag&1)});
    cur=null;};
  for(let i=0;i+1<L.length;i+=2){
    const c=L[i].trim(),v=L[i+1].trim();
    if(c==='9'&&v==='$INSUNITS'&&L[i+2]&&L[i+2].trim()==='70')units=+L[i+3]||0;
    if(c==='0'){
      if(v==='VERTEX'){mode='vtx';continue;}
      if(v==='SEQEND'){mode=null;continue;}
      flush();mode=null;
      if(v==='LINE')cur={t:'LINE'};
      else if(v==='LWPOLYLINE'||v==='POLYLINE'){cur={t:v,v:[],flag:0};mode=(v==='POLYLINE')?'poly':null;}
      continue;}
    if(!cur)continue;
    if(cur.t==='LINE'){
      if(c==='10')cur.x1=+v; else if(c==='20')cur.y1=+v;
      else if(c==='11')cur.x2=+v; else if(c==='21')cur.y2=+v;
    }else{
      if(c==='10')cur.px=+v;
      else if(c==='20'&&isFinite(cur.px))cur.v.push([cur.px,+v]);
      else if(c==='70'&&mode!=='vtx')cur.flag=+v;}}
  flush();
  const all=segs.flat().concat(polys.map(p=>p.pts).flat());
  if(!all.length)throw new Error('لا توجد خطوط أو مضلّعات في الملف.');
  const xs=all.map(q=>q[0]),ys=all.map(q=>q[1]);
  const bb=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];
  return {segs,polys,units,bb,span:Math.max(bb[2]-bb[0],bb[3]-bb[1])};}
function dxfScale(d,force){
  if(force&&DXF_U[force])return DXF_U[force];
  if(DXF_U[d.units])return DXF_U[d.units];
  return d.span>300?.001:(d.span>30?.01:1);}   /* تخمين: أرقام كبيرة ⇒ ملم */
function dxfCandidates(d,sc){
  const out=d.polys.filter(p=>p.closed&&p.pts.length>=3)
    .map((p,i)=>{const q=p.pts.map(a=>[a[0]*sc,-a[1]*sc]);
      return {nm:'مضلّع مغلق '+(i+1),poly:q,area:polyArea(q)};})
    .filter(o=>o.area>1).sort((a,b)=>b.area-a.area);
  const bb=d.bb;
  out.push({nm:'الإطار المحيط بالرسم',area:(bb[2]-bb[0])*(bb[3]-bb[1])*sc*sc,
    poly:[[bb[0]*sc,-bb[3]*sc],[bb[2]*sc,-bb[3]*sc],[bb[2]*sc,-bb[1]*sc],[bb[0]*sc,-bb[1]*sc]]});
  return out.slice(0,8);}
function roomFromPoly(q,nm){
  const xs=q.map(a=>a[0]),zs=q.map(a=>a[1]);
  const mx=Math.min(...xs),mz=Math.min(...zs);
  ROOM.poly=q.map(a=>[+(a[0]-mx).toFixed(3),+(a[1]-mz).toFixed(3)]);
  ROOM.on=1;ROOM.src=nm||'مستورد';
  const bb=roomBB();ROOM.W=+(bb.x1-bb.x0).toFixed(2);ROOM.L=+(bb.z1-bb.z0).toFixed(2);
  log('الغرفة: '+roomArea().toFixed(2)+' م² · إطار '+ROOM.W+'×'+ROOM.L+' م ('+(nm||'مستورد')+')');
  buildRoom();fitRoom();dock();}
function loadDXF(f){
  if(!f)return;
  if(/\.dwg$/i.test(f.name)){
    log('صيغة DWG ثنائية ولا تُقرأ في المتصفح. من AutoCAD: Save As → AutoCAD DXF، أو صدّر PDF أو صورة.',1);return;}
  const r=new FileReader();
  r.onload=()=>{try{DXF=parseDXF(String(r.result));
      log('DXF: '+DXF.polys.length+' مضلّعاً و'+DXF.segs.length+' خطاً. اختر محيط الغرفة ثم اضغط «استعمل».');
      dock();}
    catch(e){log('DXF: '+e.message,1);}};
  r.onerror=()=>log('تعذّر قراءة الملف.',1);
  r.readAsText(f);}

/* ---- كاميرا الغرفة ---- */
function busiestWall(){
  const walls=roomWalls();let best=null,bn=-1;
  walls.forEach(w=>{let n=0;
    EQP.forEach(e=>{const vx=e.x-w.a[0],vz=e.z-w.a[1];
      const t=vx*w.ux+vz*w.uz,dp=Math.abs(vx*w.nx+vz*w.nz);
      if(t>=-.3&&t<=w.len+.3&&dp<1.0)n++;});
    if(n>bn){bn=n;best=w;}});
  return bn>0?best:null;}
function fitRoom(){
  const bb=roomBB(),w=busiestWall();
  if(w){
    const m=wallPt(w,w.len/2);
    tgt.set(m[0]+w.nx*.45,1.25,m[1]+w.nz*.45);
    rho=Math.max(w.len,3.2)*.62+1.5;
    theta=Math.atan2(w.nz,w.nx);phi=1.30;
  }else{
    tgt.set((bb.x0+bb.x1)/2,Math.max(1.1,ROOM.H*.42),(bb.z0+bb.z1)/2);
    rho=Math.max(bb.x1-bb.x0,bb.z1-bb.z0)*1.05+2.4;theta=-1.05;phi=1.18;}
  place();}

  if(RVIEW)fitRoom(); else fit();}

/* ---- لوحات الغرفة ---- */
function eqOnWall(w){
  const out=[];
  EQP.forEach((e,i)=>{
    const vx=e.x-w.a[0],vz=e.z-w.a[1];
    const t=vx*w.ux+vz*w.uz;
    const dp=Math.abs(vx*w.nx+vz*w.nz);
    const L=EQLIB[e.kind];
    if(t>=-.2&&t<=w.len+.2&&dp<=(+e.d||L.d)/2+.40)out.push({e,i,t});});
  return out.sort((a,b)=>a.t-b.t);}
function sheetRoomPlan(){
  const W=760,H=520,mg=70;
  if(!ROOM.on)return SV(W,H,tx(W/2,H/2,'الغرفة غير مفعّلة',{s:12,c:'#5b6b7a'}));

  const sc=Math.min((W-2*mg)/Math.max(rw,.5),(H-2*mg-30)/Math.max(rl,.5));
  const X=x=>mg+(x-bb.x0)*sc, Z=z=>mg+(z-bb.z0)*sc;
  const pth=p=>'M'+p.map(q=>X(q[0]).toFixed(1)+','+Z(q[1]).toFixed(1)).join(' L')+' Z';

    if(dr){const p0=wallPt(w,dr.off),p1=wallPt(w,dr.off+dr.w);
      b+=ln(X(p0[0]),Z(p0[1]),X(p1[0]),Z(p1[1]),{c:'#fff',w:5});
      b+=ln(X(p0[0]),Z(p0[1]),X(p0[0]+w.nx*dr.w),Z(p0[1]+w.nz*dr.w),{c:'#8C6239',w:1.6});
      b+=tx(X((p0[0]+p1[0])/2+w.nx*.45),Z((p0[1]+p1[1])/2+w.nz*.45)+3,
        'باب '+(dr.w*100).toFixed(0)+'×'+(dr.h*100).toFixed(0),{s:8,b:1,c:'#8C6239'});}
    if(wn){const p0=wallPt(w,wn.off),p1=wallPt(w,wn.off+wn.w);
      b+=ln(X(p0[0]),Z(p0[1]),X(p1[0]),Z(p1[1]),{c:'#8FB6CE',w:5});}
    const mid=wallPt(w,w.len/2);
    b+=tx(X(mid[0])+w.nx*16,Z(mid[1])+w.nz*16+3,'ج'+(w.i+1)+' · '+w.len.toFixed(2),{s:8,c:'#5b6b7a'});});
  const vres=roomCheck();
  EQP.forEach((e,i)=>{

  b+=tx(W/2,H-12,'المساحة '+roomArea().toFixed(2)+' م² · الارتفاع '+(+ROOM.H).toFixed(2)+
    ' م · المنطقة الوردية = المسافة الحرّة النظامية أمام كل قطعة',{s:8.5,c:'#5b6b7a'});
  return SV(W,H,b);}
function sheetRoomElev(wi){
  const W=760,H=360,mg=64;

  const sc=Math.min((W-2*mg)/Math.max(w.len,.5),(H-2*mg)/Math.max(+ROOM.H,.5));

  const dr=(ROOM.door&&ROOM.door.wall===wi)?ROOM.door:null;

    b+=tx(X(dr.off+dr.w/2),Y(dr.h/2),'باب',{s:9,b:1,c:'#8C6239'});}
  if(wn){b+=rc(X(wn.off),Y(wn.sill+wn.h),wn.w*sc,wn.h*sc,'#E4F0F7','#4E7E9B');
    b+=tx(X(wn.off+wn.w/2),Y(wn.sill+wn.h/2),'شبّاك',{s:9,b:1,c:'#4E7E9B'});}
  eqOnWall(w).forEach(({e,t})=>{

    b+=rc(X(t-ew/2),Y(yc+eh/2),ew*sc,eh*sc,'#dfe6ec','#0B2239');

  b+=dimV(Y(+ROOM.H),Y(0),X(w.len)+30,(+ROOM.H).toFixed(2)+' م');

  return SV(W,H,b);}
function eqSchedule(){
  const g={};
  EQP.forEach(e=>{const L=EQLIB[e.kind];
    const k=e.kind+'|'+((+e.w||L.w).toFixed(2))+'|'+((+e.h||L.h).toFixed(2));
    (g[k]=g[k]||{L,e,n:0,tags:[]});g[k].n++;g[k].tags.push(e.tag||'');});
  return Object.values(g);}

const PVCOL=['#0066A7','#F1471E','#00A06B','#7A5CC4'];
function chartMonthly(E){
  const W=760,H=300,ml=64,mr=18,mt=26,mb=46;
  const pw=W-ml-mr,ph=H-mt-mb;
  const tot=E.monT;
  const mx=Math.max(...tot,1);
  const step=Math.pow(10,Math.floor(Math.log10(mx)));
  const nice=Math.ceil(mx/step*1.02)*step;
  const Y=v=>mt+ph-(v/nice)*ph;
  let b='';
  for(let i=0;i<=4;i++){const v=nice*i/4;
    b+=ln(ml,Y(v),W-mr,Y(v),{c:'#e6ebf0',w:1});
    b+=tx(ml-8,Y(v)+3.5,Math.round(v).toLocaleString('en-US'),{s:9,a:'end',c:'#5b6b7a'});}
  b+=ln(ml,Y(0),W-mr,Y(0),{c:'#b6c1cb',w:1.2});
  const bw=pw/12,bar=Math.min(30,bw*.6);
  E.monT.forEach((v,m)=>{
    const cx=ml+bw*(m+.5),x0=cx-bar/2;
    let acc=0;
    E.arrays.forEach((y,ai)=>{
      const val=y.mon[m].E; if(val<=0)return;
      const y1=Y(acc+val),y0=Y(acc),h=Math.max(0,y0-y1-(ai?2:0));
      const top=(ai===E.arrays.length-1);
      b+=`<path d="${top
        ?`M${x0.toFixed(1)},${(y1+4).toFixed(1)} a4,4 0 0 1 4,-4 h${(bar-8).toFixed(1)} a4,4 0 0 1 4,4 v${(h-4).toFixed(1)} h${(-bar).toFixed(1)} Z`
        :`M${x0.toFixed(1)},${y1.toFixed(1)} h${bar.toFixed(1)} v${h.toFixed(1)} h${(-bar).toFixed(1)} Z`}"
        fill="${PVCOL[ai%PVCOL.length]}"><title>${y.name||'مصفوفة'} · ${MFULL[m]} · ${Math.round(val).toLocaleString('en-US')} kWh</title></path>`;
      acc+=val;});
    if(v>0)b+=tx(cx,Y(v)-6,Math.round(v).toLocaleString('en-US'),{s:8.5,b:1,c:'#16222e'});
    b+=tx(cx,H-mb+16,MNAME[m],{s:9.5,c:'#5b6b7a'});});
  b+=tx(ml-8,mt-10,'kWh',{s:9,a:'end',c:'#5b6b7a'});
  if(E.arrays.length>1){
    let lx=ml;
    E.arrays.forEach((y,ai)=>{
      b+=`<rect x="${lx}" y="${H-16}" width="11" height="11" rx="2" fill="${PVCOL[ai%PVCOL.length]}"/>`;
      b+=tx(lx+15,H-7,(y.name||('مصفوفة '+(ai+1)))+' · '+Math.round(y.az)+'°',{s:9,a:'start',c:'#5b6b7a'});
      lx+=Math.max(120,(y.name||'').length*7+90);});}
  return SV(W,H,b);}

const MREP_DAY=[17,16,16,15,15,11,17,16,15,15,14,10];

function heatColor(v){
  if(v<=0.005)return HEAT[0];
  const i=Math.min(HEAT.length-1,1+Math.floor(v*(HEAT.length-1)));
  return HEAT[i];}
function shadowStats(){
  const arrs=ARR.filter(a=>TPL[a.tpl]);
  const HR=[];for(let h=5;h<=19;h++)HR.push(h);
  const area=a=>Math.max(0.01,(+a.L)*(+a.S));
  const wTot=arrs.reduce((s,a)=>s+area(a),0)||1;
  const heat=[],mon=[];
  for(let m=0;m<12;m++){
    const row=[];let sun=0,shd=0,peak=0,peakH=null;
    HR.forEach(h=>{
      const s=solar(+M.lat,+M.lon,+M.tz,m+1,MREP_DAY[m],h);
      if(!(s.alt>1)){row.push(null);return;}
      let f=0;arrs.forEach(a=>{f+=shadeFracSun(a,s.alt,s.az)*area(a);});
      f/=wTot;row.push(f);sun++;shd+=f;
      if(f>peak){peak=f;peakH=h;}});
    heat.push(row);
    mon.push({m,avg:sun?shd/sun:0,hours:sun,lost:shd,peak,peakH});}
  const base=energyAll();
  const attrib=[];
  const run=()=>energyAll().year;
  OBSW.forEach((o,i)=>{
    const keep=OBSW;OBSW=OBSW.filter((_,k)=>k!==i);
    const y=run();OBSW=keep;
    attrib.push({name:o.name||ROLE[o.kind]||'عائق',kind:o.kind,h:o.h,gain:Math.max(0,y-base.year)});});
  if(+M.bPar>0){const p=M.bPar;M.bPar=0;const y=run();M.bPar=p;
    attrib.push({name:'العمامة المحيطة',kind:'par',h:+M.bPar,gain:Math.max(0,y-base.year)});}
  let clear=base.year;
  {const keep=OBSW,p=M.bPar;OBSW=[];M.bPar=0;clear=run();OBSW=keep;M.bPar=p;}
  attrib.sort((a,b)=>b.gain-a.gain);
  const worst=mon.reduce((a,b)=>b.avg>a.avg?b:a,mon[0]);
  return {HR,heat,mon,arrs,base,clear,attrib,worst,
    lossY:Math.max(0,clear-base.year),
    lossPc:clear>0?Math.max(0,clear-base.year)/clear:0};}

function heatShadow(st){
  const W=760,mt=34,ml=74,mr=90,cw=Math.floor((W-ml-mr)/st.HR.length),ch=22;
  const H=mt+12*ch+56;
  let b='';
  st.HR.forEach((h,i)=>b+=tx(ml+cw*(i+.5),mt-8,String(h),{s:9,c:'#5b6b7a'}));
  b+=tx(ml+(st.HR.length*cw)/2,mt-22,'الساعة المحلية',{s:9.5,b:1,c:'#16222e'});
  st.heat.forEach((row,m)=>{
    const y=mt+m*ch;
    b+=tx(ml-8,y+ch/2+3.5,MFULL[m],{s:9,a:'end',c:'#5b6b7a'});
    row.forEach((v,i)=>{
      const x=ml+i*cw;
      if(v===null){b+=`<rect x="${x+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="2" fill="#fafbfc"/>`;return;}
      b+=`<rect x="${x+1}" y="${y+1}" width="${cw-2}" height="${ch-2}" rx="2" fill="${heatColor(v)}"><title>${MFULL[m]} ${st.HR[i]}:00 — مظلّل ${(v*100).toFixed(0)}%</title></rect>`;
      if(v>=0.08)b+=tx(x+cw/2,y+ch/2+3.5,(v*100).toFixed(0),{s:8,b:1,c:v>0.45?'#fff':'#16222e'});});});
  let lx=ml,ly=H-26;
  b+=tx(ml-8,ly+9,'المفتاح',{s:9,a:'end',c:'#5b6b7a'});
  HEAT.forEach((c,i)=>{b+=`<rect x="${lx}" y="${ly}" width="28" height="13" fill="${c}" stroke="#e6ebf0" stroke-width=".5"/>`;
    b+=tx(lx+14,ly+26,i===0?'0%':(i===HEAT.length-1?'100%':''),{s:8,c:'#5b6b7a'});lx+=28;});
  b+=tx(lx+8,ly+10,'نسبة مساحة الألواح المظللة',{s:9,a:'start',c:'#5b6b7a'});
  return SV(W,H,b);}

function sheetElev(kind){
  const T=TPL[M.tpl],W=760,H=400,mx=70,my=58,rear=(kind==='rear');
  const yEdge=(T.bld==='H')?M.clearH:(T.flat?M.h1:(rear?M.h2:M.h1));
  const hiTop=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2)+.3;
  const sc=Math.min((W-2*mx)/M.L,(H-2*my)/hiTop);
  const X=x=>mx+x*sc,Y=y=>H-my-y*sc;
  const xs=R.g.bx||[0,M.L];
  const postTop=z=>(T.bld==='H')?M.clearH:((T.flat?M.h1:(M.h2+(M.h1-M.h2)*(z/M.S)))-M.td-.02);
  let b='';
  b+=ln(mx-34,Y(0),W-mx+34,Y(0),{c:'#8d8577',w:2});
  for(let i=0;i<30;i++)b+=ln(mx-34+i*((W-2*mx+68)/30),Y(0),mx-40+i*((W-2*mx+68)/30),Y(0)+7,{c:'#8d8577',w:.8});
  // الصفوف البعيدة متقطعة
  (R.g.rows||[]).forEach((z,k)=>{
    const near=rear?(z===Math.min(...R.g.rows)):(z===Math.max(...R.g.rows));
    const st=near?{w:3,c:'#53606c'}:{w:1.2,c:'#9aa6b0',dash:1};
    xs.forEach(x=>{b+=ln(X(x),Y(0),X(x),Y(postTop(z)),st);
      if(near)b+=rc(X(x)-13,Y(0)-4,26,5,'#53606c','#16222e');});});
  if(T.bld==='C'){ // حائط ارتكاز بدل الأعمدة
    b+=rc(X(0)-6,Y(yEdge-M.td),M.L*sc+12,(yEdge-M.td)*sc,'#e6e0d4','#8d8577');
    b+=tx(X(M.L*.5),Y((yEdge-M.td)*.5),'حائط الارتكاز',{s:11,b:1,c:'#5b6b7a'});}
  // حافة السقف + الجمالون
  b+=ln(X(0),Y(yEdge),X(M.L),Y(yEdge),{w:2.6});
  if(T.bld==='B'){
    b+=ln(X(0),Y(yEdge-M.td),X(M.L),Y(yEdge-M.td),{w:1.8});
    const n=R.g.nWeb||8;
    for(let i=0;i<=n;i++)b+=ln(X(M.L*i/n),Y(yEdge),X(M.L*i/n),Y(yEdge-M.td),{c:'#9aa6b0',w:1});
    if(M.diag)for(let i=0;i<n;i++)b+=(i%2===0)?ln(X(M.L*i/n),Y(yEdge-M.td),X(M.L*(i+1)/n),Y(yEdge),{c:'#F1471E',w:1.1})
      :ln(X(M.L*i/n),Y(yEdge),X(M.L*(i+1)/n),Y(yEdge-M.td),{c:'#F1471E',w:1.1});
    b+=tx(X(M.L*.5),Y(yEdge)-9,'الجمالون الطولي C1/C2 — '+M.secT+' / '+M.secB,{s:9,b:1});
  }else{
    xs.forEach(x=>b+=ln(X(x),Y(yEdge),X(x),Y(yEdge-Math.min(M.td,yEdge*.5)),{c:'#9aa6b0',w:1}));
    b+=ln(X(0),Y(yEdge-Math.min(M.td,yEdge*.5)),X(M.L),Y(yEdge-Math.min(M.td,yEdge*.5)),{w:1.4,c:'#9aa6b0'});}
  // تربيط قطري في البحرين الطرفيين
  if(xs.length>1&&T.bld!=='C'){
    const zz=rear?Math.min(...(R.g.rows||[0])):Math.max(...(R.g.rows||[0]));
    [[xs[0],xs[1]],[xs[xs.length-2],xs[xs.length-1]]].forEach(([a,c])=>{
      b+=ln(X(a),Y(.2),X(c),Y(postTop(zz)-.15),{c:'#F1471E',w:1.4});
      b+=ln(X(c),Y(.2),X(a),Y(postTop(zz)-.15),{c:'#F1471E',w:1.4});});
    b+=tx(X((xs[0]+xs[1])/2),Y(0)+22,'B1 تربيط',{s:9,c:'#F1471E',b:1});}
  if(T.bld==='H'){
    b+=ln(X(0),Y(M.clearH+M.ridge),X(M.L),Y(M.clearH+M.ridge),{c:'#9aa6b0',w:1.2,dash:1});
    b+=tx(X(M.L*.5),Y(M.clearH+M.ridge)-7,'خط الجملون',{s:9,c:'#5b6b7a'});}
  b+=dimV(Y(0),Y(yEdge),X(0)-26,yEdge.toFixed(2));
  if(xs.length>1)b+=dimH(X(xs[0]),X(xs[1]),Y(0)+32,(xs[1]-xs[0]).toFixed(2));
  b+=dimH(X(0),X(M.L),Y(0)+54,M.L.toFixed(2)+' م');
  b+=tx(W/2,26,rear?'واجهة خلفية (الجهة المرتفعة)':'واجهة أمامية (الجهة المنخفضة)',{s:12,b:1,c:'#0B2239'});
  b+=tx(W-mx,H-12,'الأعمدة البعيدة مرسومة متقطعة',{s:9,a:'end',c:'#5b6b7a'});
  return SV(W,H,b);}

function snap(th,ph){
  const t0=theta,p0=phi;

  renderer.render(scene,camera);
  let d='';try{d=renderer.domElement.toDataURL('image/png');}catch(e){d='';}
  theta=t0;phi=p0;place();renderer.render(scene,camera);
  return d;}

          rot:(Math.atan2(w0.nx,w0.nz)*180/Math.PI+360)%360,y:L.y});

      add.appendChild(b);});

        <td class="n">${e.tag||(i+1)}</td><td>${e.name||EQLIB[e.kind].n}</td>

      t2.querySelectorAll('button').forEach(b=>b.onclick=()=>{

      NR('الدوران (°)',e.rot||0,15,0,345,v=>e.rot=v);
      if(L.mount==='wall')NR('منسوب المركز (م)',(+e.y||L.y),.05,.2,3,v=>e.y=v);
      NR('العرض (م)',(+e.w||L.w),.01,.05,4,v=>e.w=v);
      NR('الارتفاع (م)',(+e.h||L.h),.01,.05,3,v=>e.h=v);
      NR('العمق (م)',(+e.d||L.d),.01,.05,2,v=>e.d=v);
      const rb=document.createElement('div');rb.className='chips';
      const bd=document.createElement('button');bd.textContent='حذف القطعة';bd.className='o';
      bd.onclick=()=>{EQP.splice(EQSEL,1);EQSEL=-1;buildRoom();dock();};rb.appendChild(bd);
      el.appendChild(rb);}

    grp('مسارات الكابلات والإظهار');
    ['trayType','trayY','trayOpen','showCab','showLbl','showDim3','roomBg'].forEach(k=>field(el,k));
    tip('المسار يُبنى تلقائياً على كل جدار عليه معدّات، ويمتدّ من أول قطعة إلى آخرها، وينزل منه مجرى مرن إلى كل جهاز مع غلاند وأربطة. الكابلات تظهر داخل المسار عندما يكون <b>تراي</b> أو <b>مفتوحاً</b>.');
    const pc=document.createElement('div');pc.className='chips';
    const pb=document.createElement('button');pb.textContent='📷 حفظ صورة PNG للمشهد';
    pb.onclick=()=>{if(!RVIEW)setRoomView(true);setTimeout(roomPNG,80);};pc.appendChild(pb);
    el.appendChild(pc);

    grp('تحقّق المسافات');
    {const v=roomCheck();
     if(v.ok)tip('<span class="tag t-ok">سليم</span> كل القطع داخل الغرفة، والمسافات الحرّة خالية، ولا شيء يعترض الباب.');
     else{const dd=document.createElement('div');dd.className='note';
       dd.innerHTML='<b>'+v.bad.length+' قطعة تحتاج مراجعة:</b><br>• '+v.msgs.join('<br>• ');el.appendChild(dd);}}
    const rp=document.createElement('button');rp.textContent='فتح مخططات الغرفة وتفاصيلها';
    rp.className='o on';rp.style.cssText='display:block;width:100%;margin:8px 0;padding:10px';
    rp.onclick=roomReport;el.appendChild(rp);
  } else if(TAB==='ai'){
    grp('تعديل التصميم بالوصف');
    tip('اكتب بالعربي ما تريد. أمثلة:<br>• «موقف سيارات طول 18 بحر 5.5 ميل 12 أعمدة 120x120»<br>• «هنغار طول 30 بحر 15 ارتفاع صافي 6 جملون 2.2»<br>• «برغولا كابولي طول 6 بحر 3 ثروبولت»<br>• «بدون أرجل بين حائطين بحر 7.4 ريح 120 بدون أقطار»<br>• «الارتفاع الامامي 1.8 والخلفي 2.8 ألواح بورتريه»');
    const w=document.createElement('div');w.id='cmd';
    const ta=document.createElement('textarea');ta.placeholder='اكتب الوصف هنا…';
    const b=document.createElement('button');b.textContent='طبّق';b.className='o on';
    b.onclick=()=>{if(ta.value.trim())aiApply(ta.value);};
    w.appendChild(ta);w.appendChild(b);el.appendChild(w);
    grp('سجل التعديلات');
    const lg=document.createElement('div');lg.id='log';el.appendChild(lg);
    tip('المحرّك يعمل محلياً على الجهاز بدون إنترنت: يفهم الأرقام والوحدات والمقاطع وأسماء النماذج وطرق التثبيت. أي وصف لا يفهمه يخبرك به بدل تنفيذ تخمين.');
  } else if(TAB==='out'){
    grp('المخرجات');
    [['التقرير الفني الموقّع — بلدية / نقابة (بدون تسعير)',report],
     ['الخرائط التنفيذية (8 لوحات + قائمة قطع)',shop],
     ['دراسة الكلفة — مستند منفصل',costReport],
     ['تقرير الإنتاجية والمنظومة — إنتاج · أحمال · بطاريات · تشريج',energyReport],
     ['تقرير الظلال التفصيلي — يومي · شهري · سنوي',shadowReport],
     ['غرفة الكهرباء — مخطط أفقي · واجهات · جدول معدّات',roomReport]].forEach(([n,fn])=>{
      const b=document.createElement('button');b.textContent=n;b.className='o on';b.style.cssText='display:block;width:100%;margin:6px 0;padding:10px';
      b.onclick=fn;el.appendChild(b);});
    tip('التقرير الفني موجّه إلى البلدية ونقابة المهندسين وخالٍ من أي تسعير، ويتضمن سلسلة رياح كاملة (EN 1991-1-4) واستقراراً عاماً وتصريحاً موقّعاً. الكلفة في مستند منفصل.');
    grp('معطيات التسعير');['price','fab','pAnch','pvPrice','cont','marg','vat'].forEach(k=>field(el,k));
    grp('ملخص سريع');
    const t=document.createElement('table');
    t.innerHTML=`<tr><th>وزن الحديد</th><td class="n">${R.tot.toFixed(0)} كغ</td></tr>
     <tr><th>كغ/م²</th><td class="n">${R.kgm2.toFixed(1)}</td></tr>
     <tr><th>الاستغلال</th><td class="n">${(R.util*100).toFixed(0)}%</td></tr>
     <tr><th>الهبوط</th><td class="n">L/${R.defR.toFixed(0)}</td></tr>
     <tr><th>شدّ المسامير</th><td class="n">${R.boltT.toFixed(1)} kN</td></tr>
     <tr><th>التكلفة</th><td class="n">$${R.total.toFixed(0)}</td></tr>`;
    el.appendChild(t);
  } else if(TAB==='id'){
    grp('الهوية البصرية');
    tip('الشعار المرسوم داخل المنصة تقريبي. ارفع ملف الشعار الرسمي (PNG بخلفية شفافة) ليُستخدم في كل التقارير والخرائط.');
    const f1=document.createElement('input');f1.type='file';f1.accept='image/*';
    f1.onchange=e=>rd(e.target.files[0],s=>{LOGO_IMG=s;save();document.getElementById('logoBox').innerHTML=logoHTML(32);dock();});
    const r1=document.createElement('div');r1.className='f';const l1=document.createElement('label');l1.textContent='شعار iCOOL';
    r1.appendChild(l1);r1.appendChild(f1);el.appendChild(r1);
    const f2=document.createElement('input');f2.type='file';f2.accept='image/*';
    f2.onchange=e=>rd(e.target.files[0],s=>{SIGN_IMG=s;save();dock();});
    const r2=document.createElement('div');r2.className='f';const l2=document.createElement('label');l2.textContent='التوقيع/الختم';
    r2.appendChild(l2);r2.appendChild(f2);el.appendChild(r2);
    const pv=document.createElement('div');pv.style.cssText='margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:8px';
    pv.innerHTML=logoHTML(46)+(SIGN_IMG?`<br><img src="${SIGN_IMG}" style="max-height:60px;margin-top:6px">`:'');
    el.appendChild(pv);
    if(LOGO_IMG||SIGN_IMG){const b=document.createElement('button');b.textContent='حذف الملفات المرفوعة';
      b.onclick=()=>{LOGO_IMG=SIGN_IMG=null;save();document.getElementById('logoBox').innerHTML=logoHTML(32);dock();};el.appendChild(b);}
  }
}
function field(el,k){
  const f=F[k];if(!f)return;
  const row=document.createElement('div');row.className='f';
  const lab=document.createElement('label');lab.textContent=f.l;row.appendChild(lab);
  if(f.t==='r'){
    const i=document.createElement('input');i.type='range';i.min=f.min;i.max=f.max;i.step=f.st;i.value=M[k];
    const v=document.createElement('div');v.className='v';v.textContent=(+M[k]).toFixed(2);
    i.oninput=()=>{M[k]=+i.value;v.textContent=(+M[k]).toFixed(2);build();};
    row.appendChild(i);row.appendChild(v);
  }else if(f.t==='s'){
    const s=document.createElement('select');
    f.o.forEach(o=>{const val=Array.isArray(o)?o[0]:o,t=Array.isArray(o)?o[1]:o;
      const op=document.createElement('option');op.value=val;op.textContent=t;
      if(String(M[k])===String(val))op.selected=true;s.appendChild(op);});
    s.onchange=()=>{M[k]=f.num?+s.value:s.value;build();};row.appendChild(s);
  }else if(f.t==='n'){
    const i=document.createElement('input');i.type='number';i.step=f.st||1;
    if(f.min!==undefined)i.min=f.min; if(f.max!==undefined)i.max=f.max;
    i.value=M[k];
    i.oninput=()=>{const v=parseFloat(i.value);if(isFinite(v)){M[k]=v;build();}};
    row.appendChild(i);
  }else{
    const i=document.createElement('input');i.type='text';i.value=M[k]||'';
    i.oninput=()=>{M[k]=i.value;};row.appendChild(i);}
  el.appendChild(row);}

/* ---------- تتبّع الصورة ---------- */
function rd(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f);}
function loadTrace(f){rd(f,s=>{const im=new Image();im.onload=()=>{TR.img=im;TR.pts=[];TR.sc=null;paint();};im.src=s;});}
function paint(){
  const cv=document.getElementById('trace');if(!cv)return;
  const W=cv.parentElement.clientWidth-24||320;
  cv.width=W;cv.height=Math.round(W*0.72);
  const c=cv.getContext('2d');
  c.fillStyle='#f7f9fb';c.fillRect(0,0,cv.width,cv.height);
  if(TR.img){
    const r=Math.min(cv.width/TR.img.width,cv.height/TR.img.height);
    TR.dw=TR.img.width*r;TR.dh=TR.img.height*r;TR.ox=(cv.width-TR.dw)/2;TR.oy=(cv.height-TR.dh)/2;
    c.drawImage(TR.img,TR.ox,TR.oy,TR.dw,TR.dh);
  }else{c.fillStyle='#9aa6b0';c.font='13px Tajawal';c.textAlign='center';
    c.fillText('ارفع صورة المخطط أولاً',cv.width/2,cv.height/2);}
  if(TR.p1&&TR.p2){c.strokeStyle='#F1471E';c.lineWidth=2;c.beginPath();
    c.moveTo(TR.p1.x,TR.p1.y);c.lineTo(TR.p2.x,TR.p2.y);c.stroke();}
  if(TR.pts.length){
    c.strokeStyle='#0066A7';c.fillStyle='rgba(0,102,167,.14)';c.lineWidth=2;
    c.beginPath();TR.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y));
    if(TR.pts.length>2)c.closePath();c.fill();c.stroke();
    c.fillStyle='#0066A7';TR.pts.forEach((p,i)=>{c.beginPath();c.arc(p.x,p.y,4,0,7);c.fill();});}
  const st=document.getElementById('trst');
  if(st)st.innerHTML=`الوضع: <b>${TR.mode==='scale'?'مقياس':'محيط'}</b> · نقاط: ${TR.pts.length} · `+
    (TR.sc?`المقياس: ${TR.sc.toFixed(1)} px/م`:'<b style="color:#c02617">لا مقياس بعد</b>');}
function onTrace(e){
  const cv=e.target,r=cv.getBoundingClientRect();
  const p={x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height};
  if(TR.mode==='scale'){
    if(!TR.p1){TR.p1=p;}
    else{TR.p2=p;
      const d=prompt('المسافة الحقيقية بين النقطتين بالمتر:','8.07');
      const v=parseFloat(num(String(d||'')).replace(',','.'));
      if(v>0){TR.sc=Math.hypot(TR.p2.x-TR.p1.x,TR.p2.y-TR.p1.y)/v;}
      TR.mode='poly';}
  }else TR.pts.push(p);
  paint();}

/* ---------- تخزين ---------- */
function save(){try{localStorage.setItem('icool_ss',JSON.stringify({LOGO_IMG,SIGN_IMG}));}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem('icool_ss')||'{}');
  if(s.LOGO_IMG)LOGO_IMG=s.LOGO_IMG; if(s.SIGN_IMG)SIGN_IMG=s.SIGN_IMG;}catch(e){}}

/* ---------- كاميرا ---------- */
let rho=24,theta=-1.05,phi=1.02,tgt=new THREE.Vector3(5,1.5,3);
function place(){camera.position.set(tgt.x+rho*Math.sin(phi)*Math.cos(theta),tgt.y+rho*Math.cos(phi),tgt.z+rho*Math.sin(phi)*Math.sin(theta));camera.lookAt(tgt);}
function fit(){const T=TPL[M.tpl];
  const hi=(T.bld==='H')?M.clearH+M.ridge:Math.max(M.h1,M.h2||M.h1);
  if(SITE&&(ARR.length>1||M.bShape==='kml')){
    tgt.set(SITE.bb[0]/2-M.bOX,hi*.45,SITE.bb[1]/2-M.bOZ);
    rho=Math.max(SITE.bb[0],SITE.bb[1])*1.7+8;place();return;}
  tgt.set(M.L/2,hi*.45,M.S/2);rho=Math.max(M.L,M.S)*1.85+5;place();}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;
  if(w<10||h<10)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',()=>{resize();paint();});
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);
const el=renderer.domElement;let drag=false,lx=0,ly=0,pinch=0;
const dst=e=>Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
function down(x,y){drag=true;lx=x;ly=y;}
function mv(x,y){if(!drag)return;theta-=(x-lx)*.008;phi=Math.max(.07,Math.min(1.55,phi-(y-ly)*.006));lx=x;ly=y;place();}
el.addEventListener('mousedown',e=>down(e.clientX,e.clientY));
addEventListener('mousemove',e=>mv(e.clientX,e.clientY));
addEventListener('mouseup',()=>drag=false);
el.addEventListener('wheel',e=>{e.preventDefault();rho=Math.max(3,Math.min(300,rho+e.deltaY*.03));place();},{passive:false});
el.addEventListener('touchstart',e=>{if(e.touches.length===1)down(e.touches[0].clientX,e.touches[0].clientY);else if(e.touches.length===2){drag=false;pinch=dst(e);}},{passive:true});
el.addEventListener('touchmove',e=>{e.preventDefault();
 if(e.touches.length===1)mv(e.touches[0].clientX,e.touches[0].clientY);
 else if(e.touches.length===2){const d=dst(e);rho=Math.max(3,Math.min(300,rho*(pinch/d)));pinch=d;place();}},{passive:false});
el.addEventListener('touchend',()=>drag=false,{passive:true});
document.getElementById('vCover').onclick=e=>{gC.visible=!gC.visible;e.target.classList.toggle('on',gC.visible);};
document.getElementById('vDim').onclick=e=>{gD.visible=!gD.visible;e.target.classList.toggle('on',gD.visible);};
document.getElementById('vSite').onclick=e=>{const v=!gSite.visible;gSite.visible=v;gB.visible=v;e.target.classList.toggle('on',v);};
document.getElementById('vRoom').onclick=()=>{ROOM.on=1;setRoomView(!RVIEW);dock();};
document.getElementById('vFit').onclick=()=>{RVIEW?fitRoom():fit();};
document.getElementById('vDock').onclick=e=>{
  const d=document.getElementById('dock');d.classList.toggle('min');
  e.target.textContent=d.classList.contains('min')?'▲':'▼';setTimeout(resize,260);};

/* ---------- تشغيل ---------- */
load();
document.getElementById('logoBox').innerHTML=logoHTML(32);
drawTabs();build();fit();dock();resize();
(function loop(){requestAnimationFrame(loop);animTick();cullWalls();renderer.render(scene,camera);})();
</script>
